        burst('#ffffff', 50);
        shake(8);
        toast('✨ 一键合成完成！共获得 ' + merged + ' 只闪耀宠物');
        updateHUD();
        renderPetPage();
        updatePetFab();
        checkAchievements();
      });
      return;
    }
    if(el.dataset.task){
      if(!state.daily) return;
      const t = state.daily.tasks.find(x => x.id === el.dataset.task);
      if(!t || t.claimed) return;
      const p = state.daily.progress[t.type] || 0;
      if(p < t.n) return;
      t.claimed = true;
      if(t.reward.coins) state.coins += t.reward.coins;
      if(t.reward.gems)  state.gems  += t.reward.gems;
      beep(1100, .2, 'sine', .06);

      renderEventPage();

      if(!p) return;
      if(!state.petLevelupTarget){
        state.petLevelupTarget = uid;
        state.petLevelupMaterials = [];
        toast('已选主宠物：' + (p.shiny ? '✨' : '') + getSpecies(p.species).name + ' ' + getQuality(p.quality).name);
      }else if(state.petLevelupTarget === uid){
        state.petLevelupTarget = null;
        state.petLevelupMaterials = [];
      }else{
        const target = state.petInv.find(x => x.uid === state.petLevelupTarget);
        if(!target){ return; }
        if(p.star !== target.star){ toast('材料需要同星'); beep(220, .12, 'square', .04); return; }
        const ti = PET_QUALITIES.findIndex(x => x.id === target.quality);
        const pi = PET_QUALITIES.findIndex(x => x.id === p.quality);
        if(pi > ti){ toast('材料品质不能高于主宠物'); beep(220, .12, 'square', .04); return; }
        if(!!p.shiny !== !!target.shiny){ toast('闪耀宠物只能吸收闪耀宠物'); beep(220, .12, 'square', .04); return; }
        const idx = state.petLevelupMaterials.indexOf(uid);
        if(idx >= 0) state.petLevelupMaterials.splice(idx, 1);
        else state.petLevelupMaterials.push(uid);
      }
    }else{
      return;
    }
    beep(700, .05, 'sine', .03);
    renderPetPage();
    updatePetFab();
    return;
  }

  const equipSlot = e.target.closest('[data-unequip]');
  if(equipSlot){
    const uid = equipSlot.dataset.unequip;
    toggleEquipPet(uid);
    return;
  }
});

    const pct = (worm.w / total * 100).toFixed(4);
    console.log('%c🐛 蚕大蛇权重 ×' + mult + ' → 当前权重 ' + worm.w + '（抽中概率约 ' + pct + '%）',
      'color:#8faa3a;font-weight:900;font-size:13px');
    return worm.w;
  },
  setWormWeight: function(w){
    const worm = PET_SPECIES.find(s => s.id === 'worm');
    if(!worm){ console.warn('❌ 找不到蚕大蛇'); return; }
    worm.w = Math.max(0, Number(w) || 0);
    const total = PET_SPECIES.reduce((s,x) => s + x.w, 0);
    const pct = total ? (worm.w / total * 100).toFixed(4) : '0';
    console.log('%c🐛 蚕大蛇权重设为 ' + worm.w + '（抽中概率约 ' + pct + '%）',
      'color:#8faa3a;font-weight:900;font-size:13px');
    return worm.w;
  },
  giveWorm: function(count){
    count = Math.max(1, Math.floor(count) || 1);
    for(let i = 0; i < count; i++){
      state.petInv.push(genPet('N', 'worm'));
    }
    console.log('%c🐛 已获得 ' + count + ' 只蚕大蛇', 'color:#8faa3a;font-weight:900');
    updateHUD();
    renderPetPage();
    checkAchievements();
  },
  wormInfo: function(){
    const worm = PET_SPECIES.find(s => s.id === 'worm');
    const total = PET_SPECIES.reduce((s,x) => s + x.w, 0);
    const pct = (worm.w / total * 100).toFixed(4);
    console.log('%c🐛 蚕大蛇：权重 ' + worm.w + ' / 总权重 ' + total +
      ' → 抽中概率约 ' + pct + '%（约 ' + Math.round(total / worm.w) + ' 抽一只）',
      'color:#8faa3a;font-weight:900;font-size:13px');
    return { weight: worm.w, total: total, pct: pct };
  }
};

/* ═════════ 工具 ═════════ */
let panel = null;

function q(sel){ return panel ? panel.querySelector(sel) : null; }
function vNum(sel){
  const e = q(sel); if(!e) return NaN;
  const v = parseFloat(e.value);
  return isFinite(v) ? v : NaN;
}
function vInt(sel, def){
  const e = q(sel); if(!e) return def;
  const v = parseInt(e.value, 10);
  return isFinite(v) ? v : def;
}

    '幸运倍率  x' + getLuckMult().toFixed(2) + '\n' +
    '自动间隔  ' + Math.round(getAutoInterval()) + ' ms\n' +
    '保底上限  ' + (getPityMax() === null ? '未解锁' : getPityMax() + ' 抽') + '\n' +
    '多重抽奖  ' + (getMultiRollChance() * 100).toFixed(2) + '% 概率追抽\n' +
    '宠物倍率  x' + fmt(getPetPermaMult()) + '（含永久）\n' +
    '永久树等级 ' + ptreeSum + '\n' +
    '宠物数量  ' + state.petInv.length + ' 只 · 已装备 ' + state.petEquipped.length + '\n' +
    '当前活动  ' + getEvent().emoji + ' ' + getEvent().name;

  const po = q('#saPetOut');
  if(po) po.textContent =
    '宠物总数 ' + state.petInv.length +
    ' · 已装备 ' + state.petEquipped.length +
    ' · 可合成闪耀 ' + countMergeable() + ' 组\n' +
    '已收集稀有度 ' + RARITIES.filter(r => state.inv[r.id] > 0).length + '/' + RARITIES.length +
    ' · 成就 ' + Object.keys(state.unlockedAch).length + '/' + ACHIEVEMENTS.length;

  const svo = q('#saSaveOut');
  if(svo) svo.textContent = JSON.stringify({
    coins: state.coins,
    gems: state.gems,
    rolls: state.rolls,
    rollCount: state.rollCount,
    pity: state.pity,
    rebirths: state.rebirths,
    ascends: state.ascends,
    transcends: state.transcends,
    pets: state.petInv.length,
    equipped: state.petEquipped.length,
    achievements: Object.keys(state.unlockedAch).length + '/' + ACHIEVEMENTS.length,
    coinMult: getCoinMult(),
    luckMult: getLuckMult(),
    autoInterval: getAutoInterval(),
    multiRollChance: getMultiRollChance(),
    petPermaMult: getPetPermaMult(),
    ptreeLevels: ptreeSum
  }, null, 1);
}

/* ═════════ 操作后统一刷新游戏 ═════════ */
function apply(){
  updateHUD();
  markDirty();
  try{ saveGame(); }catch(e){}
  if(state.page === 'roll'){
    updatePityUI();
    updateDiceHintUI();
    renderHistUI();
  }else{
    renderPage();
  }
  updatePetFab();
  refresh();
}

/* ═════════ 执行动作 ═════════ */
function act(a){
  switch(a){

    case 'close': close(); return;

    /* ===== 数值 ===== */
    case 'setCoins': {
      const v = vNum('#saCoins');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.coins = Math.max(0, v); break;
    }
    case 'maxCoins':  state.coins = 1e60; break;
    case 'x10Coins':  state.coins = state.coins * 10 + 1; break;
    case 'zeroCoins': state.coins = 0; break;

    case 'setGems': {
      const v = vNum('#saGems');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.gems = Math.max(0, v); break;
    }
    case 'maxGems':  state.gems = 1e30; break;
    case 'x10Gems':  state.gems = state.gems * 10 + 1; break;
    case 'zeroGems': state.gems = 0; break;

    case 'setRolls': {
      const v = vNum('#saRolls');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.rolls = Math.max(0, Math.floor(v)); break;
    }
    case 'zeroRolls': state.rolls = 0; break;

    case 'setPity': {
      const v = vNum('#saPity');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.pity = Math.max(0, Math.floor(v)); break;
    }
    case 'pityFull': {
      const pm = getPityMax();
      if(pm === null){ toast('⚠️ 还没解锁保底系统'); return; }
      state.pity = pm; break;
    }
    case 'pityZero': state.pity = 0; break;

    case 'setRollCount': {
      const v = vNum('#saRollCount');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.rollCount = Math.max(0, Math.floor(v)); break;
    }
    case 'diceGold':
      state.rollCount = state.rollCount - (state.rollCount % DICE_INTERVAL.gold) + (DICE_INTERVAL.gold - 1);
      break;
    case 'diceDiamond':
      state.rollCount = state.rollCount - (state.rollCount % DICE_INTERVAL.diamond) + (DICE_INTERVAL.diamond - 1);
      break;

    case 'setReb': state.rebirths   = Math.max(0, vInt('#saReb', 0)); break;
    case 'setAsc': state.ascends    = Math.max(0, vInt('#saAsc', 0)); break;
    case 'setTra': state.transcends = Math.max(0, vInt('#saTra', 0)); break;
    case 'rebAllMax':
      state.rebirths += 10; state.ascends += 10; state.transcends += 10;
      break;

    /* ===== 技能树 ===== */
    case 'treeMax':
      for(const n of ALL_NODES){
        if(n.id === 'root' || n.id === 'PROOT') continue;
        if(n.perma) state.ptree[n.id] = n.max;
        else state.tree[n.id] = n.max;
      }
      break;
    case 'treeOne':
      state.tree = { root: 1 };
      for(const n of TREE) if(n.id !== 'root') state.tree[n.id] = Math.min(1, n.max);
      break;
    case 'treeZero':
      state.tree = { root: 1 };
      break;
    case 'ptreeMax':
      for(const n of PERMA_TREE){
        if(n.id === 'PROOT') continue;
        state.ptree[n.id] = n.max;
      }
      break;
    case 'ptreeZero':
      state.ptree = { PROOT: 1 };
      break;
    case 'nodeSet': {
      const id = q('#saNode') ? q('#saNode').value : '';
      const n = ALL_NODES.find(x => x.id === id);
      if(!n) return;
      const lv = vInt('#saNodeLv', -1);
      if(lv < 0){ toast('❌ 请输入等级'); return; }
      const v = Math.max(0, Math.min(n.max, lv));
      if(n.perma) state.ptree[id] = v;
      else state.tree[id] = v;
      break;
    }
    case 'nodeMax': {
      const id = q('#saNode') ? q('#saNode').value : '';
      const n = ALL_NODES.find(x => x.id === id);
      if(!n) return;
      if(n.perma) state.ptree[id] = n.max;
      else state.tree[id] = n.max;
      break;
    }

    /* ===== 宠物 ===== */
    case 'spawnPet': {
      const spId  = q('#saSp')   ? q('#saSp').value   : 'dog';
      const qId   = q('#saQ')    ? q('#saQ').value    : 'N';
      const star  = q('#saStar') ? (parseInt(q('#saStar').value, 10) || 1) : 1;
      const shiny = q('#saShiny') ? q('#saShiny').checked : false;
      let n = vInt('#saPetN', 1);
      n = Math.max(1, Math.min(100, n));
      const sp = getSpecies(spId);
      for(let i = 0; i < n; i++){
        const p = genPet(qId, spId);
        p.star  = Math.max(sp.minStar, Math.min(MAX_STAR, star));
        p.shiny = !!shiny;
        state.petInv.push(p);
      }
      toast('✅ 已生成 ' + n + ' 只宠物');
      break;
    }
    case 'all6':     for(const p of state.petInv) p.star = MAX_STAR; break;
    case 'allShiny': for(const p of state.petInv) p.shiny = true; break;
    case 'allGod':   for(const p of state.petInv){ p.quality = 'GOD'; p.exp = 0; } break;
    case 'equipBest': {
      const s = state.petInv.slice().sort((x, y) => petMult(y) - petMult(x));
      state.petEquipped = s.slice(0, MAX_PETS).map(p => p.uid);
      break;
    }
    case 'equipClear': state.petEquipped = []; break;
    case 'petClear':
      state.petInv = [];
      state.petEquipped = [];
      state.petSelection = [];
      state.petLevelupTarget = null;
      state.petLevelupMaterials = [];
      break;

    /* ===== 玩法 ===== */
    case 'achAll': {
      const now = Date.now();
      let c = 0;
      for(const x of ACHIEVEMENTS){
        if(!state.unlockedAch[x.id]){ state.unlockedAch[x.id] = now; c++; }
      }
      saveAch();
      toast('🏆 解锁 ' + c + ' 个成就');
      break;
    }
    case 'achClear':
      state.unlockedAch = {};
      saveAch();
      break;

    case 'eventSet': {
      const id = q('#saEvent') ? q('#saEvent').value : '';
      const e = EVENTS.find(x => x.id === id);
      if(!e) return;
      state.event = e.id;
      state.eventUntil = Date.now() + (e.id === 'none' ? 60000 : e.dur * 1000);
      toast('🎉 活动切换：' + e.emoji + ' ' + e.name);
      break;
    }
    case 'eventRand': rollEvent(true); break;

    case 'buffAdd': {
      const type = q('#saBuffType') ? q('#saBuffType').value : 'luck';
      const v    = vNum('#saBuffVal');
      const dur  = vNum('#saBuffDur') || 300;
      if(isNaN(v)){ toast('❌ 请输入数值'); return; }
      const b = { name: '后台Buff', emoji: '🛠️', color: '#9fc4ff', dur: dur };
      if(type === 'luck')  b.luck = v;
      if(type === 'coin')  b.coinMult = v;
      if(type === 'speed') b.speedMult = v;
      if(type === 'affix') b.affixBonus = v;
      addBuff(b);
      break;
    }
    case 'buffClear':
      state.buffs = [];
      renderBuffBar();
      toast('🧹 已清空 Buff');
      break;

    case 'tSound':
      state.sound = !state.sound;
      toast('🔊 音效：' + (state.sound ? '开' : '关'));
      break;
    case 'tAuto': {
      state.auto = !state.auto;
      const btn = document.getElementById('autoBtn');
      if(btn){
        btn.textContent = state.auto ? '自动抽取：开' : '自动抽取：关';
        btn.classList.toggle('on', state.auto);
      }
      if(state.auto) lastRollTime = performance.now() - getAutoInterval();
      toast('🤖 自动抽取：' + (state.auto ? '开' : '关'));
      break;
    }
    case 'unlockRc':
      state.rechargeUnlocked = true;
      try{ localStorage.setItem('symrng_recharge', '1'); }catch(e){}
      toast('🔓 充值系统已解锁');
      break;

    /* ===== 存档 ===== */
    case 'saveNow': saveGame(); toast('💾 已保存'); break;
    case 'expSave': exportSave(); break;
    case 'impSave': importSaveFromFile(); break;
    case 'cpSave':  copySaveToClipboard(); break;
    case 'pstSave': pasteSaveFromClipboard(); break;
    case 'wipe':    wipeSave(); break;

    default: return;
  }
  apply();
}

/* ═════════ 事件绑定 ═════════ */
function bind(){
  panel.addEventListener('click', function(e){
    if(e.target === panel){ close(); return; }

    const tab = e.target.closest('.sa-tab');
    if(tab){
      panel.querySelectorAll('.sa-tab').forEach(function(t){
        t.classList.toggle('on', t === tab);
      });
      panel.querySelectorAll('.sa-pane').forEach(function(p){
        p.classList.toggle('on', p.dataset.pane === tab.dataset.tab);
      });
      refresh();
      return;
    }

    const btn = e.target.closest('[data-act]');
    if(btn) act(btn.dataset.act);
  });

  /* 阻止键盘事件冒泡到游戏 */
  panel.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ e.stopPropagation(); close(); return; }
    e.stopPropagation();
  });
  panel.addEventListener('keyup', function(e){ e.stopPropagation(); });
  panel.addEventListener('keypress', function(e){ e.stopPropagation(); });
}

/* ═════════ 打开 / 关闭 ═════════ */
function open(){
  if(!panel){
    if(!document.getElementById('saStyle')){
      const st = document.createElement('style');
      st.id = 'saStyle';
      st.textContent = CSS;
      document.head.appendChild(st);
    }
    panel = document.createElement('div');
    panel.id = 'saRoot';
    panel.innerHTML = build();
    document.body.appendChild(panel);
    bind();
  }
  panel.classList.add('on');
  refresh();
  try{
    console.log('%c🛠️ 后台已打开（Esc 关闭）',
      'color:#9fc4ff;font-weight:900;font-size:13px');
  }catch(e){}
}
function close(){
  if(!panel) return;
  panel.classList.remove('on');
  apply();
}

/* ═════════ 快捷键 L + B + S ═════════ */
const _saKeys = {};
document.addEventListener('keydown', function(e){
  _saKeys[e.key.toLowerCase()] = true;
  if(_saKeys['l'] && _saKeys['b'] && _saKeys['s']){
    e.preventDefault();
    if(panel && panel.classList.contains('on')) close();
    else open();
    _saKeys['l'] = _saKeys['b'] = _saKeys['s'] = false;
  }
});
document.addEventListener('keyup', function(e){
  _saKeys[e.key.toLowerCase()] = false;
});

/* ═════════ 挂载到 window.symrng ═════════ */
window.symrng = window.symrng || {};
window.symrng.admin        = open;
window.symrng.panel        = open;
window.symrng['后台']      = open;
window.symrng.closeAdmin   = close;

/* 附带的控制台快捷指令 */
if(!window.symrng.addCoins){
  window.symrng.addCoins = function(n){
    n = Number(n);
    if(!isFinite(n)) return console.warn('❌ 用法：symrng.addCoins(1e18)');
    state.coins = Math.max(0, state.coins + n);
    updateHUD(); markDirty();
    console.log('%c💰 ' + fmt(state.coins), 'color:#ffc93c;font-weight:900');
    return state.coins;
  };
  window.symrng.addGems = function(n){
    n = Number(n);
    if(!isFinite(n)) return console.warn('❌ 用法：symrng.addGems(1e6)');
    state.gems = Math.max(0, state.gems + n);
    updateHUD(); markDirty();
    console.log('%c💎 ' + fmt(state.gems), 'color:#2ee6ff;font-weight:900');
    return state.gems;
  };
  window.symrng.maxTree = function(){
    for(const n of TREE) state.tree[n.id] = n.max;
    state.tree.root = 1;
    updateHUD(); markDirty();
    if(state.page === 'tree') renderPage();
    console.log('%c🌳 普通技能树已全部满级', 'color:#8ff0c4;font-weight:900');
  };
  window.symrng.maxPermaTree = function(){
    for(const n of PERMA_TREE) state.ptree[n.id] = n.max;
    state.ptree.PROOT = 1;
    updateHUD(); markDirty();
    if(state.page === 'tree') renderPage();
    console.log('%c💎 永久技能树已全部满级', 'color:#ffc93c;font-weight:900');
  };
  window.symrng.allAch = function(){
    const now = Date.now();
    let c = 0;
    for(const a of ACHIEVEMENTS) if(!state.unlockedAch[a.id]){ state.unlockedAch[a.id] = now; c++; }
    saveAch();
    console.log('%c🏆 解锁 ' + c + ' 个成就', 'color:#ffc93c;font-weight:900');
    return c;
  };
}

/* ═════════ 控制台欢迎语 ═════════ */
try{
  console.log(
    '%c🐴 沙杨马 RNG · 可视化后台\n' +
    '%csymrng.admin()  →  打开后台面板（或按 L+B+S）',
    'color:#8ff0c4;font-size:14px;font-weight:900',
    'color:#9fc4ff;font-size:12px'
  );
}catch(e){}

})();

})();

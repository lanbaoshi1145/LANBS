function applyTreeTranslate(){
  if(!treeCanvas) return;
  treeCanvas.style.transform = 'translate3d(' + treeView.x + 'px,' + treeView.y + 'px,0)';
}
function renderTreeContent(){
  if(!treeCanvas) return;
  hideNodeTip();
  const s = treeView.scale;
  const nodeW = Math.round(BASE_NODE_W * s);
  const nodeH = Math.round(BASE_NODE_H * s);
  const gapX  = Math.round(BASE_GAP_X * s);
  const gapY  = Math.round(BASE_GAP_Y * s);
  const pad   = Math.round(BASE_PAD * s);
  const maxCol = Math.max(...ALL_NODES.map(n => n.col));
  const maxRow = Math.max(...ALL_NODES.map(n => n.row));
  const TW = maxCol * gapX + nodeW + pad * 2;
  const TH = maxRow * gapY + nodeH + pad * 2;
  treeCanvas.style.width  = TW + 'px';
  treeCanvas.style.height = TH + 'px';
  const fsEmoji = Math.max(11, 17 * s);
  const fsName  = Math.max(7.5, 10 * s);
  const fsFoot  = Math.max(6.5, 8.5 * s);
  const padItem = Math.max(2, 4 * s);
  let svg = '<svg class="tree-svg" width="' + TW + '" height="' + TH + '">';
  let html = '';
  for(const n of ALL_NODES){
    const lv = nodeLv(n);
    const unlocked = nodeIsUnlocked(n);
    const nx = n.col * gapX + pad + nodeW / 2;
    const ny = n.row * gapY + pad + nodeH / 2;
    for(const rid of n.req){
      const p = ALL_NODES.find(x => x.id === rid);
      if(!p) continue;
      const px = p.col * gapX + pad + nodeW / 2;
      const py = p.row * gapY + pad + nodeH / 2;
      const active = unlocked || lv > 0;
      const stroke = active ? 'rgba(90,180,255,.65)' : 'rgba(255,255,255,.10)';
      svg += '<line x1="' + px + '" y1="' + py + '" x2="' + nx + '" y2="' + ny +
             '" stroke="' + stroke + '" stroke-width="' + Math.max(1.5, 3 * s) +
             '" stroke-linecap="round"/>';
    }
  }
  for(const n of ALL_NODES){
    const lv = nodeLv(n);
    const unlocked = nodeIsUnlocked(n);
    const nx = n.col * gapX + pad;
    const ny = n.row * gapY + pad;
    let cls = 'tnode';
    if(n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT') cls += ' maxed';
    else if(lv >= n.max) cls += ' maxed';
    else if(!unlocked) cls += ' locked';
    else if(lv > 0) cls += ' owned';
    else cls += ' avail';
    if(n.id.indexOf('PY') === 0) cls += ' pity-node';
    if(n.perma) cls += ' perma-node';
    if(n.perma2) cls += ' perma2-node';
    let foot;
    if(n.id === 'root') foot = '起点';
    else if(n.id === 'PROOT') foot = '永久';
    else if(n.id === 'P2ROOT') foot = '二阶';
    else if(lv >= n.max) foot = 'MAX';
    else foot = '💰' + fmt(nodeCost(n));
    const lvTxt = (n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT' || n.max === 1) ? '' : ('Lv.' + lv + '/' + n.max + ' · ');
    html += '<div class="' + cls + '" data-node="' + n.id + '"' +
              ' style="left:' + nx + 'px;top:' + ny + 'px;' +
                     'width:' + nodeW + 'px;height:' + nodeH + 'px;' +
                     'padding:' + padItem + 'px;' +
                     'border-radius:' + Math.max(8, 14 * s) + 'px;' +
                     'border-width:' + Math.max(1, 1.5 * s) + 'px">' +
              '<div class="tn-emoji" style="font-size:' + fsEmoji + 'px">' + n.emoji + '</div>' +
              '<div class="tn-name" style="font-size:' + fsName + 'px">' + esc(n.name) + '</div>' +
              '<div class="tn-foot" style="font-size:' + fsFoot + 'px">' + lvTxt + foot + '</div>' +
            '</div>';
  }
  svg += '</svg>';
  treeCanvas.innerHTML = svg + html;
  applyTreeTranslate();
  if(treeZoomLvlEl) treeZoomLvlEl.textContent = Math.round(s * 100) + '%';
}
function computeFitScale(){
  const vw = treeViewport.clientWidth;
  const vh = treeViewport.clientHeight;
  const maxCol = Math.max(...ALL_NODES.map(n => n.col));
  const maxRow = Math.max(...ALL_NODES.map(n => n.row));
  const BW = maxCol * BASE_GAP_X + BASE_NODE_W + BASE_PAD * 2;
  const BH = maxRow * BASE_GAP_Y + BASE_NODE_H + BASE_PAD * 2;
  let s = Math.min(vw / BW, vh / BH) * 0.94;
  return Math.max(TREE_MIN, Math.min(TREE_MAX, s));
}
function resetTreeView(noRender){
  if(!treeViewport || !treeCanvas) return;
  const vw = treeViewport.clientWidth;
  const vh = treeViewport.clientHeight;
  treeView.scale = computeFitScale();
  const s = treeView.scale;
  const maxCol = Math.max(...ALL_NODES.map(n => n.col));
  const maxRow = Math.max(...ALL_NODES.map(n => n.row));
  const TW = maxCol * BASE_GAP_X * s + BASE_NODE_W * s + BASE_PAD * s * 2;
  const TH = maxRow * BASE_GAP_Y * s + BASE_NODE_H * s + BASE_PAD * s * 2;
  treeView.x = (vw - TW) / 2;
  treeView.y = (vh - TH) / 2;
  if(!noRender) renderTreeContent();
}
function treeSetScale(newScale, anchorX, anchorY){
  if(!treeViewport) return;
  newScale = Math.max(TREE_MIN, Math.min(TREE_MAX, newScale));
  if(Math.abs(newScale - treeView.scale) < 0.001) return;
  if(anchorX === undefined){ anchorX = treeViewport.clientWidth / 2; anchorY = treeViewport.clientHeight / 2; }
  const k = newScale / treeView.scale;
  treeView.x = anchorX - (anchorX - treeView.x) * k;
  treeView.y = anchorY - (anchorY - treeView.y) * k;
  treeView.scale = newScale;
  renderTreeContent();
}
function treeZoom(factor, anchorX, anchorY){ treeSetScale(treeView.scale * factor, anchorX, anchorY); }

let draggedSinceDown = false;
function bindTreeControls(){
  if(!treeViewport) return;
  treeViewport.addEventListener('mousemove', e => {
    if(draggedSinceDown) return;
    const node = e.target.closest('.tnode');
    if(!node){ hideNodeTip(); return; }
    showNodeTip(node, e.clientX, e.clientY);
  });
  treeViewport.addEventListener('mouseleave', hideNodeTip);

  let dragging = false, lastX = 0, lastY = 0;
  treeViewport.addEventListener('mousedown', e => {
    if(e.button !== 0) return;
    if(e.target.closest('.tree-ctrl')) return;
    dragging = true; draggedSinceDown = false;
    lastX = e.clientX; lastY = e.clientY;
    treeViewport.classList.add('grabbing');
    hideNodeTip();
  });
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if(Math.abs(dx) + Math.abs(dy) > 3) draggedSinceDown = true;
    treeView.x += dx; treeView.y += dy;
    lastX = e.clientX; lastY = e.clientY;
    applyTreeTranslate();
    hideNodeTip();
  });
  window.addEventListener('mouseup', () => {
    if(dragging) setTimeout(() => { draggedSinceDown = false; }, 0);
    dragging = false;
    treeViewport.classList.remove('grabbing');
  });
  treeViewport.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = treeViewport.getBoundingClientRect();
    treeZoom(e.deltaY < 0 ? 1.08 : 1/1.08, e.clientX - rect.left, e.clientY - rect.top);
    hideNodeTip();
  }, { passive: false });

  let touchMode = null, touchStart = null, pinchStart = null;
  treeViewport.addEventListener('touchstart', e => {
    if(e.target.closest('.tree-ctrl')) return;
    hideNodeTip();
    if(e.touches.length === 1){
      touchMode = 'drag'; draggedSinceDown = false;
      touchStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, vx:treeView.x, vy:treeView.y };
    } else if(e.touches.length === 2){
      touchMode = 'pinch';
      const rect = treeViewport.getBoundingClientRect();
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      pinchStart = { cx, cy, dist, scale:treeView.scale, vx:treeView.x, vy:treeView.y };
    }
  }, { passive: true });
  treeViewport.addEventListener('touchmove', e => {
    if(touchMode === 'drag' && e.touches.length === 1){
      const dx = e.touches[0].clientX - touchStart.x;
      const dy = e.touches[0].clientY - touchStart.y;
      if(Math.abs(dx) + Math.abs(dy) > 4) draggedSinceDown = true;
      treeView.x = touchStart.vx + dx;
      treeView.y = touchStart.vy + dy;
      applyTreeTranslate();
      e.preventDefault();
    } else if(touchMode === 'pinch' && e.touches.length === 2){
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      let newScale = pinchStart.scale * (dist / pinchStart.dist);
      newScale = Math.max(TREE_MIN, Math.min(TREE_MAX, newScale));
      const k = newScale / pinchStart.scale;
      treeView.x = pinchStart.cx - (pinchStart.cx - pinchStart.vx) * k;
      treeView.y = pinchStart.cy - (pinchStart.cy - pinchStart.vy) * k;
      if(Math.abs(newScale - treeView.scale) > 0.002){
        treeView.scale = newScale;
        renderTreeContent();
      }
      e.preventDefault();
    }
  }, { passive: false });
  treeViewport.addEventListener('touchend', e => {
    if(e.touches.length === 0){
      setTimeout(() => { draggedSinceDown = false; }, 100);
      touchMode = null;
    } else if(e.touches.length === 1 && touchMode === 'pinch'){
      touchMode = 'drag';
      touchStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, vx:treeView.x, vy:treeView.y };
    }
  });

  $('#treeZoomIn').addEventListener('click', e => { e.stopPropagation(); treeZoom(1.18); beep(760, .05, 'sine', .025); });
  $('#treeZoomOut').addEventListener('click', e => { e.stopPropagation(); treeZoom(1/1.18); beep(500, .05, 'sine', .025); });
  $('#treeReset').addEventListener('click', e => { e.stopPropagation(); resetTreeView(); beep(600, .08, 'sine', .03); });
  window.addEventListener('resize', () => { if(state.page === 'tree') resetTreeView(); });
}

/* ═══════════ 💠 充值 / 🎲 赌注 核心逻辑 ═══════════ */
function buyRechargePack(id){
  const p = RECHARGE_PACKS.find(x => x.id === id);
  if(!p) return;
  if(p.needVip && state.vip < 1){
    toast('❌ 需要先购买 VIP'); beep(220,.12,'square',.04); return;
  }
  const bought = (state.rechargeBought && state.rechargeBought[id]) || 0;
  if(bought >= p.limit){ toast('❌ 已达购买上限'); beep(220,.12,'square',.04); return; }
  if(state.essence < p.essenceCost){ toast('❌ 源质不足，需要 💠' + fmt(p.essenceCost)); beep(220,.12,'square',.04); return; }

  state.essence -= p.essenceCost;
  if(!state.rechargeBought) state.rechargeBought = {};
  state.rechargeBought[id] = bought + 1;

  let result = '';
  if(p.vip){ state.vip = 1; result = '👑 VIP 特权已永久激活'; }
  else if(p.svip){ state.vip = 2; result = '💎 SVIP 特权已永久激活'; }
  else result = p.reward();
  toast('✅ ' + p.name + ' 到账！' + result);
  beep(1200, .2, 'sine', .06);
  setTimeout(() => beep(1600, .3, 'sine', .05), 120);
  burst('#a855f7', 60);
  burst('#ffffff', 40);
  shake(6);

  buildNav();
  updateHUD();
  renderShopPage();
  markDirty(); saveGame();
}

/* ═══════════ 👑 VIP 每日源质 ═══════════ */
function canClaimVipDaily(){
  if(vipLevel() < 1) return false;
  const today = new Date().toDateString();
  const last = state.vipDailyClaim ? new Date(state.vipDailyClaim).toDateString() : '';
  return last !== today;
}
function claimVipDaily(){
  if(vipLevel() < 1){ toast('❌ 需要 VIP 才能领取'); return; }
  if(!canClaimVipDaily()){ toast('今日已领取'); return; }
  const amount = vipValue('dailyEssence');
  state.essence += amount;
  state.vipDailyClaim = Date.now();
  toast('💠 每日源质 +' + amount);
  updateHUD(); renderShopPage(); markDirty(); saveGame();
}

function doGamble(typeId, pick){
  const type = GAMBLE_TYPES.find(t => t.id === typeId);
  if(!type) return;
  const inp = $('#gambleAmount');
  const amount = Math.max(1, Math.floor(parseFloat(inp ? inp.value : 0) || 0));
  if(amount < 1){ toast('❌ 请输入有效押注金额'); beep(220,.12,'square',.04); return; }
  if(state.coins < amount){ toast('❌ 金币不足'); beep(220,.12,'square',.04); return; }

  state.coins -= amount;

  let win = false;
  let resultText = '';

  if(typeId === 'bigsmall'){
    const n = Math.floor(Math.random() * 100) + 1;
    const isBig = n > 50;
    resultText = '点数 ' + n + ' → ' + (isBig ? '大' : '小');
    win = (pick === '大' && isBig) || (pick === '小' && !isBig);
  } else if(typeId === 'oddeven'){
    const n = Math.floor(Math.random() * 100) + 1;
    const isOdd = n % 2 === 1;
    resultText = '点数 ' + n + ' → ' + (isOdd ? '单' : '双');
    win = (pick === '单' && isOdd) || (pick === '双' && !isOdd);
  } else if(typeId === 'dice'){
    const n = Math.floor(Math.random() * 6) + 1;
    resultText = '骰子 ' + n;
    win = (pick === String(n));
  } else if(typeId === 'allin'){
    win = Math.random() < 0.1;
    resultText = win ? '天命所归！' : '天不遂人愿……';
  }

  let delta = 0;
  if(win){
    const gain = amount * type.mult;
    state.coins += gain;
    delta = gain - amount;
    toast('🎉 赢了！' + resultText + ' · +💰' + fmt(delta));
    burst('#ffc93c', 60);
    burst('#ffffff', 40);
    beep(1300, .25, 'sine', .06);
    setTimeout(() => beep(1700, .3, 'sine', .05), 120);
    shake(4);
  } else {
    delta = -amount;
    toast('😢 输了！' + resultText + ' · -💰' + fmt(amount));
    beep(220, .25, 'square', .05);
    shake(3);
  }

  state.gambleHistory.unshift({ t: Date.now(), type: typeId, pick: pick, result: resultText, delta: delta });
  if(state.gambleHistory.length > 20) state.gambleHistory.pop();

  updateHUD();
  renderShopPage();
  markDirty(); saveGame();
}

      (state.trueRebirths > 0 ? '💸 <b>真重生折扣：-' + Math.round(Math.min(TRUE_REBIRTH.petDrawDiscountCap, state.trueRebirths * TRUE_REBIRTH.petDrawDiscountPer) * 100) + '%</b>（' + state.trueRebirths + ' 次真重生）' : '') +
    '</div>';
  }

  h += '<div class="pet-draw-grid">' +
    '<button class="pet-draw-btn" data-pet-draw="1">' +
      '<div class="pdb-emoji">🎁</div>' +
      '<div class="pdb-name">单抽</div>' +
      '<div class="pdb-cost">💎 <b>' + c1 + '</b>' + (c1 < PET_DRAW_COST_1 ? ' <span style="color:#ff9f43;text-decoration:line-through;opacity:.7;font-size:10px">' + PET_DRAW_COST_1 + '</span>' : '') + '</div>' +
    '</button>' +
    '<button class="pet-draw-btn big" data-pet-draw="10">' +
      '<div class="pdb-emoji">🌟</div>' +
      '<div class="pdb-name">十连抽</div>' +
      '<div class="pdb-cost">💎 <b>' + fmt(c10) + '</b>' + (c10 < PET_DRAW_COST_10 ? ' <span style="color:#ff9f43;text-decoration:line-through;opacity:.7;font-size:10px">' + fmt(PET_DRAW_COST_10) + '</span>' : '') + '</div>' +
    '</button>' +
  '</div>';

  h += '<div style="text-align:center;margin-top:14px;font-size:11.5px;color:#8b98ad">' +
    '当前钻石：<b style="color:#2ee6ff">💎 ' + fmt(state.gems) + '</b></div>';

  h += '</div></div>';

  h += '<div class="card"><div class="card-head">📊 抽取概率</div><div class="card-body">';
  const luckMul = 1 + luck / 100;
  let probHTML = '';
  const keys = Object.keys(PET_QUALITY_WEIGHTS);
  let baseSum = 0;
  const weighted = keys.map((k, i) => {
    const w = PET_QUALITY_WEIGHTS[k] * Math.pow(luckMul, i);
    baseSum += w;
    return { k, w };
  });
  for(let i = 0; i < PET_QUALITIES.length; i++){
    const q = PET_QUALITIES[i];
    const it = weighted.find(x => x.k === q.id);
    const pct = it ? it.w / baseSum * 100 : 0;
    probHTML += '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)">' +
      '<span style="color:' + q.color + ';font-weight:900">' + q.name + '</span>' +
      '<span style="color:#8b98ad;font-size:11.5px">' + pct.toFixed(2) + '%</span>' +
    '</div>';
  }
  h += probHTML + '</div></div>';

  return h;
}

function renderEventPage(){
  const ev = getEvent();

  const m = Math.floor(remain / 60);
  const s = remain % 60;
  const timerTxt = m + ':' + String(s).padStart(2, '0');

  let h = '<div class="page-title"><h2>活动</h2><p>随机轮换 · 增益不断</p></div>';

    '<div class="evh-emoji">' + ev.emoji + '</div>' +
    '<div class="evh-name">' + ev.name + '</div>' +
    '<div class="evh-desc">' + ev.desc + '</div>' +
    '<div class="evh-timer">' + (isActive ? timerTxt : '--:--') + '</div>' +

  h += '<button class="set-btn primary" data-event-roll="1" ' +

        '<div class="evl-desc">' + e.desc + '</div>' +

  '</div></div>';

  $('#pageEvent').innerHTML = h;
}

function renderInvPage(){
  const it = state.invTab || 'base';
  let h = '<div class="page-title"><h2>图鉴</h2><p>稀有度 · 词条 · 组合 · 成就</p></div>';
  h += '<div class="subtabs">' +
    '<div class="subtab' + (it==='base'?' on':'')  + '" data-inv="base">稀有度</div>' +
    '<div class="subtab' + (it==='affix'?' on':'') + '" data-inv="affix">词条</div>' +
    '<div class="subtab' + (it==='mix'?' on':'')   + '" data-inv="mix">组合</div>' +
    '<div class="subtab' + (it==='ach'?' on':'')   + '" data-inv="ach">🏆 成就</div>' +
  '</div>';

  if(it === 'base'){
    const totalW = RARITIES.reduce((s, r) => s + r.w, 0);
    let body = '';
    for(let i = RARITIES.length - 1; i >= 0; i--){
      const r = RARITIES[i];
      const c = state.inv[r.id] || 0;
      const prob = r.w / totalW * 100;
      const pTxt = prob >= 1 ? prob.toFixed(2) + '%'
                 : prob >= 0.01 ? prob.toFixed(4) + '%'
                 : prob.toExponential(1) + '%';
      body += '<div class="item" style="' + (c ? '' : 'opacity:.42') + '">' +
        '<div class="ic" style="color:' + r.color + '">' + r.id + '</div>' +
        '<div class="info">' +
          '<div class="nm" style="color:' + r.color + '">' + r.name + '沙杨马</div>' +
          '<div class="ds">基础概率 ' + pTxt + ' · 💰' + fmt(r.coins) +
            (r.gems ? ' · 💎' + fmt(r.gems) : '') + '</div></div>' +
        '<div class="ic" style="color:' + r.color + '">x' + c + '</div></div>';
    }
    h += '<div class="inv-cols">' + body + '</div>';
  }
  if(it === 'affix'){
    const totalW = AFFIXES.reduce((s, a) => s + a.w, 0);
    h += '<div class="example">词条可叠加在任意稀有度上，例如 <b>闪耀传说沙杨马</b>、<b>闪耀·暗黑量子沙杨马</b>。词条倍率相乘。</div>';
    let body = '';
    for(let i = AFFIXES.length - 1; i >= 0; i--){
      const a = AFFIXES[i];
      const prob = a.w / totalW * 100;
      const pTxt = prob >= 1 ? prob.toFixed(2) + '%'
                 : prob >= 0.01 ? prob.toFixed(4) + '%'
                 : prob.toExponential(1) + '%';
      body += '<div class="affix-card"><div class="af-emoji">' + a.emoji + '</div>' +
        '<div class="info">' +
          '<div class="af-name" style="color:' + a.color + '">' + esc(a.name) + '</div>' +
          '<div class="af-info">价值倍率 x' + fmt(a.mult) + ' · 出现率 ' + pTxt + '</div>' +
        '</div></div>';
    }
    h += '<div class="inv-cols">' + body + '</div>';
  }
  if(it === 'mix'){
    h += '<div class="example">词条叠加后名字会前缀在稀有度前，倍率相乘。</div>';
    const examples = [
      { base: getRarity('SSR'),  affixes: [AFFIXES[0]] },
      { base: getRarity('SYM'),  affixes: [AFFIXES[0]] },
      { base: getRarity('QSYM'), affixes: [AFFIXES[0]] },
      { base: getRarity('SSR'),  affixes: [AFFIXES[0], AFFIXES[3]] },
      { base: getRarity('QSYM'), affixes: [AFFIXES[0], AFFIXES[5]] },
      { base: getRarity('ABSYM'), affixes: [AFFIXES[0], AFFIXES[10]] }
    ];
    for(const ex of examples){
      const m = affixMult(ex.affixes);
      h += '<div class="item"><div class="ic" style="color:' + ex.base.color + ';font-size:12px">' + ex.base.id + '</div>' +
        '<div class="info">' +
          '<div class="nm">' + fullNameHTML(ex.base, ex.affixes) + '</div>' +
          '<div class="ds">词条倍率 x' + fmt(m) + ' · 收益 💰' + fmt(ex.base.coins) +
            ' → 💰' + fmt(ex.base.coins * m) + '</div></div></div>';
    }
  }
  if(it === 'ach'){
    const unlocked = ACHIEVEMENTS.filter(a => state.unlockedAch[a.id]).length;
    const total = ACHIEVEMENTS.length;
    const pct = (unlocked / total * 100).toFixed(1);
    h += '<div class="ach-progress">' +
      '已解锁 <span class="num">' + unlocked + '</span> / ' + total +
      ' <span style="color:#8b98ad;font-size:11px">（' + pct + '%）</span>' +
      '<div class="ach-bar"><i style="width:' + pct + '%"></i></div></div>';
    const sorted = ACHIEVEMENTS.slice().sort((a, b) => {
      const ua = state.unlockedAch[a.id] ? 1 : 0;
      const ub = state.unlockedAch[b.id] ? 1 : 0;
      return ub - ua;
    });
    let body = '';
    for(const a of sorted){
      const u = !!state.unlockedAch[a.id];
      body += '<div class="ach-item ' + (u ? 'unlocked' : 'locked') + '">' +
        '<div class="ac-emoji">' + (u ? a.emoji : '🔒') + '</div>' +
        '<div class="ac-main">' +
          '<div class="ac-name">' + esc(a.name) + '</div>' +
          '<div class="ac-desc">' + esc(a.desc) + '</div>' +
        '</div>' +
        (u ? '<div class="ac-check">✓</div>' : '') + '</div>';
    }
    h += '<div class="inv-cols">' + body + '</div>';
  }
  $('#pageInv').innerHTML = h;
}

function renderTaskPage(){
  if(!state.daily) state.daily = loadDaily();
  let h = '<div class="page-title"><h2>每日任务</h2><p>' + state.daily.date + '</p></div>';
  h += '<div class="task-list">';
  h += '<div class="merchant"><div class="m-emoji">📅</div>' +
    '<div>完成后领取奖励 · 每天 0 点刷新</div></div>';
  for(const t of state.daily.tasks){
    const p = state.daily.progress[t.type] || 0;
    const done = p >= t.n;
    const pct = Math.min(100, (p / t.n) * 100);
    const reward = (t.reward.coins ? '💰' + fmt(t.reward.coins) : '') +
                   (t.reward.gems ? '💎' + fmt(t.reward.gems) : '');
    h += '<div class="task' + (t.claimed ? ' done' : '') + '">' +
      '<div class="t-emoji">' + t.emoji + '</div>' +
      '<div class="t-main">' +
        '<div class="t-name">' + esc(t.name) + '</div>' +
        '<div class="t-reward">奖励：' + reward + ' · 进度 ' + Math.min(p, t.n) + '/' + t.n + '</div>' +
        '<div class="t-prog"><i style="width:' + pct + '%"></i></div></div>' +
      '<button class="t-btn" data-task="' + t.id + '"' +
        (done && !t.claimed ? '' : ' disabled') + '>' +
        (t.claimed ? '已领' : '领取') + '</button></div>';
  }
  h += '</div>';
  $('#pageTask').innerHTML = h;
}

function renderRebPage(){
  let h = '<div class="page-title"><h2>重生</h2><p>三重轮回 · 真重生 · 源质深渊</p></div>';
  h += '<div class="rebirth-wrap">';

  for(const tier of REBIRTH_TIERS){
    const cost = getTierCost(tier);
    const req = tier.req();
    const can = state.coins >= cost && req.ok;
    const count = tier.id === 'rebirth' ? state.rebirths
                : tier.id === 'ascend' ? state.ascends
                : state.transcends;

    h += '<div class="rb-tier tier-' + (tier.id === 'rebirth' ? 1 : tier.id === 'ascend' ? 2 : 3) + '">' +
      '<div class="rbt-head">' +
        '<div class="rbt-emoji">' + tier.emoji + '</div>' +
        '<div class="rbt-name" style="color:' + tier.color + '">' + tier.name + '</div>' +
        '<div class="rbt-count">' + count + '</div>' +
      '</div>' +
      '<div class="rbt-desc">' + tier.desc + '<br>' +
        '每层永久获得：金币倍率 <b>+' + (tier.coinBonus * 100) + '%</b> · 幸运 <b>+' + tier.luckBonus + '</b>' +
      '</div>';

    if(!req.ok){
      h += '<div class="rbt-req">🔒 ' + req.txt + '</div>';
    }else{
      h += '<div class="rbt-req ok">✓ 已满足条件</div>';
    }

    h += '<div class="rbt-cost">需要 💰 ' + fmt(cost) +
      '<span class="have">（当前 ' + fmt(state.coins) + '）</span></div>';

    h += '<button class="rbt-btn" data-rebirth="' + tier.id + '"' +
      (can ? '' : ' disabled') + '>执行 ' + tier.name + '</button>';
    h += '</div>';
  }

  const trCost = getTrueRebirthCost();
  const trCan = state.coins >= trCost && state.transcends >= TRUE_REBIRTH.reqTranscends;
  h += '<div class="rb-tier" style="--rc1:rgba(200,80,255,.14);--rc2:rgba(200,80,255,.3);--rc3:rgba(200,80,255,.22);--rc4:#c85aff;--rc5:rgba(200,80,255,.6);--rc6:#e89bff;--rc7:#8a00c8">' +
    '<div class="rbt-head">' +
      '<div class="rbt-emoji">☯️</div>' +
      '<div class="rbt-name" style="color:#c85aff">真重生 · 逆转乾坤</div>' +
      '<div class="rbt-count">' + state.trueRebirths + '</div>' +
    '</div>' +
    '<div class="rbt-desc">' +
      '重置：<b>金币 · 普通技能树 · 三种重生次数 · 全部宠物与装备</b><br>' +
      '保留：<b>图鉴 · 永久树 · 二阶永久树 · 成就 · 宠物抽奖幸运 · 源质深渊进度</b><br>' +
      '获得：金币倍率 <b>×' + TRUE_REBIRTH.coinMultPer + '</b>（累积）· 幸运 <b>+' + TRUE_REBIRTH.luckPer + '</b> · ' +
      '宠物抽奖幸运 <b>+' + TRUE_REBIRTH.petLuckPer + '</b> · 宠物抽奖折扣 <b>-' +
      Math.round(TRUE_REBIRTH.petDrawDiscountPer * 100) + '%</b>（上限 ' +
      Math.round(TRUE_REBIRTH.petDrawDiscountCap * 100) + '%）<br>' +
      '<b style="color:#a855f7">🕳️ 解锁源质深渊</b>（无尽爬塔 · 永久升级）' +
    '</div>' +
    (state.transcends < TRUE_REBIRTH.reqTranscends
      ? '<div class="rbt-req">🔒 需要至少 ' + TRUE_REBIRTH.reqTranscends + ' 次超级重生（当前 ' + state.transcends + '）</div>'
      : '<div class="rbt-req ok">✓ 已满足条件</div>') +
    '<div class="rbt-cost">需要 💰 ' + fmt(trCost) +
      '<span class="have">（当前 ' + fmt(state.coins) + '）</span></div>' +
    '<button class="rbt-btn" data-truerebirth="1"' + (trCan ? '' : ' disabled') + '>执行 真重生</button>' +
    '</div>';

  const totalCoinMult = (1 + state.rebirths * (0.75 + ptreeLv('PR1') * 0.20))
                      * (1 + state.ascends  * (5    + ptreeLv('PR2') * 0.40))
                      * (1 + state.transcends * (50 + ptreeLv('PR4') * 0.50));
  const totalLuck = state.rebirths * 0.15 + state.ascends * 2 + state.transcends * 20 + ptreeLv('PR3') * 2;
  h += '<div class="card"><div class="card-body" style="font-size:12.5px;color:#9aa8c4;line-height:1.9">' +
    '<b style="color:#ffd86b">重生总加成</b><br>' +
    '金币倍率：<b style="color:#00ff88">x' + fmt(totalCoinMult * getTrueRebirthCoinMult()) + '</b>' +
    (state.trueRebirths ? '<span style="color:#c85aff"> （含真重生 ×' + fmt(getTrueRebirthCoinMult()) + '）</span>' : '') + '<br>' +
    '幸运加成：<b style="color:#00ff88">+' + (totalLuck + getTrueRebirthLuck()).toFixed(2) + '</b><br>' +
    '宠物抽奖幸运：<b style="color:#00ff88">' + fmt(getTotalPetDrawLuck()) + '</b><br><br>' +
    '<span style="color:#ffc93c">💎 永久树 / 🌌 二阶永久树节点不受任何重生影响。</span><br>' +
    '<span style="color:#7c89a5">普通重生会清空金币与普通技能树等级，但保留宠物、装备、图鉴收集和所有重生次数。</span><br>' +
    '<span style="color:#c85aff">☯️ 真重生会清空金币、普通技能树、三种重生次数、宠物与装备，但保留图鉴、永久树、成就、源质深渊进度与宠物抽奖幸运。</span>' +
  '</div></div>';

  h += '</div>';
  $('#pageReb').innerHTML = h;
}

  const bc = document.querySelector('#pageBoss .bc-val'); if(bc) bc.textContent = b.charges + ' / 10';

  const btn = document.querySelector('#pageBoss .bc-btn');
  if(btn) btn.disabled = !(state.pity >= 10 && b.charges < 10);

  const wrap = $('#bossRewards');
  if(wrap){
    for(const r of BOSS_REWARDS){
      const reached = b.weekKills >= r.needKills;
      const claimed = b.claimedRewards.indexOf(r.needKills) >= 0;
      const el = wrap.querySelector('[data-boss-reward="' + r.needKills + '"]');
      if(el){
        el.disabled = !(reached && !claimed);
        el.textContent = claimed ? '已领' : (reached ? '领取' : '未达成');
        el.classList.toggle('claimed', claimed);
        el.closest('.boss-reward').classList.toggle('done', claimed);
      }
    }
  }
}

const TOP_PAGES = [
  { id:'roll', name:'抽奖', emoji:'🎲' },
  { id:'tree', name:'升级', emoji:'🌳' },
  { id:'shop', name:'商城', emoji:'🛒' },
  { id:'pet',  name:'宠物', emoji:'🐾' },
  { id:'set',  name:'设置', emoji:'⚙️' }
];
const SIDE_PAGES = [
  { id:'abyss', name:'深渊', emoji:'🕳️' },
  { id:'event', name:'活动', emoji:'🎉' },
  { id:'inv',   name:'图鉴', emoji:'📖' },
  { id:'task',  name:'任务', emoji:'📋' },
  { id:'reb',   name:'重生', emoji:'🌟' }
];
function buildNav(){
  $('#bottomNav').innerHTML = TOP_PAGES.map(p =>
    '<div class="nav-btn' + (p.id === state.page ? ' on' : '') + '" data-page="' + p.id + '">' +
      '<span class="nb-emoji">' + p.emoji + '</span><span>' + p.name + '</span></div>'
  ).join('');

  const sideList = SIDE_PAGES.map(p => {
    const locked = (p.id === 'abyss' && state.trueRebirths < 1);
    return { id:p.id, name:p.name, emoji:p.emoji, locked:locked };
  });

  sideList.unshift({ id:'boss', name:'Boss', emoji:'👹', boss:true });

  if(state.vip >= 1){
    sideList.unshift({ id:'vip', name:'VIP', emoji: state.vip === 2 ? '💎' : '👑', vip:true });
  }

  if(state.devUnlocked){
    sideList.push({ id:'__dev', name:'后台', emoji:'💾', dev:true });
  }

  $('#sideNav').innerHTML = sideList.map(p => {
    return '<div class="side-btn' + (p.id === state.page ? ' on' : '') +
      (p.locked ? ' locked' : '') +
      (p.boss ? ' boss-nav' : '') +
      (p.dev ? ' dev' : '') +
      (p.vip ? ' vip-nav' + (state.vip === 2 ? ' svip-nav' : '') : '') +
      '" data-page="' + p.id + '">' +
      '<span>' + p.emoji + '</span><small>' + p.name + '</small></div>';
  }).join('');
}
function switchPage(id){
  if(id === 'abyss' && state.trueRebirths < 1){
    toast('要想进入沙杨马之深渊，需掌握逆转乾坤之术。');
    beep(220, .12, 'square', .04);
    shake(2);
    return;
  }

  if(id === 'vip' && state.vip < 1){
    toast('需要先购买 VIP');
    beep(220, .12, 'square', .04);
    shake(2);
    return;
  }

  if(id === 'boss'){
    ensureBossInit();
  }

  if(id === '__dev'){
    if(window.symrng && window.symrng.admin){
      window.symrng.admin();
      beep(1000, .12, 'sine', .05);
    }
    return;
  }

  state.page = id;
  document.querySelectorAll('.page').forEach(el => el.classList.remove('on'));

  document.querySelectorAll('.side-btn').forEach(b => b.classList.toggle('on', b.dataset.page === id));

  renderPage();
  beep(620, .06, 'sine', .025);

    case 'roll': renderRollPage(); break;

    case 'task': renderTaskPage(); break;
    case 'reb':  renderRebPage();  break;
    case 'abyss':renderAbyssPage();break;

}

let lastRollTime = 0;

function showCard(base, affixes, sub){
  const el = $('#display');
  if(!el) return;
  el.style.setProperty('--c', base.color);
  $('#dBadge').textContent = base.id;
  $('#dName').innerHTML = fullNameHTML(base, affixes);
  $('#dSub').textContent = sub || '';
}
function hideDiceTag(){
  const el = $('#diceTag');
  if(el) el.classList.remove('show');
}
function showDiceTag(key, mult){
  const el = $('#diceTag');
  if(!el) return;
  const d = DICE_DEFS[key];
  el.style.setProperty('--dc', d.color);
  el.textContent = d.emoji + ' ' + d.name + ' x' + fmt(mult);
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}
function doRoll(){
  if(state.rolling) return;
  if(state.page !== 'roll' && state.page !== 'abyss' && state.page !== 'boss') return;
  state.rolling = true;
  const btn = $('#rollBtn');
  if(btn) btn.disabled = true;
  const abtn = $('#abyssRollBtn');
  if(abtn) abtn.disabled = true;
  const bbtn = $('#bossRollBtn');
  if(bbtn) bbtn.disabled = true;
  hideDiceTag();
  const el = $('#display');
  if(el){ el.classList.remove('pop'); el.classList.add('rolling'); }
  const flick = setInterval(() => {
    const r = RARITIES[Math.floor(Math.random() * RARITIES.length)];
    showCard(r, [], '');
    beep(500 + Math.random() * 560, .022, 'square', .011);
  }, 45);
  setTimeout(() => {
    clearInterval(flick);
    const el2 = $('#display');
    if(el2) el2.classList.remove('rolling');
    resolveRoll(rollFull());

    const chance = getMultiRollChance();
    let extra = 0;
    while(extra < 5 && Math.random() < chance) extra++;
    if(extra > 0){
      for(let i = 0; i < extra; i++) resolveRoll(rollFull());
      toast('🎰 多重抽奖触发！额外 +' + extra + ' 抽');
      burst('#ff6bff', 60);
      shake(3 + extra);
    }

    renderSVIPExtras();
    state.rolling = false;
    const btn2 = $('#rollBtn');
    if(btn2) btn2.disabled = false;
    const abtn2 = $('#abyssRollBtn');
    if(abtn2) abtn2.disabled = false;
    const bbtn2 = $('#bossRollBtn');
    if(bbtn2) bbtn2.disabled = false;
    if(state.page === 'boss') updateBossUI();
  }, ROLL_ANIM);
}

function resolveRoll(result){
  const base = result.base;
  const affixes = result.affixes || [];
  const idx = RARITIES.indexOf(base);

  state.rolls++;
  state.rollCount++;
  state.inv[base.id] = (state.inv[base.id] || 0) + 1;
  state.pity = idx >= 3 ? 0 : state.pity + 1;

  if(affixes.length >= 1) state.stats.totalAffix++;
  if(affixes.length >= 2) state.stats.totalDouble++;
  if(base.id === 'N' && affixes.length >= 1) state.stats.shinyCommon++;
  if(base.id === 'N' && affixes.length >= 2) state.stats.shinyCommonDouble++;
  if(base.id === 'N'){
    for(const a of affixes){
      if(AFFIXES.indexOf(a) >= CHAOTIC_INDEX){ state.stats.chaoticCommon++; break; }
    }
  }

  const diceKey = getDiceType(state.rollCount);
  const di = getDiceInfo();
  let diceMult = 1;
  if(diceKey === 'gold')    { diceMult = di.gold;    state.stats.goldDice++; }
  if(diceKey === 'diamond') { diceMult = di.diamond; state.stats.diamondDice++; }
  if(diceKey === 'emerald') { diceMult = di.emerald; state.stats.emeraldDice++; }
  if(diceKey === 'rainbow') { diceMult = di.rainbow; state.stats.rainbowDice++; }

  const aMult = affixMult(affixes);
  const totalMult = getCoinMult() * diceMult * aMult;
  const pt = getPetTraits();
  const gainCoins = base.coins * totalMult;
  const gainGems  = base.gems * diceMult * aMult * (1 + pt.gem);
  state.coins += gainCoins;
  state.gems  += gainGems;

  trackDaily('rolls', 1);
  trackDaily('coins', gainCoins);
  if(idx >= 3) trackDaily('ssr', 1);
  if(idx >= 4) trackDaily('ur', 1);
  if(idx >= 5) trackDaily('sync', 1);
  if(affixes.length) trackDaily('affix', affixes.length);
  if(diceKey) trackDaily('dice', 1);

  let sub = '💰 +' + fmt(gainCoins) + (gainGems ? '  💎 +' + fmt(gainGems) : '');
  if(affixes.length) sub = '✦ x' + fmt(aMult) + ' · ' + sub;
  showCard(base, affixes, sub);

  const el = $('#display');
  if(el){ void el.offsetWidth; el.classList.add('pop'); }
  if(diceKey){
    showDiceTag(diceKey, diceMult);
    setTimeout(hideDiceTag, 2200);
  }

  const totalLevel = idx + affixes.length * 3;
  if(totalLevel >= 2) burst(base.color, 16 + totalLevel * 12);
  if(totalLevel >= 3) shake(totalLevel);
  if(affixes.length) setTimeout(() => burst(affixes[0].color, 30), 100);
  if(idx >= 5){
    setTimeout(() => burst('#ffffff', 55), 160);
    setTimeout(() => burst(base.color, 85), 280);
  }
  if(idx >= 8) setTimeout(() => burst('#ffffff', 90), 400);
  if(affixes.length >= 2){ burst(affixes[1].color, 60); shake(6); }

  if(diceKey === 'gold')    { burst('#ffc93c', 40); beep(1000, .2, 'square', .05); }
  if(diceKey === 'diamond') { burst('#2ee6ff', 80); shake(6); beep(1200, .3, 'sine', .055); }
  if(diceKey === 'emerald') { burst('#00ff88', 110); shake(8); beep(1400, .4, 'sine', .055); }
  if(diceKey === 'rainbow') {
    burst('#ff00e6', 150); burst('#ffffff', 100); shake(11);
    beep(1600, .5, 'sine', .05);
    setTimeout(() => beep(2100, .7, 'sine', .045), 200);
  }

  beep(200 + idx * 70, .18, 'triangle', .055);
  if(idx >= 4) setTimeout(() => beep(660 + idx * 40, .26, 'sine', .05), 100);
  if(idx >= 6){
    setTimeout(() => beep(880, .34, 'sine', .05), 210);
    setTimeout(() => beep(1180, .48, 'sine', .045), 330);
  }
  if(idx >= 10){
    setTimeout(() => beep(1500, .7, 'sine', .04), 460);
    setTimeout(() => beep(1900, .9, 'sine', .035), 620);
  }

  state.recent.unshift({ base, affixes });
  if(state.recent.length > 24) state.recent.pop();

  /* 💎 SVIP：骰子触发额外再抽一次 */
  if(diceKey && state.vip === 2 && !result.__svipExtra){
    const extraResult = rollFull();
    extraResult.__svipExtra = true;
    resolveSVIPExtra(extraResult);
  }

  if(idx >= 6) toast('🎉 获得 ' + fullName(base, affixes) + '！');
  if(affixes.length && idx >= 3) toast('✦ 词条！' + fullName(base, affixes));
  if(diceKey === 'rainbow') toast('🌈 彩虹骰子！奖励 x' + fmt(diceMult) + '！');

  /* 🕳️ 深渊伤害 */
  applyAbyssDamageFromRoll(idx, aMult, diceMult);
  /* 👹 世界 Boss 伤害 */
  applyBossDamageFromRoll(idx, aMult, diceMult);

  updateHUD();
  if(state.page === 'roll'){
    updatePityUI(); updateDiceHintUI(); renderHistUI();
  }else if(state.page === 'abyss'){
    updateAbyssUI();
  }else if(state.page === 'boss'){
    updateBossUI();
  }
}

function resolveSVIPExtra(result){
  const base = result.base;
  const affixes = result.affixes || [];
  const idx = RARITIES.indexOf(base);

  state.rolls++;
  state.rollCount++;
  state.inv[base.id] = (state.inv[base.id] || 0) + 1;
  /* 不更新保底进度，不再触发骰子 */

  if(affixes.length >= 1) state.stats.totalAffix++;
  if(affixes.length >= 2) state.stats.totalDouble++;
  if(base.id === 'N' && affixes.length >= 1) state.stats.shinyCommon++;
  if(base.id === 'N' && affixes.length >= 2) state.stats.shinyCommonDouble++;
  if(base.id === 'N'){
    for(const a of affixes){
      if(AFFIXES.indexOf(a) >= CHAOTIC_INDEX){ state.stats.chaoticCommon++; break; }
    }
  }

  const aMult = affixMult(affixes);
  const totalMult = getCoinMult() * aMult;   /* 不叠骰子倍率 */
  const pt = getPetTraits();
  const gainCoins = base.coins * totalMult;
  const gainGems  = base.gems * aMult * (1 + pt.gem);
  state.coins += gainCoins;
  state.gems  += gainGems;

  trackDaily('rolls', 1);
  trackDaily('coins', gainCoins);
  if(idx >= 3) trackDaily('ssr', 1);
  if(idx >= 4) trackDaily('ur', 1);
  if(idx >= 5) trackDaily('sync', 1);
  if(affixes.length) trackDaily('affix', affixes.length);

  /* 深渊伤害照常结算，不带骰子倍率 */
  applyAbyssDamageFromRoll(idx, aMult, 1);
  /* 👹 Boss 伤害 */
  applyBossDamageFromRoll(idx, aMult, 1);

  /* 推入队列 */
  if(!state.svipExtrasQueue) state.svipExtrasQueue = [];
  state.svipExtrasQueue.push({ base, affixes, gainCoins, gainGems });

  updateHUD();
  if(state.page === 'abyss') updateAbyssUI();
  else if(state.page === 'boss') updateBossUI();
}

function renderSVIPExtras(){
  const el = $('#svipExtras');
  if(!el) return;
  const queue = state.svipExtrasQueue || [];
  if(!queue.length){
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }

function buyNode(id){
  const n = ALL_NODES.find(x => x.id === id);
  if(!n || n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT') return;
  if(n.perma2 && state.trueRebirths < 1){ toast('🌌 需要完成真重生才能升级二阶永久树'); beep(220, .12, 'square', .04); return; }

  // ── 批量升级：按 upgradeMode（1 / 5 / 10）一次性升满目标次数 ──
  let target = Math.max(1, state.upgradeMode || 1);
  let lv = nodeLv(n);
  if(lv >= n.max) return;

  // 计算能升的次数（受「剩余可升次数」与「金币」双重限制）
  let totalCost = 0;
  let times = 0;
  for(let i = 0; i < target; i++){
    if(lv + times >= n.max) break;
    // 逐级检查前置（防止在批量过程中解锁条件变化，理论上稳定，但保险起见）
    if(!nodeIsUnlocked(n)) break;
    const c = nodeCostAt(n, lv + times);
    if(state.coins < totalCost + c) break;
    totalCost += c;
    times++;
  }
  if(times === 0){
    if(!nodeIsUnlocked(n)){ toast('前置节点未解锁'); beep(200, .12, 'square', .04); return; }
    const cost = nodeCost(n);
    toast('金币不足，需要 💰' + fmt(cost)); beep(200, .12, 'square', .04);
    return;
  }

  state.coins -= totalCost;
  setNodeLv(n, lv + times);

  beep(880, .1, 'square', .05);
  if(nodeLv(n) >= n.max) setTimeout(() => beep(1320, .2, 'sine', .05), 90);
  // 批量升级时显示总花费提示（仅多于 1 级时）
  if(times > 1) toast('⬆️ ' + esc(n.name) + ' +' + times + ' 级（💰' + fmt(totalCost) + '）');
  updateHUD();
  renderTreeContent();
  const hovered = treeCanvas.querySelector('.tnode:hover');
  if(hovered){
    const rect = hovered.getBoundingClientRect();
    showNodeTip(hovered, rect.left + rect.width / 2, rect.top + rect.height / 2);
  }
}

// 计算节点在第 lv 级时的升级花费（不依赖当前真实等级，便于批量预演）
function nodeCostAt(n, lv){
  if(n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT') return 0;
  return Math.floor(n.base * Math.pow(n.growth, lv));
}

function drawPets(count){
  const cost = getPetDrawCost(count);
  if(state.gems < cost){
    toast('钻石不足，需要 💎' + fmt(cost));
    beep(200, .12, 'square', .04);
    return;
  }
  state.gems -= cost;
  const results = [];
  for(let i = 0; i < count; i++){
    const q = rollPetQuality();
    results.push(genPet(q, rollSpecies()));
  }
  for(const pet of results){

function rollPetQuality(){
  const luck = getTotalPetDrawLuck();
  const keys = Object.keys(PET_QUALITY_WEIGHTS);
  const list = keys.map((k, i) => {
    const base = PET_QUALITY_WEIGHTS[k];
    const boost = Math.pow(1 + luck / 100, i);
    return { ref: k, w: base * boost };
  });
  return pickFrom(list).ref;
}

function autoMergeAll(){
  let shinyCount = 0, rainbowCount = 0;

  let changed = true;
  while(changed){
    changed = false;
    const groups = {};
    for(const p of state.petInv){
      if(p.richPup) continue;
      if(petTier(p) !== 0) continue;
      const key = p.species + '|' + p.quality + '|' + p.star;
      if(!groups[key]) groups[key] = [];
      groups[key].push(p);
    }
    for(const key of Object.keys(groups)){
      const list = groups[key];
      while(list.length >= 3){
        const three = list.splice(0, 3);
        const first = three[0];
        const uids = three.map(p => p.uid);
        state.petInv = state.petInv.filter(p => !uids.includes(p.uid));
        const newPet = genPet(first.quality, first.species);
        newPet.star = first.star;
        newPet.shiny = true;
        state.petInv.push(newPet);
        shinyCount++;
        changed = true;
      }
    }
  }

  changed = true;
  while(changed){
    changed = false;
    const groups = {};
    for(const p of state.petInv){
      if(p.richPup) continue;
      if(petTier(p) !== 1) continue;
      const key = p.species + '|' + p.quality + '|' + p.star;
      if(!groups[key]) groups[key] = [];
      groups[key].push(p);
    }
    for(const key of Object.keys(groups)){
      const list = groups[key];
      while(list.length >= 3){
        const three = list.splice(0, 3);
        const first = three[0];
        const uids = three.map(p => p.uid);
        state.petInv = state.petInv.filter(p => !uids.includes(p.uid));
        const newPet = genPet(first.quality, first.species);
        newPet.star = first.star;
        newPet.rainbow = true;
        state.petInv.push(newPet);
        rainbowCount++;
        changed = true;
      }
    }
  }

  return { shiny: shinyCount, rainbow: rainbowCount };
}

function countMergeable(){
  const g = { 0:{}, 1:{} };
  for(const p of state.petInv){
    const t = petTier(p);
    if(t >= 2) continue;
    const key = p.species + '|' + p.quality + '|' + p.star;
    g[t][key] = (g[t][key] || 0) + 1;
  }
  let shiny = 0, rainbow = 0;
  for(const k in g[0]) shiny += Math.floor(g[0][k] / 3);
  for(const k in g[1]) rainbow += Math.floor(g[1][k] / 3);
  return { shiny: shiny, rainbow: rainbow };
}

function updatePetFab(){
  const fab = document.getElementById('petFab');
  if(!fab) return;
  if(state.page !== 'pet'){ fab.classList.remove('show'); fab.innerHTML = ''; return; }
  const subTab = state.petTab || 'draw';

  if(subTab === 'bag'){
    const mc = countMergeable();
    const total = mc.shiny + mc.rainbow;
    let html = '<div class="pf-info">可合成 <b>' + mc.shiny + '</b> ✨ · <b>' + mc.rainbow + '</b> 🌈</div>';
    html += '<button class="pf-btn primary" data-pet-auto-merge="1"' + (total ? '' : ' disabled') + '>一键合成</button>';
    if(state.petSelection.length > 0) html += '<button class="pf-btn secondary" data-pet-clear="1">清空</button>';
    fab.innerHTML = html;
    fab.classList.add('show');
    return;
  }

  if(subTab === 'levelup'){
    const target = state.petLevelupTarget ? state.petInv.find(p => p.uid === state.petLevelupTarget) : null;
    if(!target){ fab.classList.remove('show'); fab.innerHTML = ''; return; }

    let totalExp = 0;
    for(const uid of state.petLevelupMaterials){
      const m = state.petInv.find(x => x.uid === uid);
      if(m) totalExp += petAbsorbExp(target, m);
    }
    const canAbsorb = state.petLevelupMaterials.length > 0;
    let html = '<div class="pf-info">已选 <b>' + state.petLevelupMaterials.length + '</b> 只 · +<b>' + totalExp + '</b> 经验</div>';
    html += '<button class="pf-btn secondary" data-pet-auto-select="1">⚡ 一键选材料</button>';
    if(canAbsorb) html += '<button class="pf-btn primary" data-pet-absorb="1">确认吸收</button>';
    fab.innerHTML = html;
    fab.classList.add('show');
    return;
  }

  fab.classList.remove('show');
  fab.innerHTML = '';
}

  const shoptab = e.target.closest('[data-shoptab]');
  if(shoptab){
    state.shopMainTab = shoptab.dataset.shoptab;
    renderShopPage();
    beep(600, .05, 'sine', .025);
    return;
  }

  const sub = e.target.closest('.subtab');
  if(sub){
    if(sub.dataset.sub){ state.shopTab = sub.dataset.sub; renderShopPage(); beep(600, .05, 'sine', .025); }
    if(sub.dataset.inv){ state.invTab = sub.dataset.inv; renderInvPage(); beep(600, .05, 'sine', .025); }
    if(sub.dataset.pet){
      state.petTab = sub.dataset.pet;
      state.petSelection = [];
      state.petLevelupTarget = null;
      state.petLevelupMaterials = [];
      renderPetPage();
      updatePetFab();
      beep(600, .05, 'sine', .025);
    }
    return;
  }

  if(e.target.closest('[data-pet-cancel-target]')){
    state.petLevelupTarget = null;
    state.petLevelupMaterials = [];
    renderPetPage();
    updatePetFab();
    return;
  }

  if(e.target.closest('[data-pet-clear-mat]')){
    state.petLevelupMaterials = [];
    renderPetPage();
    updatePetFab();
    return;
  }

  if(e.target.closest('[data-pet-absorb]')){
    absorbPets();
    return;
  }

  if(e.target.closest('[data-pet-auto-select]')){
    const n = autoSelectLevelup();
    if(n > 0){
      toast('⚡ 已自动选择 ' + n + ' 只材料');
      beep(760, .06, 'sine', .035);
    }else{
      toast('没有符合条件的材料');
      beep(220, .12, 'square', .04);
    }
    renderPetPage();
    updatePetFab();
    return;
  }

  const equipBtn = e.target.closest('[data-equip]');
  if(equipBtn){
    e.stopPropagation();
    toggleEquipPet(equipBtn.dataset.equip);
    return;
  }

  const el = e.target.closest('button');
  if(el){
    /* 🕳️ 源质深渊升级 */
    if(el.dataset.abyssUpg){
      const u = ABYSS_UPGRADES.find(x => x.id === el.dataset.abyssUpg);
      if(!u) return;
      const lv = state.abyssUpg[u.id] || 0;
      if(lv >= u.max) return;
      const cost = Math.floor(u.baseCost * Math.pow(u.growth, lv));
      if(state.essence < cost){ toast('❌ 源质不足，需要 💠' + fmt(cost)); beep(220,.12,'square',.04); return; }
      state.essence -= cost;
      state.abyssUpg[u.id] = lv + 1;
      beep(1200, .15, 'sine', .06);
      setTimeout(() => beep(1600, .2, 'sine', .05), 100);
      burst('#a855f7', 30);
      toast('💠 ' + u.name + ' 升至 Lv.' + (lv + 1));
      if(u.id === 'weaken'){
        const ratio = state.abyssMaxHp > 0 ? state.abyssHp / state.abyssMaxHp : 1;
        state.abyssMaxHp = computeAbyssMaxHp(state.abyssFloor);
        state.abyssHp = Math.max(1, Math.floor(state.abyssMaxHp * ratio));
      }
      updateHUD();
      renderAbyssPage();
      markDirty();
      return;
    }
    if(el.dataset.shopCoins){
      const it = SHOP_COINS.find(x => x.id === el.dataset.shopCoins);
      if(!it || state.coins < it.price) return;
      state.coins -= it.price; it.apply();
      updateHUD(); renderShopPage(); return;
    }
    if(el.dataset.shopGems){
      const it = SHOP_GEMS.find(x => x.id === el.dataset.shopGems);
      if(!it || state.gems < it.price) return;
      state.gems -= it.price; it.apply();
      updateHUD(); renderShopPage(); return;
    }
    if(el.dataset.pack){
      if(!state.rechargeUnlocked){ openOverlay('recharge'); return; }
      const pk = SHOP_PACKS.find(x => x.id === el.dataset.pack);
      if(!pk) return;
      state.coins += pk.coins; state.gems += pk.gems;
      beep(1200, .2, 'sine', .06);
      setTimeout(() => beep(1600, .3, 'sine', .05), 130);
      burst('#ff4fb5', 80);
      toast('🎉 ' + pk.name + ' 到账！💎+' + fmt(pk.gems) + ' 💰+' + fmt(pk.coins));
      updateHUD(); renderShopPage(); return;
    }
    if(el.dataset.potion){ buyPotion(el.dataset.potion); return; }
    if(el.dataset.buy){ buyShopItem(el.dataset.buy); return; }
    if(el.dataset.recharge){ buyRechargePack(el.dataset.recharge); return; }
    if(el.dataset.vipclaim){ claimVipDaily(); return; }
    if(el.dataset.bossCharge){ storePityToBossCharge(); return; }
    if(el.dataset.bossReward){ claimBossReward(parseFloat(el.dataset.bossReward)); return; }
    if(el.dataset.gamble){
      doGamble(el.dataset.gamble, el.dataset.pick);
      return;
    }
    if(el.dataset.betquick){
      const pct = parseFloat(el.dataset.betquick);
      const inp = document.getElementById('gambleAmount');
      if(inp){
        const v = Math.floor(state.coins * pct);
        inp.value = v > 0 ? v : 1;
        beep(700, .05, 'sine', .03);
      }
      return;
    }
    if(el.dataset.petDraw){ drawPets(parseInt(el.dataset.petDraw, 10)); return; }
    if(el.dataset.petMerge){ tryMergePets(); return; }
    if(el.dataset.petDecompose){ decomposePets(); return; }
    if(el.dataset.petClear){ state.petSelection = []; renderPetPage(); updatePetFab(); return; }
    if(el.dataset.petAutoMerge){
      const mc = countMergeable();
      const total = mc.shiny + mc.rainbow;
      if(!total){ toast('没有可合成的宠物'); return; }
      openConfirm('✨', '一键合成',
        '将自动合成所有可合成的组合：\n' +
        '· 普通 → ✨闪耀：' + mc.shiny + ' 只\n' +
        '· ✨闪耀 → 🌈炫彩：' + mc.rainbow + ' 只\n' +
        '（炫彩为最高形态，不再参与合成）\n\n确定吗？', () => {
        const r = autoMergeAll();
        state.petSelection = [];
        beep(800, .15, 'sine', .06);
        setTimeout(() => beep(1200, .2, 'sine', .06), 100);
        setTimeout(() => beep(1600, .3, 'sine', .055), 220);
        if(r.rainbow){
          [['#ff0080',35],['#ffc93c',35],['#00ff88',35],['#00d4ff',35],['#8b3dff',35]]
            .forEach((c, i) => setTimeout(() => burst(c[0], c[1]), i * 80));
          setTimeout(() => beep(2100, .35, 'sine', .055), 400);
        }
        burst('#ffd86b', 45);
        burst('#ffffff', 25);
        shake(8 + (r.rainbow ? 3 : 0));
        toast('✨ 一键合成完成！闪耀 ×' + r.shiny + ' · 炫彩 ×' + r.rainbow);
        updateHUD();
        renderPetPage();
        updatePetFab();
        checkAchievements();
      });
      return;
    }
    if(el.dataset.task){
      if(!state.daily) return;
      const t = state.daily.tasks.find(x => x.id === el.dataset.task);
      if(!t || t.claimed) return;
      const p = state.daily.progress[t.type] || 0;
      if(p < t.n) return;
      t.claimed = true;
      if(t.reward.coins) state.coins += t.reward.coins;
      if(t.reward.gems)  state.gems  += t.reward.gems;
      beep(1100, .2, 'sine', .06);
      setTimeout(() => beep(1500, .3, 'sine', .05), 120);
      toast('✅ 任务完成！' + (t.reward.coins ? '💰' + fmt(t.reward.coins) : '') +
            (t.reward.gems ? ' 💎' + fmt(t.reward.gems) : ''));
      saveDaily(); updateHUD(); renderTaskPage(); return;
    }
    if(el.dataset.rebirth){ doRebirth(el.dataset.rebirth); return; }
    if(el.dataset.truerebirth){ doTrueRebirth(); return; }
    if(el.dataset.eventRoll){
      if(state.gems < 500){ toast('钻石不足'); return; }
      state.gems -= 500;
      updateHUD();
      rollEvent(true);
      renderEventPage();
      return;
    }
  }

  const petCard = e.target.closest('[data-pet-card]');
  if(petCard){
    const uid = petCard.dataset.petCard;

    if(state.petTab === 'bag'){
      const alreadySel = state.petSelection.includes(uid);
      if(alreadySel){
        state.petSelection = state.petSelection.filter(x => x !== uid);
      }else{
        if(state.petSelection.length >= 3){
          toast('最多选择 3 只');
          beep(220, .12, 'square', .04);
          return;
        }
        state.petSelection.push(uid);
      }
    }else if(state.petTab === 'levelup'){
      const p = state.petInv.find(x => x.uid === uid);
      if(!p) return;
      if(!state.petLevelupTarget){
        state.petLevelupTarget = uid;
        state.petLevelupMaterials = [];
        toast('已选主宠物：' + petPrefix(p) + getSpecies(p.species).name + ' ' + getQuality(p.quality).name);
      }else if(state.petLevelupTarget === uid){
        state.petLevelupTarget = null;
        state.petLevelupMaterials = [];
      }else{
        const target = state.petInv.find(x => x.uid === state.petLevelupTarget);
        if(!target){ return; }
        if(p.star !== target.star){ toast('材料需要同星'); beep(220, .12, 'square', .04); return; }
        const ti = PET_QUALITIES.findIndex(x => x.id === target.quality);
        const pi = PET_QUALITIES.findIndex(x => x.id === p.quality);
        if(pi > ti){ toast('材料品质不能高于主宠物'); beep(220, .12, 'square', .04); return; }
        if(petTier(p) !== petTier(target)){ toast('材料形态必须与主宠物相同'); beep(220, .12, 'square', .04); return; }
        const idx = state.petLevelupMaterials.indexOf(uid);
        if(idx >= 0) state.petLevelupMaterials.splice(idx, 1);
        else state.petLevelupMaterials.push(uid);
      }
    }else{
      return;
    }
    beep(700, .05, 'sine', .03);
    renderPetPage();
    updatePetFab();
    return;
  }

  const equipSlot = e.target.closest('[data-unequip]');
  if(equipSlot){
    const uid = equipSlot.dataset.unequip;
    toggleEquipPet(uid);
    return;
  }
});

window.addEventListener('keydown', e => {
  if($('#overlay').classList.contains('on')){
    if(e.key === 'Escape') closeOverlay();
    return;
  }
  if($('#confirmOverlay').classList.contains('on')){
    if(e.key === 'Escape') closeConfirm();
    return;
  }
  if(state.page === 'roll' || state.page === 'abyss' || state.page === 'boss'){
    if(e.target.tagName === 'BUTTON' && (e.code === 'Space' || e.key === ' ')) return;
    if(e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      if(!state.auto) doRoll();
    }
    if(e.key === 'a' || e.key === 'A'){
      if(!e.repeat){
        const b = state.page === 'roll'  ? $('#autoBtn')
                : state.page === 'abyss' ? $('#abyssAutoBtn')
                :                          $('#bossAutoBtn');
        if(b) b.click();
      }
    }
  }
});

    };
  },
  buffWorm: function(mult){
    mult = (typeof mult === 'number' && mult > 0) ? mult : 10;
    const worm = PET_SPECIES.find(s => s.id === 'worm');
    if(!worm){ console.warn('❌ 找不到蚕大蛇'); return; }
    worm.w *= mult;
    const total = PET_SPECIES.reduce((s,x) => s + x.w, 0);
    const pct = (worm.w / total * 100).toFixed(4);
    console.log('%c🐛 蚕大蛇权重 ×' + mult + ' → 当前权重 ' + worm.w + '（抽中概率约 ' + pct + '%）',
      'color:#8faa3a;font-weight:900;font-size:13px');
    return worm.w;
  },
  setWormWeight: function(w){
    const worm = PET_SPECIES.find(s => s.id === 'worm');
    if(!worm){ console.warn('❌ 找不到蚕大蛇'); return; }
    worm.w = Math.max(0, Number(w) || 0);
    const total = PET_SPECIES.reduce((s,x) => s + x.w, 0);
    const pct = total ? (worm.w / total * 100).toFixed(4) : '0';
    console.log('%c🐛 蚕大蛇权重设为 ' + worm.w + '（抽中概率约 ' + pct + '%）',
      'color:#8faa3a;font-weight:900;font-size:13px');
    return worm.w;
  },
  giveWorm: function(count){
    count = Math.max(1, Math.floor(count) || 1);
    for(let i = 0; i < count; i++){
      state.petInv.push(genPet('N', 'worm'));
    }
    console.log('%c🐛 已获得 ' + count + ' 只蚕大蛇', 'color:#8faa3a;font-weight:900');
    updateHUD();
    renderPetPage();
    checkAchievements();
  },
  wormInfo: function(){
    const worm = PET_SPECIES.find(s => s.id === 'worm');
    const total = PET_SPECIES.reduce((s,x) => s + x.w, 0);
    const pct = (worm.w / total * 100).toFixed(4);
    console.log('%c🐛 蚕大蛇：权重 ' + worm.w + ' / 总权重 ' + total +
      ' → 抽中概率约 ' + pct + '%（约 ' + Math.round(total / worm.w) + ' 抽一只）',
      'color:#8faa3a;font-weight:900;font-size:13px');
    return { weight: worm.w, total: total, pct: pct };
  },
  giveShiny: function(species, quality, star, n){
    species = species || 'dog';
    quality = quality || 'N';
    star = Math.max(1, Math.min(MAX_STAR, star || 1));
    n = Math.max(1, Math.floor(n) || 3);
    for(let i = 0; i < n; i++){
      const p = genPet(quality, species);
      p.star = star;
      p.shiny = true;
      state.petInv.push(p);
    }
    updateHUD(); renderPetPage(); updatePetFab();
    console.log('%c✨ 已生成 ' + n + ' 只闪耀宠物（' + species + ' / ' + quality + ' / ' + star + '★）',
      'color:#ffd86b;font-weight:900');
  },
  giveEssence: function(n){
    n = Number(n);
    if(!isFinite(n)) return console.warn('❌ 用法：symrng.giveEssence(1000)');
    state.essence = Math.max(0, state.essence + n);
    updateHUD();
    if(state.page === 'abyss') renderAbyssPage();
    console.log('%c💠 源质 +' + fmt(n) + ' → ' + fmt(state.essence), 'color:#a855f7;font-weight:900');
    return state.essence;
  },
  abyssInfo: function(){

    console.log('  变异: ' + getAbyssMods().map(m => m.name).join('、'));
    console.log('  源质: ' + state.essence);
    return { floor: state.abyssFloor, best: state.abyssBest, hp: state.abyssHp, maxHp: state.abyssMaxHp, essence: state.essence };
  },
  bossInfo: function(){
    ensureBossInit();
    console.log('%c👹 世界 Boss 信息', 'color:#ff5f5f;font-weight:900;font-size:13px');
    console.log('  ' + state.boss.emoji + ' ' + state.boss.name + '（' + state.boss.desc + '）');
    console.log('  弱点: ' + getBossWeakness().name);
    console.log('  HP: ' + fmt(state.boss.hp) + ' / ' + fmt(state.boss.maxHp));
    console.log('  本周伤害: ' + fmt(state.boss.totalDamage));
    console.log('  击杀: ' + state.boss.kills + ' · 充能: ' + state.boss.charges);
    return state.boss;
  }
};

let panel = null;

function q(sel){ return panel ? panel.querySelector(sel) : null; }
function vNum(sel){
  const e = q(sel); if(!e) return NaN;
  const v = parseFloat(e.value);
  return isFinite(v) ? v : NaN;
}
function vInt(sel, def){
  const e = q(sel); if(!e) return def;
  const v = parseInt(e.value, 10);
  return isFinite(v) ? v : def;
}

function refresh(){
  if(!panel) return;

  let ptreeSum = 0;
  for(const k in state.ptree) if(k !== 'PROOT') ptreeSum += state.ptree[k];
  let ptree2Sum = 0;
  for(const k in state.ptree2) if(k !== 'P2ROOT') ptree2Sum += state.ptree2[k];

  const so = q('#saStatOut');
  if(so) so.textContent =
    '金币倍率  x' + fmt(getCoinMult()) + '\n' +
    '幸运倍率  x' + getLuckMult().toFixed(2) + '\n' +
    '自动间隔  ' + Math.round(getAutoInterval()) + ' ms\n' +
    '保底上限  ' + (getPityMax() === null ? '未解锁' : getPityMax() + ' 抽') + '\n' +
    '多重抽奖  ' + (getMultiRollChance() * 100).toFixed(2) + '% 概率追抽\n' +
    '宠物倍率  x' + fmt(getPetPermaMult()) + '（含永久）\n' +
    '永久树等级 ' + ptreeSum + ' · 二阶树等级 ' + ptree2Sum + '\n' +
    '宠物抽奖幸运 ' + fmt(getTotalPetDrawLuck()) + '\n' +
    '真重生次数 ' + state.trueRebirths + ' · 宠物抽奖折扣 -' +
      Math.round(Math.min(TRUE_REBIRTH.petDrawDiscountCap, state.trueRebirths * TRUE_REBIRTH.petDrawDiscountPer) * 100) + '%\n' +
    '当前活动  ' + getEvent().emoji + ' ' + getEvent().name + '\n' +
    '👹 Boss击杀 ' + (state.boss ? state.boss.kills : 0) + ' · 充能 ' + (state.boss ? state.boss.charges : 0);

  const po = q('#saPetOut');
  if(po){
    const mc = countMergeable();
    po.textContent =
      '宠物总数 ' + state.petInv.length +
      ' · 已装备 ' + state.petEquipped.length +
      ' · 普通 ' + state.petInv.filter(p => petTier(p) === 0).length +
      ' / ✨' + state.petInv.filter(p => petTier(p) === 1).length +
      ' / 🌈' + state.petInv.filter(p => petTier(p) === 2).length + '\n' +
      '可合成 → ✨ ' + mc.shiny + ' 组 · 🌈 ' + mc.rainbow + ' 组\n' +
      '已收集稀有度 ' + RARITIES.filter(r => state.inv[r.id] > 0).length + '/' + RARITIES.length +
      ' · 成就 ' + Object.keys(state.unlockedAch).length + '/' + ACHIEVEMENTS.length;
  }

  const ao = q('#saAbyssOut');
  if(ao){
    const mods = getAbyssMods();
    ao.textContent =
      '当前层 ' + state.abyssFloor + ' · 最高 ' + state.abyssBest + '\n' +
      'HP ' + fmt(Math.max(0, state.abyssHp)) + ' / ' + fmt(state.abyssMaxHp) + '\n' +
      '变异 ' + (mods.length ? mods.map(m => m.emoji + m.name).join('、') : '无') + '\n' +
      '源质 ' + fmt(state.essence) + '\n' +
      '升级 ' + ABYSS_UPGRADES.map(u => u.name + ' Lv.' + (state.abyssUpg[u.id] || 0)).join(' · ');
  }

  const svo = q('#saSaveOut');
  if(svo) svo.textContent = JSON.stringify({
    coins: state.coins,
    gems: state.gems,
    rolls: state.rolls,
    trueRebirths: state.trueRebirths,
    pets: state.petInv.length,
    rainbow: state.petInv.filter(p => p.rainbow).length,
    achievements: Object.keys(state.unlockedAch).length + '/' + ACHIEVEMENTS.length,
    abyssFloor: state.abyssFloor,
    abyssBest: state.abyssBest,
    essence: state.essence,
    bossKills: state.boss ? state.boss.kills : 0,
    ptreeLevels: ptreeSum,
    ptree2Levels: ptree2Sum
  }, null, 1);
}

function apply(){
  updateHUD();
  markDirty();
  try{ saveGame(); }catch(e){}
  if(state.page === 'roll'){
    updatePityUI();
    updateDiceHintUI();
    renderHistUI();
  }else{
    renderPage();
  }
  updatePetFab();
  refresh();
}

function act(a){
  switch(a){
    case 'close': close(); return;

    case 'setCoins': {
      const v = vNum('#saCoins');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.coins = Math.max(0, v); break;
    }
    case 'maxCoins':  state.coins = 1e60; break;
    case 'x10Coins':  state.coins = state.coins * 10 + 1; break;
    case 'zeroCoins': state.coins = 0; break;

    case 'setGems': {
      const v = vNum('#saGems');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.gems = Math.max(0, v); break;
    }
    case 'maxGems':  state.gems = 1e30; break;
    case 'x10Gems':  state.gems = state.gems * 10 + 1; break;
    case 'zeroGems': state.gems = 0; break;

    case 'setRolls': {
      const v = vNum('#saRolls');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.rolls = Math.max(0, Math.floor(v)); break;
    }
    case 'zeroRolls': state.rolls = 0; break;

    case 'setPity': {
      const v = vNum('#saPity');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.pity = Math.max(0, Math.floor(v)); break;
    }
    case 'pityFull': {
      const pm = getPityMax();
      if(pm === null){ toast('⚠️ 还没解锁保底系统'); return; }
      state.pity = pm; break;
    }
    case 'pityZero': state.pity = 0; break;

    case 'setRollCount': {
      const v = vNum('#saRollCount');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.rollCount = Math.max(0, Math.floor(v)); break;
    }
    case 'diceGold':
      state.rollCount = state.rollCount - (state.rollCount % DICE_INTERVAL.gold) + (DICE_INTERVAL.gold - 1);
      break;
    case 'diceDiamond':
      state.rollCount = state.rollCount - (state.rollCount % DICE_INTERVAL.diamond) + (DICE_INTERVAL.diamond - 1);
      break;

    case 'setReb': state.rebirths   = Math.max(0, vInt('#saReb', 0)); break;
    case 'setAsc': state.ascends    = Math.max(0, vInt('#saAsc', 0)); break;
    case 'setTra': state.transcends = Math.max(0, vInt('#saTra', 0)); break;
    case 'rebAllMax':
      state.rebirths += 10; state.ascends += 10; state.transcends += 10;
      break;
    case 'setTrueReb': state.trueRebirths = Math.max(0, vInt('#saTrueReb', 0)); break;
    case 'setPetLuck': state.petDrawLuck = Math.max(0, vInt('#saPetLuck', 0)); break;
    case 'unlockAbyss':
      state.trueRebirths = Math.max(1, state.trueRebirths);
      if(state.abyssFloor <= 0){
        state.abyssFloor = 1;
        state.abyssBest = Math.max(state.abyssBest, 1);
        initAbyssFloor(1);
      }
      buildNav();
      toast('🕳️ 源质深渊已解锁');
      break;

    case 'treeMax':
      for(const n of ALL_NODES){
        if(n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT') continue;
        setNodeLv(n, n.max);
      }
      break;
    case 'treeOne':
      state.tree = { root: 1 };
      for(const n of TREE) if(n.id !== 'root') state.tree[n.id] = Math.min(1, n.max);
      break;
    case 'treeZero':
      state.tree = { root: 1 };
      break;
    case 'ptreeMax':
      for(const n of PERMA_TREE){
        if(n.id === 'PROOT') continue;
        state.ptree[n.id] = n.max;
      }
      break;
    case 'ptreeZero':
      state.ptree = { PROOT: 1 };
      break;
    case 'ptree2Max':
      for(const n of PERMA_TREE_2){
        if(n.id === 'P2ROOT') continue;
        state.ptree2[n.id] = n.max;
      }
      break;
    case 'nodeSet': {
      const id = q('#saNode') ? q('#saNode').value : '';
      const n = ALL_NODES.find(x => x.id === id);
      if(!n) return;
      const lv = vInt('#saNodeLv', -1);
      if(lv < 0){ toast('❌ 请输入等级'); return; }
      const v = Math.max(0, Math.min(n.max, lv));
      setNodeLv(n, v);
      break;
    }
    case 'nodeMax': {
      const id = q('#saNode') ? q('#saNode').value : '';
      const n = ALL_NODES.find(x => x.id === id);
      if(!n) return;
      setNodeLv(n, n.max);
      break;
    }

    case 'spawnPet': {
      const spId  = q('#saSp')   ? q('#saSp').value   : 'dog';
      const qId   = q('#saQ')    ? q('#saQ').value    : 'N';
      const star  = q('#saStar') ? (parseInt(q('#saStar').value, 10) || 1) : 1;
      const form  = q('#saForm') ? (parseInt(q('#saForm').value, 10) || 0) : 0;
      let n = vInt('#saPetN', 1);
      n = Math.max(1, Math.min(100, n));
      const sp = getSpecies(spId);
      for(let i = 0; i < n; i++){
        const p = genPet(qId, spId);
        p.star  = Math.max(sp.minStar, Math.min(MAX_STAR, star));
        p.shiny = form === 1;
        p.rainbow = form === 2;
        state.petInv.push(p);
      }
      const formTxt = form === 2 ? '🌈炫彩' : form === 1 ? '✨闪耀' : '普通';
      toast('✅ 已生成 ' + n + ' 只 ' + formTxt + '宠物');
      break;
    }
    case 'all6':     for(const p of state.petInv) p.star = MAX_STAR; break;
    case 'allShiny': for(const p of state.petInv){ if(!p.rainbow) p.shiny = true; } break;
    case 'allGod':   for(const p of state.petInv){ p.quality = 'GOD'; p.exp = 0; } break;
    case 'quickRainbow': {
      const spId = q('#saSp') ? q('#saSp').value : 'dog';
      const qId  = q('#saQ')  ? q('#saQ').value  : 'N';
      const star = q('#saStar') ? (parseInt(q('#saStar').value, 10) || 1) : 1;
      const sp = getSpecies(spId);
      for(let i = 0; i < 3; i++){
        const p = genPet(qId, spId);
        p.star = Math.max(sp.minStar, Math.min(MAX_STAR, star));
        p.shiny = true;
        state.petInv.push(p);
      }
      toast('✨ 已生成 3 只同规格闪耀宠物，去背包合成炫彩吧');
      break;
    }
    case 'equipBest': {
      const s = state.petInv.slice().sort((x, y) => petMult(y) - petMult(x));
      state.petEquipped = s.slice(0, MAX_PETS).map(p => p.uid);
      break;
    }
    case 'equipClear': state.petEquipped = []; break;
    case 'petClear':
      state.petInv = [];
      state.petEquipped = [];
      state.petSelection = [];
      state.petLevelupTarget = null;
      state.petLevelupMaterials = [];
      break;

    case 'abyssSetFloor': {
      const v = vInt('#saAbyssFloor', -1);
      if(v < 1){ toast('❌ 层数需 ≥ 1'); return; }
      state.abyssFloor = v;
      state.abyssBest = Math.max(state.abyssBest, v);
      initAbyssFloor(v);
      toast('🕳️ 已跳转至第 ' + v + ' 层');
      break;
    }
    case 'abyssNext': {
      if(state.abyssFloor < 1){ state.abyssFloor = 1; }
      state.abyssFloor += 1;
      state.abyssBest = Math.max(state.abyssBest, state.abyssFloor);
      initAbyssFloor(state.abyssFloor);
      toast('🕳️ 已进入第 ' + state.abyssFloor + ' 层');
      break;
    }
    case 'abyssNext10': {
      if(state.abyssFloor < 1){ state.abyssFloor = 1; }
      state.abyssFloor += 10;
      state.abyssBest = Math.max(state.abyssBest, state.abyssFloor);
      initAbyssFloor(state.abyssFloor);
      toast('🕳️ 已进入第 ' + state.abyssFloor + ' 层');
      break;
    }
    case 'abyssSetEssence': {
      const v = vNum('#saEssence');
      if(isNaN(v)) return toast('❌ 请输入有效数字');
      state.essence = Math.max(0, v); break;
    }
    case 'abyssAddEssence':
      state.essence += 10000; break;
    case 'abyssMaxEssence':
      state.essence = 1e12; break;
    case 'abyssKill': {
      if(state.abyssFloor < 1){ toast('❌ 还没解锁深渊'); return; }
      state.abyssHp = 0;
      onAbyssClear();
      break;
    }
    case 'abyssReroll': {
      if(state.abyssFloor < 1){ toast('❌ 还没解锁深渊'); return; }
      state.abyssRerollLeft = Math.max(1, getAbyssRerollMax());
      rerollAbyssMods();
      break;
    }
    case 'abyssUpgMax': {
      for(const u of ABYSS_UPGRADES) state.abyssUpg[u.id] = u.max;
      if(state.abyssFloor >= 1){
        const ratio = state.abyssMaxHp > 0 ? state.abyssHp / state.abyssMaxHp : 1;
        state.abyssMaxHp = computeAbyssMaxHp(state.abyssFloor);
        state.abyssHp = Math.max(1, Math.floor(state.abyssMaxHp * ratio));
      }
      toast('💠 源质升级全部满级');
      break;
    }

    case 'achAll': {
      const now = Date.now();
      let c = 0;
      for(const x of ACHIEVEMENTS){
        if(!state.unlockedAch[x.id]){ state.unlockedAch[x.id] = now; c++; }
      }
      saveAch();
      toast('🏆 解锁 ' + c + ' 个成就');
      break;
    }
    case 'achClear':
      state.unlockedAch = {};
      saveAch();
      break;

    case 'eventSet': {
      const id = q('#saEvent') ? q('#saEvent').value : '';
      const e = EVENTS.find(x => x.id === id);
      if(!e) return;
      state.event = e.id;
      state.eventUntil = Date.now() + (e.id === 'none' ? 60000 : e.dur * 1000);
      toast('🎉 活动切换：' + e.emoji + ' ' + e.name);
      break;
    }
    case 'eventRand': rollEvent(true); break;

    case 'buffAdd': {
      const type = q('#saBuffType') ? q('#saBuffType').value : 'luck';
      const v    = vNum('#saBuffVal');
      const dur  = vNum('#saBuffDur') || 300;
      if(isNaN(v)){ toast('❌ 请输入数值'); return; }
      const b = { name: '后台Buff', emoji: '🛠️', color: '#9fc4ff', dur: dur };
      if(type === 'luck')  b.luck = v;
      if(type === 'coin')  b.coinMult = v;
      if(type === 'speed') b.speedMult = v;
      if(type === 'affix') b.affixBonus = v;
      addBuff(b);
      break;
    }
    case 'buffClear':
      state.buffs = [];
      renderBuffBar();
      toast('🧹 已清空 Buff');
      break;

    case 'tSound':
      state.sound = !state.sound;
      toast('🔊 音效：' + (state.sound ? '开' : '关'));
      break;
    case 'tAuto': {
      state.auto = !state.auto;
      const btn = document.getElementById('autoBtn');
      if(btn){
        btn.textContent = state.auto ? '自动抽取：开' : '自动抽取：关';
        btn.classList.toggle('on', state.auto);
      }
      const abtn = document.getElementById('abyssAutoBtn');
      if(abtn){
        abtn.textContent = state.auto ? '自动抽取：开' : '自动抽取：关';
        abtn.classList.toggle('on', state.auto);
      }
      if(state.auto) lastRollTime = performance.now() - getAutoInterval();
      toast('🤖 自动抽取：' + (state.auto ? '开' : '关'));
      break;
    }
    case 'unlockRc':
      state.rechargeUnlocked = true;
      try{ localStorage.setItem('symrng_recharge', '1'); }catch(e){}
      toast('🔓 充值系统已解锁');
      break;

    case 'saveNow': saveGame(); toast('💾 已保存'); break;
    case 'expSave': exportSave(); break;
    case 'impSave': importSaveFromFile(); break;
    case 'cpSave':  copySaveToClipboard(); break;
    case 'pstSave': pasteSaveFromClipboard(); break;
    case 'wipe':    wipeSave(); break;

    default: return;
  }
  apply();
}

function bind(){
  panel.addEventListener('click', function(e){
    if(e.target === panel){ close(); return; }

    const tab = e.target.closest('.sa-tab');
    if(tab){
      panel.querySelectorAll('.sa-tab').forEach(function(t){
        t.classList.toggle('on', t === tab);
      });
      panel.querySelectorAll('.sa-pane').forEach(function(p){
        p.classList.toggle('on', p.dataset.pane === tab.dataset.tab);
      });
      refresh();
      return;
    }

    const btn = e.target.closest('[data-act]');
    if(btn) act(btn.dataset.act);
  });

  panel.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ e.stopPropagation(); close(); return; }
    e.stopPropagation();
  });
  panel.addEventListener('keyup', function(e){ e.stopPropagation(); });
  panel.addEventListener('keypress', function(e){ e.stopPropagation(); });
}

function open(){
  if(!panel){
    if(!document.getElementById('saStyle')){
      const st = document.createElement('style');
      st.id = 'saStyle';
      st.textContent = CSS;
      document.head.appendChild(st);
    }
    panel = document.createElement('div');
    panel.id = 'saRoot';
    panel.innerHTML = build();
    document.body.appendChild(panel);
    bind();
  }
  panel.classList.add('on');
  refresh();
  try{
    console.log('%c🛠️ 后台已打开（Esc 关闭）',
      'color:#9fc4ff;font-weight:900;font-size:13px');
  }catch(e){}
}
function close(){
  if(!panel) return;
  panel.classList.remove('on');
  apply();
}

const _saKeys = {};
document.addEventListener('keydown', function(e){
  _saKeys[e.key.toLowerCase()] = true;
  if(_saKeys['l'] && _saKeys['b'] && _saKeys['s']){
    e.preventDefault();
    if(panel && panel.classList.contains('on')) close();
    else open();
    _saKeys['l'] = _saKeys['b'] = _saKeys['s'] = false;
  }
});
document.addEventListener('keyup', function(e){
  _saKeys[e.key.toLowerCase()] = false;
});

window.symrng = window.symrng || {};
window.symrng.admin        = open;
window.symrng.panel        = open;
window.symrng['后台']      = open;
window.symrng.closeAdmin   = close;

if(!window.symrng.addCoins){
  window.symrng.addCoins = function(n){
    n = Number(n);
    if(!isFinite(n)) return console.warn('❌ 用法：symrng.addCoins(1e18)');
    state.coins = Math.max(0, state.coins + n);
    updateHUD(); markDirty();
    console.log('%c💰 ' + fmt(state.coins), 'color:#ffc93c;font-weight:900');
    return state.coins;
  };
  window.symrng.addGems = function(n){
    n = Number(n);
    if(!isFinite(n)) return console.warn('❌ 用法：symrng.addGems(1e6)');
    state.gems = Math.max(0, state.gems + n);
    updateHUD(); markDirty();
    console.log('%c💎 ' + fmt(state.gems), 'color:#2ee6ff;font-weight:900');
    return state.gems;
  };
  window.symrng.maxTree = function(){
    for(const n of TREE) state.tree[n.id] = n.max;
    state.tree.root = 1;
    updateHUD(); markDirty();
    if(state.page === 'tree') renderPage();
    console.log('%c🌳 普通技能树已全部满级', 'color:#8ff0c4;font-weight:900');
  };
  window.symrng.maxPermaTree = function(){
    for(const n of PERMA_TREE) state.ptree[n.id] = n.max;
    state.ptree.PROOT = 1;
    updateHUD(); markDirty();
    if(state.page === 'tree') renderPage();
    console.log('%c💎 永久技能树已全部满级', 'color:#ffc93c;font-weight:900');
  };
  window.symrng.maxPermaTree2 = function(){
    for(const n of PERMA_TREE_2) state.ptree2[n.id] = n.max;
    state.ptree2.P2ROOT = 1;
    updateHUD(); markDirty();
    if(state.page === 'tree') renderPage();
    console.log('%c🌌 二阶永久技能树已全部满级', 'color:#c85aff;font-weight:900');
  };
  window.symrng.allAch = function(){
    const now = Date.now();
    let c = 0;
    for(const a of ACHIEVEMENTS) if(!state.unlockedAch[a.id]){ state.unlockedAch[a.id] = now; c++; }
    saveAch();
    console.log('%c🏆 解锁 ' + c + ' 个成就', 'color:#ffc93c;font-weight:900');
    return c;
  };
}

try{
  console.log(
    '%c🐴 沙杨马 RNG · 可视化后台 v10\n' +
    '%csymrng.admin()  →  打开后台面板（或按 L+B+S）\n' +
    '%csymrng.giveEssence(10000)  →  直接获得源质\n' +
    '%csymrng.abyssInfo()  →  查看深渊状态\n' +
    '%csymrng.bossInfo()  →  查看世界 Boss 状态',
    'color:#8ff0c4;font-size:14px;font-weight:900',
    'color:#9fc4ff;font-size:12px',
    'color:#a855f7;font-size:12px',
    'color:#ff9bd8;font-size:12px',
    'color:#ff5f5f;font-size:12px'
  );
}catch(e){}

})();

})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>沙杨马 RNG · 无限抽奖</title>
<style>
:root{
  --gold:#ffc93c;--gem:#2ee6ff;--line:rgba(255,255,255,.08);
  --panel:rgba(16,23,44,.86);--nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1400px 800px at 50% -20%, #1c2a55 0%, transparent 65%),
    radial-gradient(1000px 700px at 90% 110%, #3a1450 0%, transparent 65%),
    #070b14;
  color:#e8eefc;overflow-x:hidden;user-select:none;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.app{max-width:1320px;margin:0 auto;padding:14px 24px calc(var(--nav-h) + 34px);position:relative;z-index:2;min-height:100vh;}
@media(max-width:820px){.app{padding:12px 12px calc(var(--nav-h) + 26px);}}

.hud{
  display:flex;flex-wrap:wrap;gap:7px;justify-content:center;
  padding:9px;border-radius:16px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);margin-bottom:10px;
  position:sticky;top:6px;z-index:30;box-shadow:0 10px 30px -18px #000;
}
.chip{
  display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  font-size:12.5px;font-weight:800;white-space:nowrap;
}
.chip .v{font-variant-numeric:tabular-nums;color:#fff}
.chip.gold .v{color:var(--gold);text-shadow:0 0 12px rgba(255,201,60,.5)}
.chip.gem .v{color:var(--gem);text-shadow:0 0 12px rgba(46,230,255,.5)}
.chip.rb .v{color:#ff9bd8;text-shadow:0 0 12px rgba(255,155,216,.5)}
.chip.abyss .v{color:#c85aff;text-shadow:0 0 12px rgba(200,90,255,.6)}
.chip.vip .v{color:#ffd86b;text-shadow:0 0 12px rgba(255,200,60,.6)}
.chip.svip .v{color:#ff6bff;text-shadow:0 0 12px rgba(255,107,255,.6)}

.buffs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;min-height:0}
.buff{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;
  font-size:11px;font-weight:800;background:rgba(255,255,255,.06);
  border:1px solid var(--bc,rgba(255,255,255,.15));color:#dde6f7;
}
.buff .bt{color:#9aa8c4;font-variant-numeric:tabular-nums}

.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-title{text-align:center;margin:4px 0 18px}
.page-title h2{
  font-size:clamp(19px,2.4vw,24px);font-weight:900;letter-spacing:.08em;
  background:linear-gradient(100deg,#8fd4ff,#a88bff 50%,#ff9bd8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.page-title p{font-size:11.5px;color:#6d7a94;letter-spacing:.14em;margin-top:5px}

.roll-area{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.display{
  --c:#8b98ad;width:min(78vw,320px);aspect-ratio:1/1.02;border-radius:28px;
  background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.012)),#0b1120;
  border:2.5px solid var(--c);
  box-shadow:0 0 0 1px rgba(255,255,255,.04),0 26px 60px -26px var(--c),inset 0 0 80px -36px var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  position:relative;overflow:hidden;transition:border-color .25s,box-shadow .4s;flex:none;
}
.display::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.24) 50%,transparent 60%);
  transform:translateX(-130%);pointer-events:none;
}
.display.pop::after{animation:sheen .9s ease-out}
@keyframes sheen{to{transform:translateX(130%)}}
.display.rolling{animation:jit .08s infinite}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(-2px,2px)}100%{transform:translate(2px,-1.5px)}}
.display.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.09)}100%{transform:scale(1)}}
.dice-tag{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  padding:5px 15px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.08em;
  background:var(--dc,#ffc93c);color:#080b14;box-shadow:0 0 26px var(--dc,#ffc93c);
  white-space:nowrap;z-index:3;opacity:0;transition:opacity .18s;pointer-events:none;
}
.dice-tag.show{opacity:1;animation:dicePop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes dicePop{0%{transform:translateX(-50%) scale(.3);opacity:0}70%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1);opacity:1}}
.d-badge{
  font-size:13px;font-weight:900;letter-spacing:.24em;padding:5px 17px;border-radius:999px;
  background:var(--c);color:#080b14;transition:background .25s;
}
.d-name{
  font-size:clamp(20px,4vw,28px);font-weight:900;letter-spacing:.05em;
  color:var(--c);text-shadow:0 0 28px var(--c);
  transition:color .25s,text-shadow .25s;text-align:center;padding:0 12px;line-height:1.28;
}
.d-name .sep{color:#7c89a5;font-weight:700}
.d-sub{font-size:11.5px;letter-spacing:.08em;color:#6b7893;text-align:center;padding:0 16px;line-height:1.6}

.roll-side{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px}
.dice-hint{font-size:12px;color:#7c89a5;letter-spacing:.05em;font-weight:700;text-align:center}
.dice-hint b{font-size:14px}
.dice-list{display:flex;flex-direction:column;gap:5px;width:100%}
.dice-card{
  display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  font-size:11.5px;font-weight:800;color:#c8d4ea;transition:.22s;
}
.dice-card.next{
  border-color:var(--dc);
  background:rgba(255,255,255,.09);
  box-shadow:0 0 16px -6px var(--dc),inset 0 0 12px -8px var(--dc);
}
.dice-card .dc-emoji{font-size:15px;line-height:1}
.dice-card .dc-name{flex:1;color:#dde6f7;letter-spacing:.02em}
.dice-card .dc-next{color:var(--dc);font-weight:900;font-variant-numeric:tabular-nums}
.dice-card .dc-mult{
  color:#8ff0c4;font-weight:900;font-variant-numeric:tabular-nums;font-size:10.5px;
  padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.28);
}
.pity-wrap{width:100%}
.pity-top{display:flex;justify-content:space-between;font-size:11.5px;color:#8b98ad;letter-spacing:.06em;margin-bottom:6px;font-weight:700}
.pity-top .locked{color:#ff8a8a}
.pity-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.pity-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#3fa9ff,#ffb020,#ff3d6e);border-radius:99px;transition:width .3s}
.pity-bar.locked i{background:rgba(255,120,120,.35)}

.btn{border:none;border-radius:16px;cursor:pointer;font-weight:900;letter-spacing:.08em;font-family:inherit;transition:transform .1s,filter .2s,box-shadow .2s;width:100%;}
.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.roll-btn{padding:17px;font-size:19px;letter-spacing:.34em;text-indent:.34em;background:linear-gradient(180deg,#4a86ff,#1d3fd0);color:#fff;border:1px solid rgba(150,190,255,.5);box-shadow:0 14px 36px -10px #3f7bff,inset 0 1px 0 rgba(255,255,255,.3);}
.auto-btn{padding:14px;font-size:13px;letter-spacing:.16em;background:linear-gradient(180deg,#22c98a,#0d8557);color:#03150e;border:1px solid rgba(120,255,210,.4);box-shadow:0 10px 26px -12px #22c98a;}
.auto-btn.on{background:linear-gradient(180deg,#ff5f5f,#b81c1c);color:#fff;border-color:rgba(255,140,140,.5);box-shadow:0 10px 26px -12px #ff5f5f;}

.hist{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:26px;padding:0 4px}
.hchip{font-size:10px;font-weight:900;letter-spacing:.05em;padding:3px 8px;border-radius:7px;color:var(--c);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);position:relative;}
.hchip .hstar{position:absolute;top:-5px;right:-4px;font-size:9px;line-height:1;color:#fff9a8;text-shadow:0 0 6px #fff9a8}

.card{border-radius:20px;background:var(--panel);border:1px solid var(--line);overflow:hidden;backdrop-filter:blur(10px);margin-bottom:12px;}
.card-head{padding:11px 14px;font-size:12.5px;font-weight:900;letter-spacing:.06em;color:#cfd9ec;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:7px;}
.card-body{padding:12px}

.tree-toolbar{display:flex;gap:9px;margin-bottom:10px;font-size:11px;color:#8b98ad;font-weight:700;justify-content:center;flex-wrap:wrap;}
.tree-toolbar span{display:inline-flex;align-items:center;gap:4px}
.tree-toolbar i{width:9px;height:9px;border-radius:3px;display:inline-block}
.tree-viewport{
  position:relative;overflow:hidden;
  height:calc(100vh - var(--nav-h) - 240px);min-height:440px;border-radius:20px;
  background:
    radial-gradient(900px 600px at 50% 0%,rgba(80,140,255,.10),transparent 70%),
    linear-gradient(rgba(120,160,220,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,160,220,.045) 1px,transparent 1px),
    rgba(0,0,0,.42);
  background-size: 100% 100%, 32px 32px, 32px 32px, 100% 100%;
  border:1px solid rgba(120,160,220,.14);cursor:grab;user-select:none;touch-action:none;
  box-shadow:inset 0 0 60px -20px rgba(80,140,255,.25);
}
.tree-viewport.grabbing{cursor:grabbing}
.tree-canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
.tree-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tree-ctrl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;z-index:5;}
.tree-ctrl button{
  width:40px;height:40px;border-radius:12px;background:rgba(20,28,52,.92);
  border:1px solid rgba(120,160,255,.32);color:#fff;font-size:18px;font-weight:900;
  cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);transition:.15s;
  font-family:inherit;box-shadow:0 6px 20px -8px #000;line-height:1;
}
.tree-ctrl button:hover{background:rgba(60,100,200,.95);border-color:rgba(150,190,255,.6)}
.tree-ctrl button:active{transform:scale(.92)}
.tree-ctrl button.zoom-lvl{font-size:10px;font-weight:900;color:#9fc4ff;letter-spacing:0;}
.tree-hint{position:absolute;left:14px;bottom:14px;font-size:10.5px;color:#7c89a5;letter-spacing:.03em;background:rgba(10,16,32,.75);border:1px solid rgba(255,255,255,.06);padding:6px 11px;border-radius:9px;backdrop-filter:blur(8px);pointer-events:none;line-height:1.5;}

/* ═══ 升级档位切换器 ═══ */
.buy-mode-bar{
  display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;
  padding:9px 12px;margin-bottom:12px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);
}
.bm-label{font-size:12px;font-weight:900;color:#cfd9ec;letter-spacing:.06em;white-space:nowrap}
.bm-seg{display:inline-flex;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:3px;gap:3px}
.bm-opt{
  font-family:inherit;font-weight:900;font-size:13px;letter-spacing:0;
  padding:7px 18px;border:none;border-radius:9px;cursor:pointer;
  color:#aebdde;background:transparent;transition:.16s;white-space:nowrap;
}
.bm-opt:hover{color:#fff;background:rgba(255,255,255,.08)}
.bm-opt.on{
  color:#080b14;background:linear-gradient(180deg,#5aa0ff,#2e6fd6);
  box-shadow:0 5px 16px -6px #3f7bff,inset 0 1px 0 rgba(255,255,255,.35);
}
.bm-hint{font-size:11px;color:#7c89a5;font-weight:700;letter-spacing:.02em;min-width:120px;text-align:left}
@media(max-width:640px){.bm-hint{display:none}.bm-opt{padding:7px 14px}}
@media(max-width:640px){.tree-hint{display:none}}

.tnode{
  position:absolute;border-radius:14px;
  background:linear-gradient(160deg,rgba(38,54,92,.95),rgba(14,22,44,.95));
  border:1.5px solid rgba(120,150,210,.24);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:4px 3px;cursor:pointer;
  transition:transform .15s,border-color .2s,box-shadow .2s,background .2s;
  text-align:center;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.8);font-family:inherit;
}
.tnode:hover{transform:translateY(-2px);border-color:rgba(140,190,255,.6);box-shadow:0 10px 22px -8px rgba(80,140,255,.5);}
.tnode .tn-emoji{line-height:1}
.tnode .tn-name{font-weight:900;color:#d3dcf0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.tnode .tn-foot{font-weight:800;color:#8494b3;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;}
.tnode.locked{opacity:.34;filter:grayscale(.9);cursor:not-allowed}
.tnode.locked:hover{transform:none;border-color:rgba(120,150,210,.24);box-shadow:0 6px 16px -6px rgba(0,0,0,.8)}
.tnode.avail{border-color:rgba(90,170,255,.85);background:linear-gradient(160deg,rgba(50,90,180,.35),rgba(20,40,90,.9));box-shadow:0 6px 18px -4px rgba(63,123,255,.6),inset 0 0 22px -14px #3f7bff;}
.tnode.avail .tn-name{color:#b9d8ff}
.tnode.avail .tn-foot{color:#7fb4ff}
.tnode.owned{border-color:rgba(90,230,160,.7);background:linear-gradient(160deg,rgba(30,110,80,.5),rgba(14,40,30,.9));box-shadow:0 6px 18px -4px rgba(90,230,160,.45);}
.tnode.owned .tn-name{color:#9ff3ce}
.tnode.owned .tn-foot{color:#4dd8a0}
.tnode.maxed{border-color:rgba(255,210,80,.9);background:linear-gradient(160deg,rgba(150,110,25,.55),rgba(50,35,10,.9));box-shadow:0 6px 22px -4px rgba(255,200,60,.65),inset 0 0 22px -12px #ffc93c;}
.tnode.maxed .tn-name{color:#ffd86b}
.tnode.maxed .tn-foot{color:#ffc93c}
.tnode.pity-node.avail{border-color:rgba(255,140,140,.9);background:linear-gradient(160deg,rgba(160,50,60,.4),rgba(50,15,20,.9));box-shadow:0 6px 18px -4px rgba(255,95,95,.55);}
.tnode.pity-node.owned{border-color:rgba(255,180,90,.85);background:linear-gradient(160deg,rgba(160,100,30,.5),rgba(60,35,10,.9));}
.tnode.pity-node.maxed{border-color:rgba(255,225,110,.95);background:linear-gradient(160deg,rgba(180,140,30,.55),rgba(60,45,10,.9));box-shadow:0 6px 22px -4px rgba(255,220,90,.7);}

/* ═══ 永久树节点样式 ═══ */
.tnode.perma-node{border-color:rgba(255,200,60,.55);background:linear-gradient(160deg,rgba(120,90,20,.5),rgba(40,28,8,.9));}
.tnode.perma-node.maxed{border-color:rgba(255,225,110,.95);box-shadow:0 6px 24px -4px rgba(255,215,60,.75),inset 0 0 22px -12px #ffc93c;}
.tnode.perma-node .tn-name{color:#ffe9a8;}
.tnode.perma-node.avail{border-color:rgba(255,210,90,.9);background:linear-gradient(160deg,rgba(140,105,25,.5),rgba(50,35,10,.9));box-shadow:0 6px 20px -4px rgba(255,190,60,.6);}
.tnode.perma-node.owned{border-color:rgba(255,220,110,.8);background:linear-gradient(160deg,rgba(150,115,30,.55),rgba(55,40,12,.9));}

/* ═══ 二阶永久节点样式 ═══ */
.tnode.perma2-node{border-color:rgba(200,90,255,.65);background:linear-gradient(160deg,rgba(100,30,150,.55),rgba(35,10,55,.9));}
.tnode.perma2-node.maxed{border-color:rgba(230,140,255,.95);box-shadow:0 6px 24px -4px rgba(200,80,255,.75),inset 0 0 22px -12px #c85aff;}
.tnode.perma2-node .tn-name{color:#e8c8ff;}
.tnode.perma2-node.avail{border-color:rgba(200,110,255,.9);background:linear-gradient(160deg,rgba(120,45,160,.5),rgba(45,15,65,.9));box-shadow:0 6px 20px -4px rgba(200,90,255,.6);}
.tnode.perma2-node.owned{border-color:rgba(210,130,255,.8);background:linear-gradient(160deg,rgba(130,55,170,.55),rgba(50,20,70,.9));}

#nodeTip{
  position:fixed;z-index:180;pointer-events:none;
  max-width:280px;min-width:200px;
  background:linear-gradient(165deg,rgba(24,34,64,.98),rgba(10,16,34,.98));
  border:1px solid rgba(120,170,255,.45);
  border-radius:14px;padding:13px 15px;
  box-shadow:0 20px 50px -18px #000,0 0 30px -10px rgba(80,140,255,.4);
  opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
}
#nodeTip.on{opacity:1;transform:translateY(0)}
#nodeTip .nt-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
#nodeTip .nt-emoji{font-size:20px;line-height:1}
#nodeTip .nt-name{font-size:14px;font-weight:900;color:#fff;letter-spacing:.03em;}
#nodeTip .nt-lv{font-size:11px;font-weight:900;padding:2px 8px;border-radius:7px;background:rgba(90,140,255,.28);color:#9fc4ff;margin-left:auto;}
#nodeTip .nt-lv.max{background:rgba(255,200,60,.28);color:#ffd86b}
#nodeTip .nt-desc{font-size:11.5px;color:#9aa8c4;line-height:1.55;margin-bottom:8px;}
#nodeTip .nt-row{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin-top:5px;}
#nodeTip .nt-row .lb{color:#7c89a5;font-size:11px;}
#nodeTip .nt-row .vl{color:#ffd86b;font-variant-numeric:tabular-nums;}
#nodeTip .nt-row .vl.red{color:#ff8a8a}
#nodeTip .nt-row .vl.green{color:#8ff0c4}
#nodeTip .nt-hint{font-size:10.5px;color:#5a6580;margin-top:9px;border-top:1px dashed rgba(255,255,255,.08);padding-top:7px;letter-spacing:.02em;}

.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;max-width:720px;margin-left:auto;margin-right:auto;}
.subtab{flex:1;padding:10px 8px;border-radius:11px;text-align:center;font-size:12px;font-weight:900;letter-spacing:.02em;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#8b98ad;cursor:pointer;transition:.2s;min-width:62px;}
.subtab.on{background:linear-gradient(180deg,#3f7bff,#1d3fd0);color:#fff;border-color:transparent}
.subtab:active{transform:scale(.96)}

.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:1100px;margin:0 auto;}
.shop-item{border-radius:14px;padding:13px 11px;background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.09);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
.shop-item .si-emoji{font-size:26px;line-height:1}
.shop-item .si-name{font-size:12px;font-weight:900;color:#d7e0f2}
.shop-item .si-desc{font-size:10px;color:#7c89a5;line-height:1.45;min-height:30px}
.shop-item .si-price{font-size:11.5px;font-weight:900;padding:8px 10px;border-radius:9px;width:100%;background:rgba(255,255,255,.06);color:#c8d4ea;cursor:pointer;border:none;font-family:inherit;transition:.15s;}
.shop-item .si-price:active{transform:scale(.96)}
.shop-item .si-price.can-gold{background:linear-gradient(180deg,#ffb020,#b87200);color:#241700}
.shop-item .si-price.can-gem{background:linear-gradient(180deg,#2ee6ff,#008eae);color:#041820}
.shop-item .si-price.can-pack{background:linear-gradient(180deg,#ff4fb5,#8a0d5c);color:#fff}
.shop-item .si-price:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed}

.merchant{border-radius:14px;background:linear-gradient(165deg,rgba(120,80,255,.12),rgba(80,200,255,.05));border:1px solid rgba(150,120,255,.3);padding:13px;margin-bottom:14px;font-size:12px;color:#c5b8ff;line-height:1.55;display:flex;align-items:center;gap:11px;max-width:1100px;margin-left:auto;margin-right:auto;}
.merchant .m-emoji{font-size:30px;flex:none}

.equip-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.equip-slot{
  border-radius:13px;padding:10px 6px;text-align:center;
  background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;
  min-height:78px;transition:.2s;
}
.equip-slot.filled{
  background:linear-gradient(165deg,color-mix(in srgb, var(--qc) 18%, transparent),rgba(255,255,255,.02));
  border-color:var(--qc);
  cursor:pointer;
  box-shadow:0 0 20px -8px var(--qc);
}
@supports not (background: color-mix(in srgb, red 10%, transparent)){
  .equip-slot.filled{background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-color:rgba(255,255,255,.3)}
}
.equip-slot.empty{
  border-style:dashed;color:#5a6580;font-size:11px;font-weight:700;
}
.equip-slot .es-emoji{font-size:26px;line-height:1}
.equip-slot .es-info{font-size:10.5px;font-weight:900;color:#d7e0f2;font-variant-numeric:tabular-nums;text-align:center}
.equip-slot .es-mult{font-size:9.5px;color:#8ff0c4;font-weight:800}

.pet-draw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;margin:0 auto;}
.pet-draw-btn{
  border-radius:15px;padding:16px 12px;border:none;cursor:pointer;
  font-family:inherit;color:#fff;
  background:linear-gradient(165deg,#3f7bff,#1d3fd0);
  border:1px solid rgba(150,190,255,.35);
  box-shadow:0 12px 30px -12px #3f7bff;
  transition:.15s;text-align:center;
}
.pet-draw-btn.big{
  background:linear-gradient(165deg,#ff4fb5,#8a0d5c);
  box-shadow:0 12px 30px -12px #ff4fb5;
  border-color:rgba(255,140,200,.5);
}
.pet-draw-btn:hover{filter:brightness(1.1)}
.pet-draw-btn:active{transform:scale(.96)}
.pet-draw-btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed;box-shadow:none}
.pet-draw-btn .pdb-emoji{font-size:28px;line-height:1;margin-bottom:5px}
.pet-draw-btn .pdb-name{font-size:13px;font-weight:900;letter-spacing:.04em}
.pet-draw-btn .pdb-cost{font-size:11.5px;margin-top:4px;opacity:.85;font-weight:800}
.pet-draw-btn .pdb-cost b{color:#ffd86b}

.pet-bag-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;
}
.pet-card-v2{
  border-radius:14px;padding:11px 8px;
  background:linear-gradient(165deg,color-mix(in srgb, var(--qc) 15%, transparent),rgba(255,255,255,.012));
  border:1.5px solid color-mix(in srgb, var(--qc) 45%, transparent);
  display:flex;flex-direction:column;gap:5px;align-items:center;
  text-align:center;transition:.18s;cursor:pointer;
  position:relative;
}
@supports not (background: color-mix(in srgb, red 10%, transparent)){
  .pet-card-v2{background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.012));border-color:rgba(255,255,255,.2)}
}
.pet-card-v2:hover{transform:translateY(-2px)}
.pet-card-v2.equipped{
  box-shadow:0 0 22px -6px #ffc93c,inset 0 0 22px -14px #ffc93c;
  border-color:rgba(255,200,60,.8);
}
.pet-card-v2.dim{opacity:.35;filter:grayscale(.6);cursor:not-allowed}
.pet-card-v2 .pcv-emoji{font-size:30px;line-height:1}
.pet-card-v2 .pcv-quality{
  font-size:10px;font-weight:900;letter-spacing:.06em;
  padding:2px 8px;border-radius:7px;
  background:var(--qc);color:#080b14;
}
.pet-card-v2 .pcv-quality .lv{color:#e6f0ff;background:rgba(0,0,0,.25);padding:0 4px;border-radius:4px;margin-left:2px}
.pet-card-v2 .pcv-star{
  font-size:11px;color:#ffd86b;font-weight:900;letter-spacing:2px;
  text-shadow:0 0 8px rgba(255,200,60,.5);
  line-height:1;
}
.pet-card-v2 .pcv-mult{
  font-size:10.5px;color:#8ff0c4;font-weight:900;
  font-variant-numeric:tabular-nums;
}
.pet-card-v2 .pcv-badge{
  position:absolute;top:-6px;right:-6px;
  font-size:9px;font-weight:900;
  padding:3px 7px;border-radius:8px;
  background:linear-gradient(180deg,#ff5f5f,#b81c1c);
  color:#fff;border:1.5px solid rgba(255,255,255,.35);
  box-shadow:0 4px 12px -3px #ff5f5f;
}
.pet-card-v2 .pcv-sel{
  position:absolute;top:5px;left:5px;
  width:20px;height:20px;border-radius:6px;
  background:rgba(255,255,255,.15);
  border:1.5px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:#fff;
}
.pet-card-v2.selected .pcv-sel{
  background:linear-gradient(180deg,#22c98a,#0d8557);
  border-color:transparent;
}
.pet-card-v2 .pcv-name{font-size:11px;font-weight:900;color:#d7e0f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pet-card-v2.shiny{box-shadow:0 0 26px -6px #ffd86b,inset 0 0 22px -12px #ffd86b;border-color:rgba(255,220,120,.9) !important}
.pet-card-v2 .pcv-equip{
  width:100%;margin-top:2px;padding:4px 0;border-radius:7px;border:none;
  font-family:inherit;font-size:10px;font-weight:900;letter-spacing:.03em;
  cursor:pointer;transition:.15s;
  background:linear-gradient(180deg,#3f7bff,#1d3fd0);color:#fff;
}
.pet-card-v2 .pcv-equip.on{background:linear-gradient(180deg,#ffb020,#d18a00);color:#241700}
.pet-card-v2 .pcv-equip:active{transform:scale(.94)}
.pet-card-v2 .pcv-equip:disabled{filter:grayscale(.75) brightness(.6);cursor:not-allowed}

/* ═══ 🌈 炫彩宠物 ═══ */
.pet-card-v2 .pcv-badge.sh{background:linear-gradient(180deg,#ffd86b,#c98a00);color:#241700;border-color:rgba(255,255,255,.5)}
.pet-card-v2 .pcv-badge.rb{
  background:linear-gradient(120deg,#ff0080,#ff8c00,#ffee00,#00ff88,#00d4ff,#8b3dff,#ff0080);
  background-size:300% 100%;
  color:#fff;border-color:rgba(255,255,255,.7);
  animation:rbFlow 2.5s linear infinite;
  text-shadow:0 0 8px rgba(0,0,0,.55);
}
@keyframes rbFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes rbHue{to{filter:hue-rotate(360deg)}}
@keyframes rbPulse{
  0%,100%{box-shadow:0 0 22px -6px rgba(255,0,200,.7),inset 0 0 24px -14px rgba(0,255,200,.6)}
  50%{box-shadow:0 0 32px -4px rgba(0,200,255,.85),inset 0 0 26px -12px rgba(255,220,0,.6)}
}
.pet-card-v2.rainbow{
  border:2px solid transparent !important;
  background:
    linear-gradient(165deg,rgba(18,24,46,.94),rgba(8,12,26,.96)) padding-box,
    linear-gradient(120deg,#ff0080,#ff8c00,#ffee00,#00ff88,#00d4ff,#8b3dff,#ff0080) border-box;
  background-size:100% 100%,300% 100%;
  animation:rbFlow 4s linear infinite, rbPulse 2.4s ease-in-out infinite;
}
.pet-card-v2.rainbow .pcv-quality{animation:rbHue 3.5s linear infinite}
.pet-card-v2.rainbow .pcv-name{color:#fff;text-shadow:0 0 10px rgba(255,120,255,.85)}
.pet-card-v2.rainbow .pcv-mult{color:#ffd86b;text-shadow:0 0 10px rgba(255,200,60,.6)}
.pet-card-v2.rainbow.equipped{box-shadow:0 0 34px -4px rgba(255,0,200,.8) !important}
.equip-slot.filled.rb{border-color:transparent;background:
  linear-gradient(165deg,rgba(18,24,46,.94),rgba(8,12,26,.96)) padding-box,
  linear-gradient(120deg,#ff0080,#ff8c00,#ffee00,#00ff88,#00d4ff,#8b3dff,#ff0080) border-box;
  border:2px solid transparent;animation:rbFlow 4s linear infinite,rbPulse 2.4s ease-in-out infinite;}

.bag-toolbar{
  display:flex;gap:8px;align-items:center;justify-content:center;
  margin-top:12px;padding:11px;border-radius:13px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.06);
  font-size:12px;font-weight:800;color:#c8d4ea;
}
.bag-toolbar .bt-info{flex:1;text-align:center}
.bag-toolbar .bt-info b{color:#ffd86b;font-variant-numeric:tabular-nums}
.bag-toolbar .bt-btn{
  padding:9px 15px;border-radius:10px;border:none;
  font-family:inherit;font-size:12px;font-weight:900;
  cursor:pointer;transition:.15s;
  background:linear-gradient(180deg,#22c98a,#0d8557);color:#03150e;
}
.bag-toolbar .bt-btn:active{transform:scale(.95)}
.bag-toolbar .bt-btn:disabled{filter:grayscale(.8) brightness(.55);cursor:not-allowed}

.quality-card{
  display:flex;align-items:center;gap:11px;
  padding:11px;border-radius:14px;
  background:linear-gradient(165deg,color-mix(in srgb, var(--qc) 12%, transparent),rgba(255,255,255,.012));
  border:1px solid color-mix(in srgb, var(--qc) 30%, transparent);
  margin-bottom:8px;
}
@supports not (background: color-mix(in srgb, red 10%, transparent)){
  .quality-card{background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border-color:rgba(255,255,255,.1)}
}
.quality-card .qc-badge{
  width:52px;height:52px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;
  background:var(--qc);color:#080b14;
  flex:none;
}
.quality-card .qc-info{flex:1;min-width:0}
.quality-card .qc-name{font-size:14px;font-weight:900;color:#fff}
.quality-card .qc-desc{font-size:11.5px;color:#9aa8c4;margin-top:3px;line-height:1.5}
.quality-card .qc-mult{font-size:14px;font-weight:900;color:#8ff0c4;font-variant-numeric:tabular-nums}

.star-card{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-radius:13px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);

.star-card .sc-badge{
  width:52px;height:52px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#ffd86b;font-weight:900;
  background:linear-gradient(165deg,rgba(255,200,60,.28),rgba(255,200,60,.08));
  border:1px solid rgba(255,200,60,.4);
  flex:none;text-shadow:0 0 10px rgba(255,200,60,.5);
}
.star-card .sc-info{flex:1;min-width:0}
.star-card .sc-name{font-size:14px;font-weight:900;color:#fff}
.star-card .sc-desc{font-size:11.5px;color:#9aa8c4;margin-top:3px;line-height:1.5}
.star-card .sc-mult{font-size:14px;font-weight:900;color:#ffd86b;font-variant-numeric:tabular-nums}

.ev-hero{
  border-radius:22px;padding:24px 20px;text-align:center;margin-bottom:14px;
  background:
    radial-gradient(500px 260px at 50% 0%,var(--evc-soft,rgba(255,201,60,.16)),transparent 70%),
    linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.012)),#0d1425;
  border:1px solid var(--evc-border,rgba(255,201,60,.28));
  transition:.4s;
}
.ev-hero .evh-emoji{font-size:56px;line-height:1;margin-bottom:11px;filter:drop-shadow(0 0 20px var(--evc,#ffc93c))}
.ev-hero .evh-name{
  font-size:19px;font-weight:900;letter-spacing:.08em;color:var(--evc,#ffc93c);
  text-shadow:0 0 24px var(--evc,#ffc93c);
}
.ev-hero .evh-desc{font-size:12.5px;color:#c8d4ea;margin-top:8px;line-height:1.7}
.ev-hero .evh-timer{
  font-size:28px;font-weight:900;margin:14px 0 6px;
  color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:0 0 20px rgba(255,255,255,.4);
}
.ev-hero .evh-timer-lb{font-size:11px;color:#8b98ad;letter-spacing:.1em;font-weight:800}

.ev-list-item{
  display:flex;align-items:center;gap:11px;
  padding:11px;border-radius:13px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:8px;
}
.ev-list-item.current{
  background:linear-gradient(165deg,color-mix(in srgb, var(--evc) 12%, transparent),rgba(255,255,255,.012));
  border-color:color-mix(in srgb, var(--evc) 40%, transparent);
}
@supports not (background: color-mix(in srgb, red 10%, transparent)){
  .ev-list-item.current{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
}
.ev-list-item .evl-emoji{font-size:22px;flex:none;width:32px;text-align:center}
.ev-list-item .evl-info{flex:1;min-width:0}
.ev-list-item .evl-name{font-size:13px;font-weight:900;color:#e2e9f8}
.ev-list-item .evl-desc{font-size:11px;color:#8b98ad;margin-top:2px}
.ev-list-item .evl-badge{
  font-size:10.5px;font-weight:900;padding:4px 9px;border-radius:8px;
  background:rgba(255,255,255,.08);color:#cfd9ec;
}
.ev-list-item.current .evl-badge{
  background:var(--evc);color:#080b14;
}

.set-wrap{max-width:680px;margin:0 auto}
.set-info{font-size:12.5px;color:#9aa8c4;line-height:1.75;margin-bottom:12px;}
.set-info b{color:#ffd86b;}
.set-btns{display:flex;gap:9px;flex-wrap:wrap;}
.set-btn{
  flex:1;min-width:130px;padding:13px 16px;border-radius:12px;border:none;
  font-family:inherit;font-size:12.5px;font-weight:900;letter-spacing:.04em;
  cursor:pointer;transition:.15s;background:rgba(255,255,255,.07);color:#c8d4ea;
}
.set-btn:hover{background:rgba(255,255,255,.13);}
.set-btn:active{transform:scale(.97);}
.set-btn.primary{background:linear-gradient(180deg,#3f7bff,#1d3fd0);color:#fff;}
.set-btn.primary:hover{background:linear-gradient(180deg,#5a90ff,#2a4fe0);}
.set-btn.danger{background:linear-gradient(180deg,#ff5f5f,#b81c1c);color:#fff;}
.set-btn.danger:hover{background:linear-gradient(180deg,#ff7070,#d03030);}

.set-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.set-stat{padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);text-align:center;}
.set-stat .ss-lb{font-size:10px;color:#7c89a5;letter-spacing:.05em;font-weight:800;}
.set-stat .ss-vl{font-size:14px;font-weight:900;color:#ffd86b;margin-top:3px;font-variant-numeric:tabular-nums;}

.set-toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:10px;}
.set-toggle .st-lb{font-size:13px;font-weight:900;color:#e2e9f8;}
.set-toggle .st-sw{width:48px;height:26px;border-radius:99px;position:relative;cursor:pointer;background:rgba(255,255,255,.1);transition:.2s;}
.set-toggle .st-sw.on{background:linear-gradient(90deg,#22c98a,#0d8557);}
.set-toggle .st-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}
.set-toggle .st-sw.on::after{transform:translateX(22px);}
.set-toggle .st-lb{display:flex;flex-direction:column;gap:2px;line-height:1.35}
.set-toggle .st-sub{font-size:10.5px;font-weight:700;color:#7c89a5;letter-spacing:.01em}
.set-input{
  width:100%;padding:12px 14px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:#fff;font-size:14px;font-family:inherit;letter-spacing:.1em;
  outline:none;transition:.2s;text-align:center;text-transform:uppercase;
}
.set-input:focus{border-color:rgba(120,170,255,.7);background:rgba(255,255,255,.09)}
.set-input::placeholder{color:#5a6580;text-transform:none;letter-spacing:.05em}

/* 💾 后台按钮 */
.side-btn.dev{
  background:linear-gradient(165deg,rgba(255,200,60,.18),rgba(255,200,60,.04));
  border-color:rgba(255,200,60,.4);
}
.side-btn.dev span{filter:none;}
.side-btn.dev small{color:#ffd86b;}
.side-btn.dev.on{
  background:linear-gradient(165deg,rgba(255,200,60,.32),rgba(255,200,60,.08));
  border-color:rgba(255,200,60,.7);
  box-shadow:0 0 22px -6px rgba(255,200,60,.6);
}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);z-index:100;display:flex;background:rgba(10,15,30,.94);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -10px 30px -16px #000;padding:0 6px;overflow-x:auto;justify-content:center;}
.bottom-nav::-webkit-scrollbar{display:none}
.nav-btn{flex:0 1 140px;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#66748f;font-size:10.5px;font-weight:900;letter-spacing:.04em;transition:.18s;position:relative;padding:0 4px;}
.nav-btn .nb-emoji{font-size:19px;line-height:1;transition:.18s;filter:grayscale(.5) opacity(.7)}
.nav-btn.on{color:#fff}
.nav-btn.on .nb-emoji{filter:none;transform:scale(1.12)}
.nav-btn.on::after{content:'';position:absolute;top:5px;width:24px;height:3px;border-radius:99px;background:linear-gradient(90deg,#4b8bff,#a45cff);box-shadow:0 0 10px #4b8bff;}
.nav-btn:active{transform:scale(.94)}
@media(min-width:900px){
  .bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(680px,92vw);border-radius:22px 22px 0 0;border:1px solid rgba(255,255,255,.08);border-bottom:none;padding:0 24px;}
}
@media(min-width:900px){
  .roll-area{flex-direction:row;justify-content:center;align-items:center;gap:64px;padding:40px 20px}
  .display{width:360px;height:368px}
  .roll-side{max-width:360px;align-items:stretch}
  .roll-side .dice-hint{text-align:center}
  .hist{justify-content:center}
}

.app.shaking{animation:shk .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{0%{transform:translate(0,0)}15%{transform:translate(calc(var(--amp) * -1),calc(var(--amp) * .6))}30%{transform:translate(var(--amp),calc(var(--amp) * -.5))}45%{transform:translate(calc(var(--amp) * -.7),calc(var(--amp) * -.4))}60%{transform:translate(calc(var(--amp) * .6),var(--amp))}80%{transform:translate(calc(var(--amp) * -.3),0)}100%{transform:translate(0,0)}}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%) translateY(20px);background:rgba(20,28,52,.96);border:1px solid rgba(120,160,255,.35);color:#fff;font-size:13px;font-weight:800;padding:11px 20px;border-radius:13px;opacity:0;pointer-events:none;transition:.28s;z-index:150;box-shadow:0 14px 40px -14px #000;max-width:86vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ach{background:linear-gradient(165deg,rgba(60,45,10,.98),rgba(30,20,5,.98));border-color:rgba(255,200,60,.6);color:#ffd86b;box-shadow:0 14px 40px -14px #000,0 0 30px -10px rgba(255,200,60,.5);}
#toast.event{background:linear-gradient(165deg,rgba(30,10,60,.98),rgba(15,5,30,.98));border-color:rgba(200,100,255,.6);color:#ffb8ff;box-shadow:0 14px 40px -14px #000,0 0 30px -10px rgba(200,100,255,.5);}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(4,7,16,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.24s;padding:20px;}
.overlay.on{opacity:1;pointer-events:auto}
.overlay-box{width:min(94vw,340px);background:linear-gradient(165deg,#141d38,#0a1024);border:1px solid rgba(120,160,255,.32);border-radius:22px;padding:22px 18px 18px;box-shadow:0 26px 70px -22px #000;text-align:center;transform:scale(.92);transition:.24s;}
.overlay.on .overlay-box{transform:scale(1)}
.ov-emoji{font-size:34px;line-height:1;margin-bottom:8px}
.ov-title{font-size:16px;font-weight:900;letter-spacing:.05em;margin-bottom:6px}
.ov-desc{font-size:11.5px;color:#8b98ad;margin-bottom:14px;line-height:1.5;min-height:17px;white-space:pre-line}
.ov-input{width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:14px;font-family:inherit;letter-spacing:.1em;outline:none;transition:.2s;text-align:center;}
.ov-input:focus{border-color:rgba(120,170,255,.7);background:rgba(255,255,255,.09)}
.ov-btns{display:flex;gap:9px;margin-top:14px}
.ov-btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:inherit;font-size:13px;font-weight:900;letter-spacing:.05em;cursor:pointer;transition:.15s;}

.vip-node .vn-emoji{font-size:26px;line-height:1;opacity:.55;filter:grayscale(.4)}
.vip-node .vn-name{font-size:12px;font-weight:900;color:#c8b88a;letter-spacing:.03em}
.vip-node .vn-lock{font-size:10px;color:#7a6a4a;font-weight:800;letter-spacing:.05em;margin-top:2px}
.vip-node .vn-placeholder{position:absolute;top:8px;right:8px;font-size:9px;font-weight:900;padding:2px 6px;border-radius:5px;background:rgba(255,200,60,.18);color:#ffd86b;letter-spacing:.05em}
.vip-node.center{grid-column:2;grid-row:2;background:linear-gradient(165deg,rgba(80,60,20,.9),rgba(40,28,10,.95));border:1.5px solid rgba(255,200,60,.75);box-shadow:0 0 30px -8px rgba(255,200,60,.5);cursor:default}
.vip-node.center .vn-emoji{opacity:1;filter:none}
.vip-node.center .vn-name{color:#ffd86b}
.vip-note{max-width:760px;margin:0 auto;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.3);border:1px dashed rgba(255,255,255,.1);font-size:11.5px;color:#8b98ad;line-height:1.7;text-align:center}

.svip-extras{
  display:flex;flex-direction:column;gap:5px;width:100%;max-width:320px;margin-top:8px;
}
.svip-extra-item{
  display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;
  background:linear-gradient(165deg,rgba(255,107,255,.14),rgba(255,107,255,.03));
  border:1px solid rgba(255,107,255,.4);
  font-size:11.5px;font-weight:800;
  animation:svipExtraPop .35s ease-out;
}
@keyframes svipExtraPop{
  0%{opacity:0;transform:translateY(6px) scale(.92)}
  100%{opacity:1;transform:none}
}
.svip-extra-item .sei-badge{
  font-size:10px;padding:2px 6px;border-radius:5px;font-weight:900;
  background:var(--c,#8b98ad);color:#080b14;flex:none;
}
.svip-extra-item .sei-name{
  flex:1;min-width:0;color:var(--c,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.svip-extra-item .sei-gain{
  color:#ffd86b;font-variant-numeric:tabular-nums;flex:none;font-size:10.5px;
}

function getSpecies(id){ return PET_SPECIES.find(s => s.id === id) || PET_SPECIES[0]; }
function getQuality(id){ return PET_QUALITIES.find(q => q.id === id) || PET_QUALITIES[0]; }
function getStarInfo(star){ return PET_STARS[Math.max(0, Math.min(PET_STARS.length - 1, star - 1))]; }
function getRarity(id){ return RARITIES.find(r => r.id === id) || RARITIES[0]; }

function petTier(p){
  if(!p) return 0;
  if(p.rainbow) return 2;
  if(p.shiny)   return 1;
  return 0;
}
function petPrefix(p){
  if(p && p.richPup) return '💰';
  const t = petTier(p);
  return t === 2 ? '🌈' : (t === 1 ? '✨' : '');
}
function petVisualClass(p){
  const t = petTier(p);
  return t === 2 ? ' rainbow' : (t === 1 ? ' shiny' : '');
}
function petBadgeHTML(p){
  if(p && p.richPup) return '<div class="pcv-badge sh" style="background:linear-gradient(180deg,#ffd86b,#c98a00)">💰</div>';
  const t = petTier(p);
  if(t === 2) return '<div class="pcv-badge rb">🌈</div>';
  if(t === 1) return '<div class="pcv-badge sh">✨</div>';
  return '';
}
function petTierMul(p){
  const t = petTier(p);
  return t === 2 ? PET_RAINBOW_TRAIT : (t === 1 ? PET_SHINY_TRAIT : 1);
}

function petMult(pet){
  if(!pet) return 1;
  const q = getQuality(pet.quality);
  const st = getStarInfo(pet.star);
  let m = q.mult * st.mult;
  const t = petTier(pet);
  if(t === 2)      m *= PET_RAINBOW_MULT;
  else if(t === 1) m *= PET_SHINY_MULT;
  return m;
}

function getPetTraits(){
  const total = { coin:0, gem:0, luck:0, affix:0, speed:0 };
  for(const uid of state.petEquipped){
    const p = state.petInv.find(x => x.uid === uid);
    if(!p) continue;
    const sp = getSpecies(p.species);
    const starMul = 1 + (p.star - 1) * 0.5;
    const formMul = petTierMul(p);
    for(const tr of sp.traits){
      total[tr.t] = (total[tr.t] || 0) + tr.v * starMul * formMul;
    }
    if(p.richPup) total.coin += 0.001;
  }
  return total;
}

function genPet(qualityId, speciesId){
  const sp = getSpecies(speciesId);
  return {
    uid: 'pet_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    species: sp.id,
    quality: qualityId,
    star: sp.minStar,
    exp: 0,
    shiny: false,
    rainbow: false,
    richPup: false
  };
}
function rollSpecies(){
  return pickFrom(PET_SPECIES.map(s => ({ ref:s.id, w:s.w }))).ref;
}

function petExpNeed(qualityId){
  const idx = PET_QUALITIES.findIndex(q => q.id === qualityId);
  if(idx < 0 || idx >= PET_QUALITIES.length - 1) return Infinity;
  return Math.floor(100 * Math.pow(3, idx));
}

function petAbsorbExp(absorber, absorbed){
  if(absorber.richPup || absorbed.richPup) return 0;
  if(!absorber || !absorbed) return 0;
  if(absorber.uid === absorbed.uid) return 0;
  if(absorber.star !== absorbed.star) return 0;
  if(petTier(absorber) !== petTier(absorbed)) return 0;
  const ai = PET_QUALITIES.findIndex(q => q.id === absorber.quality);
  const bi = PET_QUALITIES.findIndex(q => q.id === absorbed.quality);
  if(ai < 0 || bi < 0) return 0;
  if(bi > ai) return 0;
  const ratio = (bi + 1) / (ai + 1);
  return Math.max(1, Math.floor(30 * (bi + 1) * ratio * ratio));
}

function autoSelectLevelup(){
  const target = state.petLevelupTarget ? state.petInv.find(p => p.uid === state.petLevelupTarget) : null;
  if(!target) return 0;
  if(target.richPup) return 0;                     // ← 新增：主宠物是富贵小狗直接返回

  const ti = PET_QUALITIES.findIndex(q => q.id === target.quality);
  const tt = petTier(target);
  const mats = state.petInv.filter(p =>
    p.uid !== target.uid &&
    !p.richPup &&                                  // ← 新增：排除富贵小狗
    p.star === target.star &&
    petTier(p) === tt &&
    PET_QUALITIES.findIndex(q => q.id === p.quality) <= ti
  );
  if(!mats.length) return 0;

  mats.sort((a, b) =>
    PET_QUALITIES.findIndex(q => q.id === b.quality) -
    PET_QUALITIES.findIndex(q => q.id === a.quality)
  );
  state.petLevelupMaterials = mats.map(m => m.uid);
  return mats.length;
}

function absorbPets(){
  if(target.richPup){ toast('💰「有钱人养的」小狗不能进阶'); return; }
  const target = state.petInv.find(p => p.uid === state.petLevelupTarget);
  if(!target){ toast('请先选主宠物'); return; }
  const mats = state.petLevelupMaterials
    .map(uid => state.petInv.find(p => p.uid === uid))
    .filter(Boolean);
  if(!mats.length){ toast('请选择材料宠物'); return; }

  let totalExp = 0;
  for(const m of mats) totalExp += petAbsorbExp(target, m);

  const matUids = mats.map(m => m.uid);
  state.petInv = state.petInv.filter(p => !matUids.includes(p.uid));

  target.exp = (target.exp || 0) + totalExp;
  let upCount = 0;
  while(true){
    const need = petExpNeed(target.quality);
    if(target.exp < need) break;
    const idx = PET_QUALITIES.findIndex(q => q.id === target.quality);
    if(idx < 0 || idx >= PET_QUALITIES.length - 1) break;
    target.exp -= need;
    target.quality = PET_QUALITIES[idx + 1].id;
    upCount++;
  }
  if(target.quality === PET_QUALITIES[PET_QUALITIES.length - 1].id) target.exp = 0;

  state.petLevelupMaterials = [];

  beep(800, .15, 'sine', .06);
  setTimeout(() => beep(1200, .2, 'sine', .06), 100);
  if(upCount) setTimeout(() => beep(1600, .3, 'sine', .055), 220);
  burst('#7dc4ff', 60);
  if(upCount){ burst('#ffd86b', 80); shake(6); }
  toast('⬆️ 吸收完成！获得 ' + totalExp + ' 经验' +
    (upCount ? '，品质提升 ' + upCount + ' 档！' : ''));

  updateHUD();
  renderPetPage();
  updatePetFab();
  checkAchievements();
}

function getShopCoinMult(){
  let v = 1;
  v += treeLv('V1')  * 0.10;
  v += treeLv('V2')  * 0.20;
  v += treeLv('V3')  * 0.35;
  v += treeLv('VG')  * 0.75;
  v += treeLv('VG2') * 1.50;
  v += treeLv('VE')  * 3.00;
  v *= 1 + state.rebirths   * (0.75 + ptreeLv('PR1') * 0.20);
  v *= 1 + state.ascends    * (5    + ptreeLv('PR2') * 0.40);
  v *= 1 + state.transcends * (50   + ptreeLv('PR4') * 0.50);

  const top3 = state.petInv.slice().sort((a, b) => petMult(b) - petMult(a)).slice(0, MAX_PETS);
  for(const p of top3) v *= petMult(p);

  let coinTrait = 0;
  for(const p of top3){
    const sp = getSpecies(p.species);
    const starMul = 1 + (p.star - 1) * 0.5;
    const formMul = petTierMul(p);
    for(const tr of sp.traits){
      if(tr.t === 'coin') coinTrait += tr.v * starMul * formMul;
    }
  }
  v *= (1 + coinTrait);

  v *= getPetPermaMult();
  v += ptree2Lv('P2C1') * 0.50 + ptree2Lv('P2C2') * 1.00;
  v *= getTrueRebirthCoinMult();
  for(const b of state.buffs) if(b.coinMult) v *= b.coinMult;
  const ev = getEvent();
  if(ev.coinMult) v *= ev.coinMult;
  return v;
}

function getShopLuckMult(){
  let v = 1;
  v += treeLv('L1')  * 0.03;
  v += treeLv('L2')  * 0.06;
  v += treeLv('L3')  * 0.12;
  v += treeLv('LC')  * 0.25;
  v += treeLv('LC2') * 0.50;
  v += treeLv('LE')  * 1.00;
  v += state.rebirths   * 0.15;
  v += state.ascends    * 2;
  v += state.transcends * 20;
  v += ptreeLv('PR3')   * 2;
  v += ptree2Lv('P2L1') * 20 + ptree2Lv('P2L2') * 50;
  v += getTrueRebirthLuck();
  for(const b of state.buffs) if(b.luck) v += b.luck;
  const ev = getEvent();
  if(ev.luck) v += ev.luck;

  const top3 = state.petInv.slice().sort((a, b) => petMult(b) - petMult(a)).slice(0, MAX_PETS);
  for(const p of top3){
    const sp = getSpecies(p.species);
    const starMul = 1 + (p.star - 1) * 0.5;
    const formMul = petTierMul(p);
    for(const tr of sp.traits){
      if(tr.t === 'luck') v += tr.v * starMul * formMul;
    }
  }
  return Math.max(1, v);
}

function getShopWealthMult(){
  const coinM = getShopCoinMult();
  const luckM = getShopLuckMult();
  return coinM * Math.pow(luckM, 0.3);
}

function getShopPrice(basePrice){
  const mult = Math.max(1, Math.pow(getShopWealthMult(), 0.4));
  return Math.floor(basePrice * 100 * mult);
}

function getShopGemPrice(gemCost){
  const mult = Math.max(1, Math.pow(getShopWealthMult(), 0.2));
  return Math.ceil(gemCost * mult);
}

function refreshShop(){
  const today = new Date().toDateString();
  if(state.shopDate === today && state.shopSlots && state.shopSlots.length) return;

  const pool = SHOP_POOL.slice();
  const picked = [];
  for(let i = 0; i < 6 && pool.length; i++){
    const total = pool.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * total;
    let idx = 0;
    for(let j = 0; j < pool.length; j++){
      r -= pool[j].weight;
      if(r <= 0){ idx = j; break; }
    }
    picked.push(pool[idx].id);
    pool.splice(idx, 1);
  }
  state.shopDate = today;
  state.shopSlots = picked;
  state.shopBought = {};
  markDirty();
}

function buyShopItem(id){
  const item = SHOP_POOL.find(x => x.id === id);
  if(!item){ toast('❌ 商品不存在'); return; }
  const bought = (state.shopBought && state.shopBought[id]) || 0;
  if(bought >= item.limit){ toast('❌ 今日已售罄'); beep(220, .12, 'square', .04); return; }

  const price = getShopPrice(item.basePrice);
  const gemPrice = getShopGemPrice(item.gemCost || 0);

  if(state.coins < price){ toast('❌ 金币不足，需要 💰' + fmt(price)); beep(200, .12, 'square', .04); return; }
  if(state.gems < gemPrice){ toast('❌ 钻石不足，需要 💎' + fmt(gemPrice)); beep(200, .12, 'square', .04); return; }

  state.coins -= price;
  state.gems -= gemPrice;
  if(!state.shopBought) state.shopBought = {};
  state.shopBought[id] = bought + 1;
  item.apply();

  beep(1000, .12, 'sine', .05);
  updateHUD();
  renderShopPage();
  markDirty();
}

function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 0) return '-' + fmt(-n);
  if(n < 1) return n.toFixed(2);
  if(n < 1000) return Math.floor(n).toLocaleString('en-US');
  let t = 0;
  while(n >= 1000 && t < SUF.length - 1){ n /= 1000; t++; }
  return n.toFixed(2) + SUF[t];
}
function pickFrom(list){
  const total = list.reduce((s,r) => s + r.w, 0);
  let x = Math.random() * total;
  for(const r of list){ x -= r.w; if(x <= 0) return r; }
  return list[list.length - 1];
}
function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    for(const k of Object.keys(d.tree)){
      if(TREE.some(n => n.id === k) && typeof d.tree[k] === 'number'){
        t[k] = Math.max(0, Math.floor(d.tree[k]));
      }
    }
    if(!t.root) t.root = 1;
    state.tree = t;
  }

  if(d.ptree && typeof d.ptree === 'object'){
    const t = {};
    for(const k of Object.keys(d.ptree)){
      if(PERMA_TREE.some(n => n.id === k) && typeof d.ptree[k] === 'number'){
        t[k] = Math.max(0, Math.floor(d.ptree[k]));
      }
    }
    if(!t.PROOT) t.PROOT = 1;
    state.ptree = t;
  }

  if(d.ptree2 && typeof d.ptree2 === 'object'){
    const t = {};
    for(const k of Object.keys(d.ptree2)){
      if(PERMA_TREE_2.some(n => n.id === k) && typeof d.ptree2[k] === 'number'){
        t[k] = Math.max(0, Math.floor(d.ptree2[k]));
      }
    }
    if(!t.P2ROOT) t.P2ROOT = 1;
    state.ptree2 = t;
  } else {
    state.ptree2 = { P2ROOT:1 };
  }

  if(d.inv && typeof d.inv === 'object'){
    const iv = {};
    for(const r of RARITIES) iv[r.id] = Math.max(0, Math.floor(num(d.inv[r.id], 0)));
    state.inv = iv;
  }
  if(Array.isArray(d.recent)){
    state.recent = d.recent.map(r => {
      if(!r || typeof r !== 'object') return null;
      const base = RARITIES.find(x => x.id === r.b);
      if(!base) return null;
      const affixes = Array.isArray(r.a)
        ? r.a.map(id => AFFIXES.find(x => x.id === id)).filter(Boolean)
        : [];
      return { base, affixes };
    }).filter(Boolean).slice(0, 24);
  }
  if(Array.isArray(d.potionStock)){
    state.potionStock = d.potionStock.filter(p => p && typeof p === 'object' && p.tpl && p.tpl.name)
      .map(p => ({
        uid: p.uid || ('pot_' + Date.now() + '_' + Math.random()),
        tpl: p.tpl,
        price: Math.max(1, Math.floor(num(p.price, 100)))
      }))
      .slice(0, 3);
  }
  if(typeof d.shopDate === 'string') state.shopDate = d.shopDate;
  if(Array.isArray(d.shopSlots)) state.shopSlots = d.shopSlots.filter(id => SHOP_POOL.some(x => x.id === id));
  if(d.shopBought && typeof d.shopBought === 'object') state.shopBought = d.shopBought;
  else state.shopBought = {};
  state.forceAffix = !!d.forceAffix;
  if(d.daily && d.daily.date && Array.isArray(d.daily.tasks)){
    const today = new Date().toDateString();
    if(d.daily.date === today) state.daily = d.daily;
  }
  if(d.stats && typeof d.stats === 'object'){
    const s = state.stats;
    const keys = ['totalAffix','totalDouble','shinyCommon','shinyCommonDouble','chaoticCommon',
                  'goldDice','diamondDice','emeraldDice','rainbowDice'];
    for(const k of keys) s[k] = Math.max(0, Math.floor(num(d.stats[k], 0)));
  }
  if(d.unlockedAch && typeof d.unlockedAch === 'object'){
    const u = {};
    for(const k of Object.keys(d.unlockedAch)){
      if(ACHIEVEMENTS.some(a => a.id === k)) u[k] = d.unlockedAch[k] || Date.now();
    }
    state.unlockedAch = u;
  }
  /* 🕳️ 源质深渊 */
  state.abyssFloor       = Math.max(0, Math.floor(num(d.abyssFloor, 0)));
  state.abyssBest        = Math.max(0, Math.floor(num(d.abyssBest, 0)));
  state.abyssHp          = Math.max(0, num(d.abyssHp, 0));
  state.abyssMaxHp       = Math.max(0, num(d.abyssMaxHp, 0));
  state.abyssRerollLeft  = Math.max(0, Math.floor(num(d.abyssRerollLeft, 0)));
  state.abyssRolls       = Math.max(0, Math.floor(num(d.abyssRolls, 0)));
  state.abyssFloorDamage = Math.max(0, num(d.abyssFloorDamage, 0));
  state.abyssTotalDamage = Math.max(0, num(d.abyssTotalDamage, 0));
  state.essence          = Math.max(0, num(d.essence, 0));
  if(Array.isArray(d.abyssMods)){
    state.abyssMods = d.abyssMods.filter(id => ABYSS_MODS.some(m => m.id === id));
  } else state.abyssMods = [];
  if(d.abyssUpg && typeof d.abyssUpg === 'object'){
    const u = {};
    for(const k of Object.keys(d.abyssUpg)){
      if(ABYSS_UPGRADES.some(x => x.id === k)) u[k] = Math.max(0, Math.floor(num(d.abyssUpg[k], 0)));
    }
    state.abyssUpg = u;
  } else state.abyssUpg = {};

  /* 👹 世界 Boss */
  if(d.boss && typeof d.boss === 'object'){
    state.boss = {
      weekId: typeof d.boss.weekId === 'string' ? d.boss.weekId : '',
      bossId: typeof d.boss.bossId === 'string' ? d.boss.bossId : '',
      emoji: typeof d.boss.emoji === 'string' ? d.boss.emoji : '🐉',
      name: typeof d.boss.name === 'string' ? d.boss.name : '',
      desc: typeof d.boss.desc === 'string' ? d.boss.desc : '',
      weakness: typeof d.boss.weakness === 'string' ? d.boss.weakness : 'affix',
      hp: Math.max(0, num(d.boss.hp, 0)),
      maxHp: Math.max(1, num(d.boss.maxHp, 1)),
      totalDamage: Math.max(0, num(d.boss.totalDamage, 0)),
      killed: !!d.boss.killed,
      kills: Math.max(0, Math.floor(num(d.boss.kills, 0))),
      weekKills: Math.max(0, Math.floor(num(d.boss.weekKills, 0))),   // ✅ 新增
      claimedRewards: Array.isArray(d.boss.claimedRewards) ? d.boss.claimedRewards.slice(0, 10) : [],
      charges: Math.max(0, Math.min(10, Math.floor(num(d.boss.charges, 0))))
    };
  }

  /* 👑 VIP / SVIP */
  state.vip           = Math.max(0, Math.min(2, Math.floor(num(d.vip, 0))));
  state.vipDailyClaim = Math.max(0, Math.floor(num(d.vipDailyClaim, 0)));
  if(d.vipTree && typeof d.vipTree === 'object') state.vipTree = d.vipTree;
  else state.vipTree = {};

  state.buffs = [];
  return true;
}

function exportSave(){
  try{
    const json = JSON.stringify(getSaveData(), null, 2);
    const blob = new Blob([json], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const d = new Date();
    const dt = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    a.download = '沙杨马RNG存档_' + dt + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('📤 存档文件已导出');
    beep(1100, .15, 'sine', .05);
  }catch(e){ toast('❌ 导出失败'); }
}
function importSaveFromFile(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        if(applySaveData(JSON.parse(ev.target.result))){
          saveGame(); renderAll();
          toast('📥 存档导入成功');
          beep(1100, .18, 'sine', .06);
          setTimeout(() => beep(1500, .25, 'sine', .05), 130);
          burst('#00ff88', 80);
        }else toast('❌ 存档格式错误');
      }catch(err){ toast('❌ 存档解析失败'); }
    };
    reader.onerror = () => toast('❌ 文件读取失败');
    reader.readAsText(file);
  };
  input.click();
}
function copySaveToClipboard(){
  let json;
  try{ json = JSON.stringify(getSaveData()); }catch(e){ toast('❌ 序列化失败'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(() => {
      toast('📋 存档已复制到剪贴板');
      beep(1000, .12, 'sine', .05);
    }).catch(() => legacyCopy(json));
  }else legacyCopy(json);
}
function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    toast(ok ? '📋 存档已复制到剪贴板' : '❌ 复制失败，请手动导出');
  }catch(e){ toast('❌ 复制失败'); }
}
function pasteSaveFromClipboard(){
  if(!navigator.clipboard || !navigator.clipboard.readText){
    toast('❌ 浏览器不支持剪贴板读取'); return;
  }
  navigator.clipboard.readText().then(text => {
    try{
      if(applySaveData(JSON.parse(text))){
        saveGame(); renderAll();
        toast('📄 已从剪贴板导入存档');

        setTimeout(() => beep(1500, .25, 'sine', .05), 130);

}

function treeLv(id){ return state.tree[id] || 0; }
function ptreeLv(id){ return state.ptree[id] || 0; }
function ptree2Lv(id){ return state.ptree2[id] || 0; }

function nodeLv(n){
  if(n.perma2) return ptree2Lv(n.id);
  if(n.perma)  return ptreeLv(n.id);
  return treeLv(n.id);
}
function setNodeLv(n, v){
  if(n.perma2) state.ptree2[n.id] = v;
  else if(n.perma) state.ptree[n.id] = v;
  else state.tree[n.id] = v;
}

function nodeCost(n){
  if(n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT') return 0;
  return Math.floor(n.base * Math.pow(n.growth, nodeLv(n)));
}
function treeCost(n){ return nodeCost(n); }

function nodeIsUnlocked(n){
  if(n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT') return true;
  return n.req.every(r => {
    if(r === 'root' || r === 'PROOT' || r === 'P2ROOT') return true;
    const ref = ALL_NODES.find(x => x.id === r);
    if(!ref) return false;
    return nodeLv(ref) >= 1;
  });
}
function isUnlocked(n){ return nodeIsUnlocked(n); }

function getPityMax(){
  const lv = treeLv('PY1') + treeLv('PY2') + treeLv('PY3') +
             treeLv('PY4') + treeLv('PY5') + treeLv('PY6');
  if(lv === 0) return null;
  return PITY_TABLE[Math.min(lv, 6)];
}

function getPetPermaMult(){
  let v = 1;
  v += treeLv('P1') * 0.05;
  v += treeLv('P2') * 0.10;
  v += treeLv('P3') * 0.25;
  v += ptreeLv('PP1') * 0.15;
  v += ptreeLv('PP2') * 0.30;
  v += ptreeLv('PP3') * 0.60;
  v += ptree2Lv('P2P1') * 1.50;
  return v;
}
function getMultiRollChance(){
  let c = 0;
  c += treeLv('M1') * 0.005;
  c += treeLv('M2') * 0.008;
  c += treeLv('M3') * 0.012;
  c += treeLv('ME') * 0.030;
  c += ptreeLv('PM1') * 0.05;
  c += ptree2Lv('P2M1') * 0.08;
  return Math.min(0.90, c);
}

function getTrueRebirthCost(){
  return Math.floor(TRUE_REBIRTH.baseCost * Math.pow(TRUE_REBIRTH.costGrowth, state.trueRebirths));
}
function getTrueRebirthCoinMult(){
  return Math.pow(TRUE_REBIRTH.coinMultPer, state.trueRebirths);
}
function getTrueRebirthLuck(){
  return state.trueRebirths * TRUE_REBIRTH.luckPer;
}
function getPetDrawCost(count){
  const disc = 1 - Math.min(TRUE_REBIRTH.petDrawDiscountCap, state.trueRebirths * TRUE_REBIRTH.petDrawDiscountPer);
  const base = count === 10 ? PET_DRAW_COST_10 : PET_DRAW_COST_1;
  return Math.max(1, Math.floor(base * disc));
}
function getTotalPetDrawLuck(){
  return (state.petDrawLuck || 0) + ptree2Lv('P2PL') * 100;
}

function getTierCost(tier){
  const disc = 1 - Math.min(0.50, ptreeLv('PR5') * 0.02);
  if(tier.id === 'rebirth')   return Math.floor(tier.baseCost * Math.pow(tier.costGrowth, state.rebirths)   * disc);
  if(tier.id === 'ascend')    return Math.floor(tier.baseCost * Math.pow(tier.costGrowth, state.ascends)    * disc);
  if(tier.id === 'transcend') return Math.floor(tier.baseCost * Math.pow(tier.costGrowth, state.transcends) * disc);
  return Infinity;
}
function getLuckMult(){
  let v = 1;
  v += treeLv('L1')  * 0.03;
  v += treeLv('L2')  * 0.06;
  v += treeLv('L3')  * 0.12;
  v += treeLv('LC')  * 0.25;
  v += treeLv('LC2') * 0.50;
  v += treeLv('LE')  * 1.00;
  v += state.rebirths   * 0.15;
  v += state.ascends    * 2;
  v += state.transcends * 20;
  v += ptreeLv('PR3')   * 2;
  v += ptree2Lv('P2L1') * 20 + ptree2Lv('P2L2') * 50;
  v += getTrueRebirthLuck();
  for(const b of state.buffs) if(b.luck) v += b.luck;
  const ev = getEvent();
  if(ev.luck) v += ev.luck;
  if(state.vip === 1) v += 30;
  else if(state.vip === 2) v += 80;
  v += getPetTraits().luck;
  const hasWorm = state.petEquipped.some(uid => {
    const p = state.petInv.find(x => x.uid === uid);
    return p && p.species === 'worm';
  });
  if(hasWorm) v *= 0.01;
  return v;
}
function getCoinMult(){
  let v = 1;
  v += treeLv('V1')  * 0.10;
  v += treeLv('V2')  * 0.20;
  v += treeLv('V3')  * 0.35;
  v += treeLv('VG')  * 0.75;
  v += treeLv('VG2') * 1.50;
  v += treeLv('VE')  * 3.00;
  v *= 1 + state.rebirths   * (0.75 + ptreeLv('PR1') * 0.20);
  v *= 1 + state.ascends    * (5    + ptreeLv('PR2') * 0.40);
  v *= 1 + state.transcends * (50   + ptreeLv('PR4') * 0.50);
  for(const uid of state.petEquipped){
    const p = state.petInv.find(x => x.uid === uid);
    if(p) v *= petMult(p);
  }
  v *= (1 + getPetTraits().coin);
  v *= getPetPermaMult();
  v += ptree2Lv('P2C1') * 0.50 + ptree2Lv('P2C2') * 1.00;
  v *= getTrueRebirthCoinMult();
  for(const b of state.buffs) if(b.coinMult) v *= b.coinMult;
  const ev = getEvent();
  if(ev.coinMult) v *= ev.coinMult;
  return v;
}
function getAutoInterval(){
  let r = 0;
  r += treeLv('S1')  * 5;
  r += treeLv('S2')  * 8;
  r += treeLv('S3')  * 12;
  r += treeLv('SA')  * 15;
  r += treeLv('SA2') * 20;
  r += treeLv('SE')  * 25;
  let base = Math.max(55, 900 - r);
  let m = 1;
  for(const b of state.buffs) if(b.speedMult) m *= b.speedMult;
  const ptSpeed = getPetTraits().speed;
  if(ptSpeed !== 0) m *= Math.max(0.1, Math.min(3, 1 - ptSpeed));
  if(state.vip === 1) base *= 0.85;
  else if(state.vip === 2) base *= 0.70;
  return Math.max(30, base * m);
}
function getDiceInfo(){
  const ev = getEvent();
  const evMult = ev.diceMult || 1;
  const pMult = 1 + ptreeLv('PD1') * 0.10 + ptreeLv('PD2') * 0.20;
  const p2Mult = 1 + ptree2Lv('P2D1') * 0.50;
  let vipMult = 1;
  if(state.vip === 1) vipMult = 2;
  else if(state.vip === 2) vipMult = 4;
  const total = pMult * p2Mult * vipMult;
  return {
    gold:    (2.5 + treeLv('D1') * 0.5 + treeLv('D2') * 1.0 + treeLv('D3') * 2.5) * evMult * total,
    diamond: (10  + treeLv('DD2') * 10 + treeLv('DD3') * 25) * evMult * total,
    emerald: (50  + treeLv('DE2') * 50) * evMult * total,
    rainbow: 250 * evMult * total
  };
}
function getDiceType(n){
  if(treeLv('DR') >= 1 && n % DICE_INTERVAL.rainbow === 0) return 'rainbow';
  if(treeLv('DE') >= 1 && n % DICE_INTERVAL.emerald === 0) return 'emerald';
  if(treeLv('DD') >= 1 && n % DICE_INTERVAL.diamond === 0) return 'diamond';
  if(n % DICE_INTERVAL.gold === 0) return 'gold';
  return null;
}
function nextDiceIn(){
  const c = state.rollCount || 0;
  const list = [{ n: DICE_INTERVAL.gold - (c % DICE_INTERVAL.gold), key:'gold' }];
  if(treeLv('DD') >= 1) list.push({ n: DICE_INTERVAL.diamond - (c % DICE_INTERVAL.diamond), key:'diamond' });
  if(treeLv('DE') >= 1) list.push({ n: DICE_INTERVAL.emerald - (c % DICE_INTERVAL.emerald), key:'emerald' });
  if(treeLv('DR') >= 1) list.push({ n: DICE_INTERVAL.rainbow - (c % DICE_INTERVAL.rainbow), key:'rainbow' });
  list.sort((a,b) => a.n - b.n);
  return list[0];
}
function buildPool(){
  const lm = Math.max(1, getLuckMult());
  const K = 8;
  return RARITIES.map((r, i) => ({
    ref: r,
    w: r.w * Math.pow(lm, i / K)
  }));
}
function getAffixBonus(){
  let v = 0;
  v += treeLv('A1') * 0.015;
  v += treeLv('A2') * 0.025;
  for(const b of state.buffs) if(b.affixBonus) v += b.affixBonus;
  const ev = getEvent();
  if(ev.affixBonus) v += ev.affixBonus;
  if(state.vip === 1) v += 0.02;
  else if(state.vip === 2) v += 0.05;
  v += getPetTraits().affix;
  return v;
}
function getDoubleAffixBonus(){ return treeLv('A3') * 0.015; }

function rollAffixes(){
  if(state.forceAffix){
    state.forceAffix = false;
    const pool = AFFIXES.slice();
    const sel = pickFrom(pool.map(a => ({ ref:a, w:a.w }))).ref;
    return [sel];
  }
  const bonus = getAffixBonus();
  const r = Math.random();
  let count = 0;
  const p2 = 0.03 + getDoubleAffixBonus();
  const p1 = 0.20 + bonus * 1.5;
  if(r < p2) count = 2;
  else if(r < p1) count = 1;
  else return [];
  const picked = [];
  const pool = AFFIXES.slice();
  for(let i = 0; i < count; i++){
    if(!pool.length) break;
    const sel = pickFrom(pool.map(a => ({ ref:a, w:a.w }))).ref;
    picked.push(sel);
    pool.splice(pool.indexOf(sel), 1);
  }
  return picked;
}
function fullName(base, affixes){
  if(!affixes || !affixes.length) return base.name + '沙杨马';
  return affixes.map(a => a.name).join('·') + base.name + '沙杨马';
}
function fullNameHTML(base, affixes){
  if(!affixes || !affixes.length){
    return '<span style="color:' + base.color + '">' + base.name + '沙杨马</span>';
  }
  let s = '';
  affixes.forEach(a => {
    s += '<span style="color:' + a.color + ';text-shadow:0 0 14px ' + a.color + '">' + a.name + '</span>';
    s += '<span class="sep">·</span>';
  });
  s += '<span style="color:' + base.color + '">' + base.name + '沙杨马</span>';
  return s;
}
function affixMult(affixes){
  if(!affixes || !affixes.length) return 1;
  let m = 1;
  for(const a of affixes) m *= a.mult;
  m *= 1 + treeLv('AF1') * 0.05 + treeLv('AF2') * 0.10 + treeLv('AF3') * 0.20;
  return m;
}
function rollFull(){
  const pmax = getPityMax();
  let base;
  if(pmax !== null && state.pity >= pmax){
    base = pickFrom(RARITIES.slice(3).map(r => ({ ref:r, w:r.w }))).ref;
  }else{
    base = pickFrom(buildPool()).ref;
  }
  return { base, affixes: rollAffixes() };
}

/* ═══════════ 🕳️ 源质深渊核心逻辑 ═══════════ */
function getAbyssMods(){
  return (state.abyssMods || []).map(id => ABYSS_MODS.find(m => m.id === id)).filter(Boolean);
}
function getAbyssModifiers(){
  const mods = getAbyssMods();
  const out = {
    noDice:false, noAffix:false, noLuck:false, noPet:false, noPity:false,
    maxRarityIdx:-1, dmgMult:1, hpMult:1, crit:0, combo:false, comboMul:1,
    regen:false, hpDrain:0
  };
  for(const m of mods){
    const a = m.apply;
    if(a.noDice) out.noDice = true;
    if(a.noAffix) out.noAffix = true;
    if(a.noLuck) out.noLuck = true;
    if(a.noPet) out.noPet = true;
    if(a.noPity) out.noPity = true;
    if(a.maxRarityIdx !== undefined) out.maxRarityIdx = a.maxRarityIdx;
    if(a.dmgMult) out.dmgMult *= a.dmgMult;
    if(a.hpMult) out.hpMult *= a.hpMult;
    if(a.crit) out.crit += a.crit;
    if(a.combo){ out.combo = true; if(a.comboMul) out.comboMul = a.comboMul; }
    if(a.regen) out.regen = true;
    if(a.hpDrain) out.hpDrain += a.hpDrain;
  }
  return out;
}
function getAbyssDamageMult(){ return 1 + (state.abyssUpg.dmg || 0) * 0.20; }
function getAbyssCritBonus(){ return (state.abyssUpg.crit || 0) * 0.02; }
function getAbyssRerollMax(){ return 1 + (state.abyssUpg.reroll || 0); }
function getAbyssWeakenMult(){ return 1 - Math.min(0.30, (state.abyssUpg.weaken || 0) * 0.03); }
function getAbyssEssenceMult(){ return 1 + (state.abyssUpg.essence || 0) * 0.10; }
function getAbyssModCount(floor){
  if(floor < 5)  return 1;
  if(floor < 12) return 2;
  if(floor < 25) return 3;
  return 4;
}
function computeAbyssMaxHp(floor, modsObj){
  const mo = modsObj || getAbyssModifiers();
  let hp = 100 * Math.pow(1.7, floor - 1);
  hp *= mo.hpMult;
  hp *= getAbyssWeakenMult();
  return Math.max(1, Math.floor(hp));
}
function computeEssenceGain(floor){
  const base  = 5 + Math.floor(floor * 1.5);
  const bonus = Math.floor(Math.pow(1.10, floor));
  return Math.max(1, Math.floor((base + bonus) * getAbyssEssenceMult()));
}
function rollAbyssMods(floor){
  const n = getAbyssModCount(floor);
  return shuffle(ABYSS_MODS).slice(0, n);
}
function initAbyssFloor(floor){
  const mods = rollAbyssMods(floor);
  state.abyssMods = mods.map(m => m.id);
  const mo = getAbyssModifiers();
  state.abyssMaxHp = computeAbyssMaxHp(floor, mo);
  state.abyssHp = state.abyssMaxHp;
  state.abyssRolls = 0;
  state.abyssFloorDamage = 0;
  state.abyssRerollLeft = getAbyssRerollMax();
}
function ensureAbyssInit(){
  if(state.trueRebirths < 1) return;
  if(state.abyssFloor <= 0){
    state.abyssFloor = 1;
    state.abyssBest = Math.max(state.abyssBest, 1);
  }
  if(state.abyssHp <= 0 || state.abyssMaxHp <= 0){
    initAbyssFloor(state.abyssFloor);
  }
}
function rerollAbyssMods(){
  if(state.page !== 'abyss') return;
  if(state.abyssRerollLeft <= 0){ toast('❌ 本层重随次数已用完'); beep(220,.12,'square',.04); return; }
  state.abyssRerollLeft--;
  const ratio = state.abyssMaxHp > 0 ? Math.max(0, state.abyssHp / state.abyssMaxHp) : 1;
  const mods = rollAbyssMods(state.abyssFloor);
  state.abyssMods = mods.map(m => m.id);
  const newMax = computeAbyssMaxHp(state.abyssFloor, getAbyssModifiers());
  state.abyssMaxHp = newMax;
  state.abyssHp = Math.max(1, Math.floor(newMax * ratio));
  beep(900, .12, 'sine', .05);
  toast('🎲 变异已重随');
  renderAbyssPage();
  markDirty();
}
function onAbyssClear(){
  const cleared = state.abyssFloor;
  const gain = computeEssenceGain(cleared);
  state.essence += gain;
  state.abyssFloor++;
  state.abyssBest = Math.max(state.abyssBest, state.abyssFloor);
  initAbyssFloor(state.abyssFloor);

  beep(1100, .22, 'sine', .06);
  setTimeout(() => beep(1500, .3, 'sine', .055), 120);
  setTimeout(() => beep(1900, .4, 'sine', .05), 260);
  burst('#a855f7', 70);
  burst('#e038ff', 50);
  burst('#ffffff', 30);
  shake(7);
  toast('🕳️ 突破第 ' + cleared + ' 层！源质 +' + gain + '（当前第 ' + state.abyssFloor + ' 层）');
  if(state.abyssFloor % 10 === 0){
    setTimeout(() => toast('🔥 已抵达第 ' + state.abyssFloor + ' 层，变异数 ' + getAbyssModCount(state.abyssFloor)), 1600);
  }
  checkAchievements();
}
function showAbyssHit(dmg, isCrit){
  const el = document.createElement('div');
  el.className = 'abyss-hit' + (isCrit ? ' crit' : '');
  el.textContent = (isCrit ? '暴击 ' : '') + fmt(dmg);
  el.style.left = (window.innerWidth / 2) + 'px';
  el.style.top  = (window.innerHeight * 0.42) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function applyAbyssDamageFromRoll(idx, aMult, diceMult){
  if(state.trueRebirths < 1) return;
  if(state.abyssFloor <= 0) return;

  if(state.abyssHp <= 0 || state.abyssMaxHp <= 0){
    initAbyssFloor(state.abyssFloor || 1);
  }

  const mo = getAbyssModifiers();

  let useIdx = idx;
  if(mo.maxRarityIdx >= 0 && useIdx > mo.maxRarityIdx) useIdx = mo.maxRarityIdx;

  let dmg = Math.pow(20, useIdx);
  if(!mo.noAffix) dmg *= aMult;
  if(!mo.noDice)  dmg *= diceMult;
  if(!mo.noPet)   dmg *= (1 + getPetTraits().coin);
  dmg *= mo.dmgMult;
  dmg *= getAbyssDamageMult();
  dmg *= vipValue('abyssDamage');

  if(mo.combo){
    const bonus = Math.min(4, state.abyssRolls * 0.06 * (mo.comboMul || 1));
    dmg *= (1 + bonus);
  }

  const critChance = (mo.crit || 0) + getAbyssCritBonus();
  let isCrit = false;
  if(critChance > 0 && Math.random() < critChance){
    dmg *= 5;
    isCrit = true;
  }

  if(mo.hpDrain > 0){
    state.abyssHp -= state.abyssMaxHp * mo.hpDrain;
  }

  state.abyssHp -= dmg;
  state.abyssRolls++;
  state.abyssFloorDamage += dmg;
  state.abyssTotalDamage += dmg;

  if(mo.regen && state.abyssRolls % 20 === 0 && state.abyssHp > 0){
    state.abyssHp = Math.min(state.abyssMaxHp, state.abyssHp + state.abyssMaxHp * 0.15);
    toast('💚 敌人再生！');
  }

  if(state.page === 'abyss'){
    showAbyssHit(dmg, isCrit);
  }

  if(state.abyssHp <= 0){
    onAbyssClear();
  }

  if(state.page === 'abyss'){
    updateAbyssUI();
  }
  markDirty();
}

/* ═══════════ 👹 世界 Boss 核心 ═══════════ */
function applyBossDamageFromRoll(idx, aMult, diceMult){
  ensureBossInit();
  if(!state.boss || !state.boss.weekId) return;
  if(state.boss.killed) return;

  const W = state.boss.weakness;
  let dmg = Math.pow(20, idx) * 100;
  let mult = 0.2;
  if(W === 'affix'  && aMult > 1.001)    mult = 5 * aMult;
  if(W === 'dice'   && diceMult > 1.001) mult = 5 * diceMult;
  if(W === 'pet'){  const pt = getPetTraits(); if(pt.coin > 0) mult = 5 * (1 + pt.coin); }
  if(W === 'rarity') mult = 5 * (1 + idx * 0.5);
  dmg *= mult;

  /* 储存充能：本次有充能则全额释放并清零 */
  if(state.boss.charges > 0){
    dmg *= (1 + state.boss.charges * 0.5);
    state.boss.charges = 0;
  }

  state.boss.totalDamage += dmg;
  state.boss.hp -= dmg;

  /* 👹 Boss 伤害飘字 */
  if(state.page === 'boss' && !state.boss.killed){
    showAbyssHit(dmg, false);
  }

  if(state.boss.hp <= 0){
    onBossKilled();
  }
  markDirty();
}

let audioCtx = null;
function beep(freq, dur, type, vol){
  if(!state.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(vol || .05, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }catch(e){}
}

const canvas = $('#fx');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
const particles = [];
const MAX_PARTICLES = 350;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();
function burst(color, count, cx, cy){
  if(state.particles === false) return;   // ═══ 粒子开关：关闭时直接跳过 ═══
  const room = MAX_PARTICLES - particles.length;
  if(room <= 0) return;
  if(count > room) count = room;

  let x = cx, y = cy;
  if(x === undefined){
    const el = $('#diceHint');
    const r = el ? el.getBoundingClientRect() : { left: W/2-100, top: H/2-100, width:200, height:200 };
    x = r.left + r.width / 2; y = r.top + r.height / 2 - 40;
  }
  for(let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 1.5 + Math.random() * 8;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.5,
      life: 1,
      decay: .008 + Math.random() * .022,
      size: 1.5 + Math.random() * 4.5,
      color
    });
  }
}

function fxLoop(){
  ctx.clearRect(0, 0, W, H);
  if(!particles.length){ requestAnimationFrame(fxLoop); return; }

  ctx.globalCompositeOperation = 'lighter';

  const groups = {};
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += .12;
    p.vx *= .992; p.vy *= .992;
    p.life -= p.decay;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    let g = groups[p.color];
    if(!g){ g = groups[p.color] = []; }
    g.push(p);
  }

  for(const color in groups){
    const arr = groups[color];
    ctx.fillStyle = color;
    for(let j = 0; j < arr.length; j++){
      const p = arr[j];
      ctx.globalAlpha = p.life;
      const s = p.size * p.life;
      ctx.fillRect(p.x - s, p.y - s, s * 2, s * 2);
    }
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(fxLoop);
}
fxLoop();

function showNodeTip(node, clientX, clientY){
  if(!tipEl) return;
  const id = node.dataset.node;
  const n = ALL_NODES.find(x => x.id === id);
  if(!n) return;
  const lv = nodeLv(n);
  const unlocked = nodeIsUnlocked(n);
  const maxed = lv >= n.max;
  const lvClass = maxed ? ' max' : '';
  const lvStr = (n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT') ? '起点'
              : (n.max === 1 ? (lv >= 1 ? '已解锁' : '未解锁') : (lv + ' / ' + n.max));
  const tag = n.perma2 ? ' <span style="color:#c85aff;font-size:11px">二阶</span>'
            : n.perma  ? ' <span style="color:#ffc93c;font-size:11px">永久</span>'
            : '';
  let html = '<div class="nt-head">' +
    '<span class="nt-emoji">' + n.emoji + '</span>' +
    '<span class="nt-name">' + esc(n.name) + tag + '</span>' +
    '<span class="nt-lv' + lvClass + '">' + lvStr + '</span></div>';
  html += '<div class="nt-desc">' + esc(n.desc) + '</div>';
  if(lv > 0){
    const effs = getNodeEffects(n);
    if(effs.length){
      html += '<div class="nt-row"><span class="lb">当前加成</span></div>';
      for(const e of effs){
        html += '<div class="nt-row"><span class="vl green">' + esc(e) + '</span></div>';
      }
    }
  }
  if(n.id === 'root' || n.id === 'PROOT' || n.id === 'P2ROOT'){}
  else if(maxed){
    html += '<div class="nt-row"><span class="lb">状态</span><span class="vl">已满级</span></div>';
  } else if(!unlocked){
    const missing = n.req.filter(r => {
      if(r === 'root' || r === 'PROOT' || r === 'P2ROOT') return false;
      const ref = ALL_NODES.find(x => x.id === r);
      if(!ref) return false;
      return nodeLv(ref) < 1;
    }).map(r => { const p = ALL_NODES.find(x => x.id === r); return p ? p.name : r; }).join('、');
    html += '<div class="nt-row"><span class="lb">🔒 需要先解锁</span><span class="vl red">' + esc(missing) + '</span></div>';
  } else {
    const cost = nodeCost(n);
    const can = state.coins >= cost;
    html += '<div class="nt-row"><span class="lb">下一级价格</span><span class="vl ' + (can ? '' : 'red') + '">💰 ' + fmt(cost) + '</span></div>';
    // 批量升级预览：显示按当前档位一次升满所需总花费与可升次数
    const mode = Math.max(1, state.upgradeMode || 1);
    if(mode > 1){
      let previewTimes = 0, previewCost = 0;
      for(let i = 0; i < mode; i++){
        if(lv + previewTimes >= n.max) break;
        const c = nodeCostAt(n, lv + previewTimes);
        if(state.coins < previewCost + c) break;
        previewCost += c; previewTimes++;
      }
      if(previewTimes > 1){
        html += '<div class="nt-row"><span class="lb">一键 +' + mode + ' 预览</span>' +
                '<span class="vl" style="color:#ffc93c">+' + previewTimes + ' 级 · 💰 ' + fmt(previewCost) + '</span></div>';
      }
    }
  }
  html += '<div class="nt-hint">' + (n.perma2 ? '二阶永久节点 · 重生不清空' : (n.perma ? '永久节点 · 重生不清空' : '点击节点即可升级')) + '</div>';
  tipEl.innerHTML = html;
  tipEl.classList.add('on');
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = clientX + 16, y = clientY + 16;
  if(x + tw > window.innerWidth - 8) x = clientX - tw - 16;
  if(y + th > window.innerHeight - 8) y = clientY - th - 16;
  if(x < 8) x = 8;
  if(y < 8) y = 8;
  tipEl.style.left = x + 'px';
  tipEl.style.top  = y + 'px';
}

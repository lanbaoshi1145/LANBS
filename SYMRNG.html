<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>沙杨马 RNG · 无限抽奖</title>
<style>
:root{
  --gold:#ffc93c;--gem:#2ee6ff;--line:rgba(255,255,255,.08);
  --panel:rgba(16,23,44,.86);--nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1400px 800px at 50% -20%, #1c2a55 0%, transparent 65%),
    radial-gradient(1000px 700px at 90% 110%, #3a1450 0%, transparent 65%),
    #070b14;
  color:#e8eefc;overflow-x:hidden;user-select:none;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.app{max-width:1320px;margin:0 auto;padding:14px 24px calc(var(--nav-h) + 34px);position:relative;z-index:2;min-height:100vh;}
@media(max-width:820px){.app{padding:12px 12px calc(var(--nav-h) + 26px);}}

.hud{
  display:flex;flex-wrap:wrap;gap:7px;justify-content:center;
  padding:9px;border-radius:16px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);margin-bottom:10px;
  position:sticky;top:6px;z-index:30;box-shadow:0 10px 30px -18px #000;
}
.chip{
  display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  font-size:12.5px;font-weight:800;white-space:nowrap;
}
.chip .v{font-variant-numeric:tabular-nums;color:#fff}
.chip.gold .v{color:var(--gold);text-shadow:0 0 12px rgba(255,201,60,.5)}
.chip.gem .v{color:var(--gem);text-shadow:0 0 12px rgba(46,230,255,.5)}
.chip.rb .v{color:#ff9bd8;text-shadow:0 0 12px rgba(255,155,216,.5)}

.buffs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;min-height:0}
.buff{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;
  font-size:11px;font-weight:800;background:rgba(255,255,255,.06);
  border:1px solid var(--bc,rgba(255,255,255,.15));color:#dde6f7;
}
.buff .bt{color:#9aa8c4;font-variant-numeric:tabular-nums}

.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-title{text-align:center;margin:4px 0 18px}
.page-title h2{
  font-size:clamp(19px,2.4vw,24px);font-weight:900;letter-spacing:.08em;
  background:linear-gradient(100deg,#8fd4ff,#a88bff 50%,#ff9bd8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.page-title p{font-size:11.5px;color:#6d7a94;letter-spacing:.14em;margin-top:5px}

.roll-area{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.display{
  --c:#8b98ad;width:min(78vw,320px);aspect-ratio:1/1.02;border-radius:28px;
  background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.012)),#0b1120;
  border:2.5px solid var(--c);
  box-shadow:0 0 0 1px rgba(255,255,255,.04),0 26px 60px -26px var(--c),inset 0 0 80px -36px var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  position:relative;overflow:hidden;transition:border-color .25s,box-shadow .4s;flex:none;
}
.display::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.24) 50%,transparent 60%);
  transform:translateX(-130%);pointer-events:none;
}
.display.pop::after{animation:sheen .9s ease-out}
@keyframes sheen{to{transform:translateX(130%)}}
.display.rolling{animation:jit .08s infinite}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(-2px,2px)}100%{transform:translate(2px,-1.5px)}}
.display.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.09)}100%{transform:scale(1)}}
.dice-tag{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  padding:5px 15px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.08em;
  background:var(--dc,#ffc93c);color:#080b14;box-shadow:0 0 26px var(--dc,#ffc93c);
  white-space:nowrap;z-index:3;opacity:0;transition:opacity .18s;pointer-events:none;
}
.dice-tag.show{opacity:1;animation:dicePop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes dicePop{0%{transform:translateX(-50%) scale(.3);opacity:0}70%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1);opacity:1}}
.d-badge{
  font-size:13px;font-weight:900;letter-spacing:.24em;padding:5px 17px;border-radius:999px;
  background:var(--c);color:#080b14;transition:background .25s;
}
.d-name{
  font-size:clamp(20px,4vw,28px);font-weight:900;letter-spacing:.05em;
  color:var(--c);text-shadow:0 0 28px var(--c);
  transition:color .25s,text-shadow .25s;text-align:center;padding:0 12px;line-height:1.28;
}
.d-name .sep{color:#7c89a5;font-weight:700}
.d-sub{font-size:11.5px;letter-spacing:.08em;color:#6b7893;text-align:center;padding:0 16px;line-height:1.6}

.roll-side{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px}
.dice-hint{font-size:12px;color:#7c89a5;letter-spacing:.05em;font-weight:700;text-align:center}
.dice-hint b{font-size:14px}
.dice-list{display:flex;flex-direction:column;gap:5px;width:100%}
.dice-card{
  display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  font-size:11.5px;font-weight:800;color:#c8d4ea;transition:.22s;
}
.dice-card.next{
  border-color:var(--dc);
  background:rgba(255,255,255,.09);
  box-shadow:0 0 16px -6px var(--dc),inset 0 0 12px -8px var(--dc);
}
.dice-card .dc-emoji{font-size:15px;line-height:1}
.dice-card .dc-name{flex:1;color:#dde6f7;letter-spacing:.02em}
.dice-card .dc-next{color:var(--dc);font-weight:900;font-variant-numeric:tabular-nums}
.dice-card .dc-mult{
  color:#8ff0c4;font-weight:900;font-variant-numeric:tabular-nums;font-size:10.5px;
  padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.28);
}
.pity-wrap{width:100%}
.pity-top{display:flex;justify-content:space-between;font-size:11.5px;color:#8b98ad;letter-spacing:.06em;margin-bottom:6px;font-weight:700}
.pity-top .locked{color:#ff8a8a}
.pity-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.pity-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#3fa9ff,#ffb020,#ff3d6e);border-radius:99px;transition:width .3s}
.pity-bar.locked i{background:rgba(255,120,120,.35)}

.btn{border:none;border-radius:16px;cursor:pointer;font-weight:900;letter-spacing:.08em;font-family:inherit;transition:transform .1s,filter .2s,box-shadow .2s;width:100%;}
.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.roll-btn{padding:17px;font-size:19px;letter-spacing:.34em;text-indent:.34em;background:linear-gradient(180deg,#4a86ff,#1d3fd0);color:#fff;border:1px solid rgba(150,190,255,.5);box-shadow:0 14px 36px -10px #3f7bff,inset 0 1px 0 rgba(255,255,255,.3);}
.auto-btn{padding:14px;font-size:13px;letter-spacing:.16em;background:linear-gradient(180deg,#22c98a,#0d8557);color:#03150e;border:1px solid rgba(120,255,210,.4);box-shadow:0 10px 26px -12px #22c98a;}
.auto-btn.on{background:linear-gradient(180deg,#ff5f5f,#b81c1c);color:#fff;border-color:rgba(255,140,140,.5);box-shadow:0 10px 26px -12px #ff5f5f;}

.hist{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:26px;padding:0 4px}
.hchip{font-size:10px;font-weight:900;letter-spacing:.05em;padding:3px 8px;border-radius:7px;color:var(--c);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);position:relative;}
.hchip .hstar{position:absolute;top:-5px;right:-4px;font-size:9px;line-height:1;color:#fff9a8;text-shadow:0 0 6px #fff9a8}

.card{border-radius:20px;background:var(--panel);border:1px solid var(--line);overflow:hidden;backdrop-filter:blur(10px);margin-bottom:12px;}
.card-head{padding:11px 14px;font-size:12.5px;font-weight:900;letter-spacing:.06em;color:#cfd9ec;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:7px;}
.card-body{padding:12px}

.tree-toolbar{display:flex;gap:9px;margin-bottom:10px;font-size:11px;color:#8b98ad;font-weight:700;justify-content:center;flex-wrap:wrap;}
.tree-toolbar span{display:inline-flex;align-items:center;gap:4px}
.tree-toolbar i{width:9px;height:9px;border-radius:3px;display:inline-block}
.tree-viewport{
  position:relative;overflow:hidden;
  height:calc(100vh - var(--nav-h) - 240px);min-height:440px;border-radius:20px;
  background:
    radial-gradient(900px 600px at 50% 0%,rgba(80,140,255,.10),transparent 70%),
    linear-gradient(rgba(120,160,220,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,160,220,.045) 1px,transparent 1px),
    rgba(0,0,0,.42);
  background-size: 100% 100%, 32px 32px, 32px 32px, 100% 100%;
  border:1px solid rgba(120,160,220,.14);cursor:grab;user-select:none;touch-action:none;
  box-shadow:inset 0 0 60px -20px rgba(80,140,255,.25);
}
.tree-viewport.grabbing{cursor:grabbing}
.tree-canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
.tree-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tree-ctrl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;z-index:5;}
.tree-ctrl button{
  width:40px;height:40px;border-radius:12px;background:rgba(20,28,52,.92);
  border:1px solid rgba(120,160,255,.32);color:#fff;font-size:18px;font-weight:900;
  cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);transition:.15s;
  font-family:inherit;box-shadow:0 6px 20px -8px #000;line-height:1;
}
.tree-ctrl button:hover{background:rgba(60,100,200,.95);border-color:rgba(150,190,255,.6)}
.tree-ctrl button:active{transform:scale(.92)}
.tree-ctrl button.zoom-lvl{font-size:10px;font-weight:900;color:#9fc4ff;letter-spacing:0;}
.tree-hint{position:absolute;left:14px;bottom:14px;font-size:10.5px;color:#7c89a5;letter-spacing:.03em;background:rgba(10,16,32,.75);border:1px solid rgba(255,255,255,.06);padding:6px 11px;border-radius:9px;backdrop-filter:blur(8px);pointer-events:none;line-height:1.5;}
@media(max-width:640px){.tree-hint{display:none}}

.tnode{
  position:absolute;border-radius:14px;
  background:linear-gradient(160deg,rgba(38,54,92,.95),rgba(14,22,44,.95));
  border:1.5px solid rgba(120,150,210,.24);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:4px 3px;cursor:pointer;
  transition:transform .15s,border-color .2s,box-shadow .2s,background .2s;
  text-align:center;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.8);font-family:inherit;
}
.tnode:hover{transform:translateY(-2px);border-color:rgba(140,190,255,.6);box-shadow:0 10px 22px -8px rgba(80,140,255,.5);}
.tnode .tn-emoji{line-height:1}
.tnode .tn-name{font-weight:900;color:#d3dcf0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.tnode .tn-foot{font-weight:800;color:#8494b3;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;}
.tnode.locked{opacity:.34;filter:grayscale(.9);cursor:not-allowed}
.tnode.locked:hover{transform:none;border-color:rgba(120,150,210,.24);box-shadow:0 6px 16px -6px rgba(0,0,0,.8)}
.tnode.avail{border-color:rgba(90,170,255,.85);background:linear-gradient(160deg,rgba(50,90,180,.35),rgba(20,40,90,.9));box-shadow:0 6px 18px -4px rgba(63,123,255,.6),inset 0 0 22px -14px #3f7bff;}
.tnode.avail .tn-name{color:#b9d8ff}
.tnode.avail .tn-foot{color:#7fb4ff}
.tnode.owned{border-color:rgba(90,230,160,.7);background:linear-gradient(160deg,rgba(30,110,80,.5),rgba(14,40,30,.9));box-shadow:0 6px 18px -4px rgba(90,230,160,.45);}
.tnode.owned .tn-name{color:#9ff3ce}
.tnode.owned .tn-foot{color:#4dd8a0}
.tnode.maxed{border-color:rgba(255,210,80,.9);background:linear-gradient(160deg,rgba(150,110,25,.55),rgba(50,35,10,.9));box-shadow:0 6px 22px -4px rgba(255,200,60,.65),inset 0 0 22px -12px #ffc93c;}
.tnode.maxed .tn-name{color:#ffd86b}
.tnode.maxed .tn-foot{color:#ffc93c}
.tnode.pity-node.avail{border-color:rgba(255,140,140,.9);background:linear-gradient(160deg,rgba(160,50,60,.4),rgba(50,15,20,.9));box-shadow:0 6px 18px -4px rgba(255,95,95,.55);}
.tnode.pity-node.owned{border-color:rgba(255,180,90,.85);background:linear-gradient(160deg,rgba(160,100,30,.5),rgba(60,35,10,.9));}
.tnode.pity-node.maxed{border-color:rgba(255,225,110,.95);background:linear-gradient(160deg,rgba(180,140,30,.55),rgba(60,45,10,.9));box-shadow:0 6px 22px -4px rgba(255,220,90,.7);}

/* ═══ 永久树节点样式 ═══ */
.tnode.perma-node{border-color:rgba(255,200,60,.55);background:linear-gradient(160deg,rgba(120,90,20,.5),rgba(40,28,8,.9));}
.tnode.perma-node.maxed{border-color:rgba(255,225,110,.95);box-shadow:0 6px 24px -4px rgba(255,215,60,.75),inset 0 0 22px -12px #ffc93c;}
.tnode.perma-node .tn-name{color:#ffe9a8;}
.tnode.perma-node.avail{border-color:rgba(255,210,90,.9);background:linear-gradient(160deg,rgba(140,105,25,.5),rgba(50,35,10,.9));box-shadow:0 6px 20px -4px rgba(255,190,60,.6);}
.tnode.perma-node.owned{border-color:rgba(255,220,110,.8);background:linear-gradient(160deg,rgba(150,115,30,.55),rgba(55,40,12,.9));}

#nodeTip{
  position:fixed;z-index:180;pointer-events:none;
  max-width:280px;min-width:200px;
  background:linear-gradient(165deg,rgba(24,34,64,.98),rgba(10,16,34,.98));
  border:1px solid rgba(120,170,255,.45);
  border-radius:14px;padding:13px 15px;
  box-shadow:0 20px 50px -18px #000,0 0 30px -10px rgba(80,140,255,.4);
  opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
}
#nodeTip.on{opacity:1;transform:translateY(0)}
#nodeTip .nt-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
#nodeTip .nt-emoji{font-size:20px;line-height:1}
#nodeTip .nt-name{font-size:14px;font-weight:900;color:#fff;letter-spacing:.03em;}
#nodeTip .nt-lv{font-size:11px;font-weight:900;padding:2px 8px;border-radius:7px;background:rgba(90,140,255,.28);color:#9fc4ff;margin-left:auto;}
#nodeTip .nt-lv.max{background:rgba(255,200,60,.28);color:#ffd86b}
#nodeTip .nt-desc{font-size:11.5px;color:#9aa8c4;line-height:1.55;margin-bottom:8px;}
#nodeTip .nt-row{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin-top:5px;}
#nodeTip .nt-row .lb{color:#7c89a5;font-size:11px;}
#nodeTip .nt-row .vl{color:#ffd86b;font-variant-numeric:tabular-nums;}
#nodeTip .nt-row .vl.red{color:#ff8a8a}
#nodeTip .nt-row .vl.green{color:#8ff0c4}
#nodeTip .nt-hint{font-size:10.5px;color:#5a6580;margin-top:9px;border-top:1px dashed rgba(255,255,255,.08);padding-top:7px;letter-spacing:.02em;}

.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;max-width:720px;margin-left:auto;margin-right:auto;}
.subtab{flex:1;padding:10px 8px;border-radius:11px;text-align:center;font-size:12px;font-weight:900;letter-spacing:.02em;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#8b98ad;cursor:pointer;transition:.2s;min-width:62px;}
.subtab.on{background:linear-gradient(180deg,#3f7bff,#1d3fd0);color:#fff;border-color:transparent}
.subtab:active{transform:scale(.96)}

.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:1100px;margin:0 auto;}
.shop-item{border-radius:14px;padding:13px 11px;background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.09);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
.shop-item .si-emoji{font-size:26px;line-height:1}
.shop-item .si-name{font-size:12px;font-weight:900;color:#d7e0f2}
.shop-item .si-desc{font-size:10px;color:#7c89a5;line-height:1.45;min-height:30px}
.shop-item .si-price{font-size:11.5px;font-weight:900;padding:8px 10px;border-radius:9px;width:100%;background:rgba(255,255,255,.06);color:#c8d4ea;cursor:pointer;border:none;font-family:inherit;transition:.15s;}
.shop-item .si-price:active{transform:scale(.96)}
.shop-item .si-price.can-gold{background:linear-gradient(180deg,#ffb020,#b87200);color:#241700}
.shop-item .si-price.can-gem{background:linear-gradient(180deg,#2ee6ff,#008eae);color:#041820}
.shop-item .si-price.can-pack{background:linear-gradient(180deg,#ff4fb5,#8a0d5c);color:#fff}
.shop-item .si-price:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed}

.merchant{border-radius:14px;background:linear-gradient(165deg,rgba(120,80,255,.12),rgba(80,200,255,.05));border:1px solid rgba(150,120,255,.3);padding:13px;margin-bottom:14px;font-size:12px;color:#c5b8ff;line-height:1.55;display:flex;align-items:center;gap:11px;max-width:1100px;margin-left:auto;margin-right:auto;}
.merchant .m-emoji{font-size:30px;flex:none}

.equip-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.equip-slot{
  border-radius:13px;padding:10px 6px;text-align:center;
  background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;
  min-height:78px;transition:.2s;
}
.equip-slot.filled{
  background:linear-gradient(165deg,color-mix(in srgb, var(--qc) 18%, transparent),rgba(255,255,255,.02));
  border-color:var(--qc);
  cursor:pointer;
  box-shadow:0 0 20px -8px var(--qc);
}
@supports not (background: color-mix(in srgb, red 10%, transparent)){
  .equip-slot.filled{background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-color:rgba(255,255,255,.3)}
}
.equip-slot.empty{
  border-style:dashed;color:#5a6580;font-size:11px;font-weight:700;
}
.equip-slot .es-emoji{font-size:26px;line-height:1}
.equip-slot .es-info{font-size:10.5px;font-weight:900;color:#d7e0f2;font-variant-numeric:tabular-nums;text-align:center}
.equip-slot .es-mult{font-size:9.5px;color:#8ff0c4;font-weight:800}

.pet-draw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;margin:0 auto;}
.pet-draw-btn{
  border-radius:15px;padding:16px 12px;border:none;cursor:pointer;
  font-family:inherit;color:#fff;
  background:linear-gradient(165deg,#3f7bff,#1d3fd0);
  border:1px solid rgba(150,190,255,.35);
  box-shadow:0 12px 30px -12px #3f7bff;
  transition:.15s;text-align:center;
}
.pet-draw-btn.big{
  background:linear-gradient(165deg,#ff4fb5,#8a0d5c);
  box-shadow:0 12px 30px -12px #ff4fb5;
  border-color:rgba(255,140,200,.5);
}
.pet-draw-btn:hover{filter:brightness(1.1)}
.pet-draw-btn:active{transform:scale(.96)}
.pet-draw-btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed;box-shadow:none}
.pet-draw-btn .pdb-emoji{font-size:28px;line-height:1;margin-bottom:5px}
.pet-draw-btn .pdb-name{font-size:13px;font-weight:900;letter-spacing:.04em}
.pet-draw-btn .pdb-cost{font-size:11.5px;margin-top:4px;opacity:.85;font-weight:800}
.pet-draw-btn .pdb-cost b{color:#ffd86b}

.pet-bag-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;
}

const PET_TRAIT_NAMES = { coin:'金币', gem:'钻石', luck:'幸运', affix:'词条率', speed:'抽速' };
const PET_SPECIES = [

    traits:[{t:'coin', v:0.05}] },

    traits:[{t:'luck', v:-5}, {t:'affix', v:-0.15}, {t:'speed', v:-0.2}] }
];

const PET_DRAW_COST_1 = 200;
const PET_DRAW_COST_10 = 1800;

const OLD_PET_PRICES = {
  p1:0, p2:60, p3:350, p4:2000, p5:12000, p6:80000, p7:600000,
  p8:5000000, p9:6e7, p10:9e8, p11:2e10, p12:8e11
};

const MAX_PETS = 3;

function getSpecies(id){ return PET_SPECIES.find(s => s.id === id) || PET_SPECIES[0]; }
function getQuality(id){ return PET_QUALITIES.find(q => q.id === id) || PET_QUALITIES[0]; }
function getStarInfo(star){ return PET_STARS[Math.max(0, Math.min(PET_STARS.length - 1, star - 1))]; }

function petMult(pet){
  if(!pet) return 1;
  const q = getQuality(pet.quality);
  const st = getStarInfo(pet.star);
  let m = q.mult * st.mult;
  if(pet.shiny) m *= 3;
  return m;
}

function getPetTraits(){
  const total = { coin:0, gem:0, luck:0, affix:0, speed:0 };
  for(const uid of state.petEquipped){
    const p = state.petInv.find(x => x.uid === uid);
    if(!p) continue;
    const sp = getSpecies(p.species);
    const starMul = 1 + (p.star - 1) * 0.5;
    const shinyMul = p.shiny ? 2 : 1;
    for(const tr of sp.traits){
      total[tr.t] = (total[tr.t] || 0) + tr.v * starMul * shinyMul;
    }
  }
  return total;
}

function genPet(qualityId, speciesId){
  const sp = getSpecies(speciesId);
  return {
    uid: 'pet_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    species: sp.id,
    quality: qualityId,
    star: sp.minStar,
    exp: 0,
    shiny: false
  };
}
function rollPetQuality(){
  const list = Object.keys(PET_QUALITY_WEIGHTS).map(k => ({ ref:k, w:PET_QUALITY_WEIGHTS[k] }));
  return pickFrom(list).ref;
}
function rollSpecies(){
  return pickFrom(PET_SPECIES.map(s => ({ ref:s.id, w:s.w }))).ref;
}

function petExpNeed(qualityId){
  const idx = PET_QUALITIES.findIndex(q => q.id === qualityId);
  if(idx < 0 || idx >= PET_QUALITIES.length - 1) return Infinity;
  return Math.floor(100 * Math.pow(3, idx));
}

function petAbsorbExp(absorber, absorbed){
  if(!absorber || !absorbed) return 0;
  if(absorber.uid === absorbed.uid) return 0;
  if(absorber.star !== absorbed.star) return 0;
  if(!!absorber.shiny !== !!absorbed.shiny) return 0;
  const ai = PET_QUALITIES.findIndex(q => q.id === absorber.quality);
  const bi = PET_QUALITIES.findIndex(q => q.id === absorbed.quality);
  if(ai < 0 || bi < 0) return 0;
  if(bi > ai) return 0;
  const ratio = (bi + 1) / (ai + 1);
  return Math.max(1, Math.floor(30 * (bi + 1) * ratio * ratio));
}

/* 一键选材料：主宠物必须已选 */
function autoSelectLevelup(){
  const target = state.petLevelupTarget ? state.petInv.find(p => p.uid === state.petLevelupTarget) : null;
  if(!target) return 0;

  const ti = PET_QUALITIES.findIndex(q => q.id === target.quality);
  const mats = state.petInv.filter(p =>
    p.uid !== target.uid &&
    p.star === target.star &&
    !!p.shiny === !!target.shiny &&
    PET_QUALITIES.findIndex(q => q.id === p.quality) <= ti
  );
  if(!mats.length) return 0;

  mats.sort((a, b) =>
    PET_QUALITIES.findIndex(q => q.id === b.quality) -
    PET_QUALITIES.findIndex(q => q.id === a.quality)
  );
  state.petLevelupMaterials = mats.map(m => m.uid);
  return mats.length;
}

function absorbPets(){
  const target = state.petInv.find(p => p.uid === state.petLevelupTarget);
  if(!target){ toast('请先选主宠物'); return; }
  const mats = state.petLevelupMaterials
    .map(uid => state.petInv.find(p => p.uid === uid))
    .filter(Boolean);
  if(!mats.length){ toast('请选择材料宠物'); return; }

  let totalExp = 0;
  for(const m of mats) totalExp += petAbsorbExp(target, m);

  const matUids = mats.map(m => m.uid);
  state.petInv = state.petInv.filter(p => !matUids.includes(p.uid));

  target.exp = (target.exp || 0) + totalExp;
  let upCount = 0;
  while(true){
    const need = petExpNeed(target.quality);
    if(target.exp < need) break;
    const idx = PET_QUALITIES.findIndex(q => q.id === target.quality);
    if(idx < 0 || idx >= PET_QUALITIES.length - 1) break;
    target.exp -= need;
    target.quality = PET_QUALITIES[idx + 1].id;
    upCount++;
  }
  if(target.quality === PET_QUALITIES[PET_QUALITIES.length - 1].id) target.exp = 0;

  state.petLevelupMaterials = [];

  beep(800, .15, 'sine', .06);
  setTimeout(() => beep(1200, .2, 'sine', .06), 100);
  if(upCount) setTimeout(() => beep(1600, .3, 'sine', .055), 220);
  burst('#7dc4ff', 60);
  if(upCount){ burst('#ffd86b', 80); shake(6); }
  toast('⬆️ 吸收完成！获得 ' + totalExp + ' 经验' +
    (upCount ? '，品质提升 ' + upCount + ' 档！' : ''));

  updateHUD();
  renderPetPage();
  updatePetFab();
  checkAchievements();
}

const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 0) return '-' + fmt(-n);
  if(n < 1) return n.toFixed(2);
  if(n < 1000) return Math.floor(n).toLocaleString('en-US');
  let t = 0;
  while(n >= 1000 && t < SUF.length - 1){ n /= 1000; t++; }
  return n.toFixed(2) + SUF[t];
}
function pickFrom(list){
  const total = list.reduce((s,r) => s + r.w, 0);
  let x = Math.random() * total;
  for(const r of list){ x -= r.w; if(x <= 0) return r; }
  return list[list.length - 1];
}
function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function getEvent(){
  if(!state.event || state.event === 'none') return EVENTS[0];
  const e = EVENTS.find(x => x.id === state.event);
  if(!e) return EVENTS[0];
  if(Date.now() > state.eventUntil) return EVENTS[0];
  return e;
}
function rollEvent(manual){
  const pool = EVENTS.filter(e => e.id !== 'none');
  const ev = pool[Math.floor(Math.random() * pool.length)];
  state.event = ev.id;
  state.eventUntil = Date.now() + ev.dur * 1000;
  markDirty();

    beep(1300, .2, 'sine', .06);

}

function getSaveData(){
  return {

    tree: state.tree,

    petInv: state.petInv,
    petEquipped: state.petEquipped,
    inv: state.inv,
    recent: (state.recent || []).map(r => ({
      b: r.base.id,
      a: (r.affixes || []).map(x => x.id)
    })),
    potionStock: state.potionStock.map(p => ({ uid:p.uid, tpl:p.tpl, price:p.price })),
    daily: state.daily,
    rechargeUnlocked: state.rechargeUnlocked,
    stats: state.stats,
    unlockedAch: state.unlockedAch,
    sound: state.sound,
    event: state.event, eventUntil: state.eventUntil
  };
}

function applySaveData(d){
  if(!d || typeof d !== 'object') return false;
  const num = (v, def) => (typeof v === 'number' && isFinite(v)) ? v : def;

  state.coins     = num(d.coins, state.coins);
  state.gems      = num(d.gems, state.gems);
  state.rolls     = num(d.rolls, state.rolls);
  state.rollCount = num(d.rollCount, state.rollCount);
  state.pity      = num(d.pity, state.pity);
  state.rebirths  = Math.max(0, Math.floor(num(d.rebirths, 0)));
  state.ascends   = Math.max(0, Math.floor(num(d.ascends, 0)));
  state.transcends= Math.max(0, Math.floor(num(d.transcends, 0)));
  if(typeof d.sound === 'boolean') state.sound = d.sound;
  if(typeof d.rechargeUnlocked === 'boolean') state.rechargeUnlocked = d.rechargeUnlocked;
  if(typeof d.event === 'string') state.event = d.event;
  if(typeof d.eventUntil === 'number') state.eventUntil = d.eventUntil;

  let refundGems = 0;
  if(d.pets && typeof d.pets === 'object' && !Array.isArray(d.petInv)){
    for(const id of Object.keys(d.pets)){
      if(OLD_PET_PRICES[id] !== undefined && d.pets[id]){
        refundGems += OLD_PET_PRICES[id];
      }
    }
    if(refundGems > 0){
      refundGems = Math.floor(refundGems * 1.5);
      state.gems += refundGems;
      setTimeout(() => toast('🎁 旧宠物已返还 ' + fmt(refundGems) + ' 钻石'), 900);
    }
  }

  if(Array.isArray(d.petInv)){
    state.petInv = d.petInv.filter(p => p && typeof p === 'object' && PET_QUALITIES.some(q => q.id === p.quality))
      .map(p => {
        let spId = p.species;
        if(!PET_SPECIES.some(s => s.id === spId)) spId = rollSpecies();
        const sp = getSpecies(spId);
        return {
          uid: p.uid || ('pet_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)),
          species: sp.id,
          quality: p.quality,
          star: Math.max(sp.minStar, Math.min(MAX_STAR, Math.floor(num(p.star, 1)))),
          exp: Math.max(0, Math.floor(num(p.exp, 0))),
          shiny: !!p.shiny
        };
      });
  } else {
    state.petInv = [];
  }
  if(Array.isArray(d.petEquipped)){
    state.petEquipped = d.petEquipped.filter(uid => state.petInv.some(p => p.uid === uid)).slice(0, MAX_PETS);
  } else {
    state.petEquipped = [];
  }

  if(d.tree && typeof d.tree === 'object'){
    const t = {};
    for(const k of Object.keys(d.tree)){
      if(TREE.some(n => n.id === k) && typeof d.tree[k] === 'number'){
        t[k] = Math.max(0, Math.floor(d.tree[k]));
      }
    }
    if(!t.root) t.root = 1;
    state.tree = t;
  }

  /* ═══ 永久树 ═══ */
  if(d.ptree && typeof d.ptree === 'object'){
    const t = {};
    for(const k of Object.keys(d.ptree)){
      if(PERMA_TREE.some(n => n.id === k) && typeof d.ptree[k] === 'number'){
        t[k] = Math.max(0, Math.floor(d.ptree[k]));
      }
    }
    if(!t.PROOT) t.PROOT = 1;
    state.ptree = t;
  }

  if(d.inv && typeof d.inv === 'object'){
    const iv = {};
    for(const r of RARITIES) iv[r.id] = Math.max(0, Math.floor(num(d.inv[r.id], 0)));
    state.inv = iv;
  }
  if(Array.isArray(d.recent)){
    state.recent = d.recent.map(r => {
      if(!r || typeof r !== 'object') return null;
      const base = RARITIES.find(x => x.id === r.b);
      if(!base) return null;
      const affixes = Array.isArray(r.a)
        ? r.a.map(id => AFFIXES.find(x => x.id === id)).filter(Boolean)
        : [];
      return { base, affixes };
    }).filter(Boolean).slice(0, 24);
  }
  if(Array.isArray(d.potionStock)){
    state.potionStock = d.potionStock.filter(p => p && typeof p === 'object' && p.tpl && p.tpl.name)
      .map(p => ({
        uid: p.uid || ('pot_' + Date.now() + '_' + Math.random()),
        tpl: p.tpl,
        price: Math.max(1, Math.floor(num(p.price, 100)))
      }))
      .slice(0, 3);
  }
  if(d.daily && d.daily.date && Array.isArray(d.daily.tasks)){
    const today = new Date().toDateString();
    if(d.daily.date === today) state.daily = d.daily;
  }
  if(d.stats && typeof d.stats === 'object'){
    const s = state.stats;
    const keys = ['totalAffix','totalDouble','shinyCommon','shinyCommonDouble','chaoticCommon',
                  'goldDice','diamondDice','emeraldDice','rainbowDice'];
    for(const k of keys) s[k] = Math.max(0, Math.floor(num(d.stats[k], 0)));
  }
  if(d.unlockedAch && typeof d.unlockedAch === 'object'){
    const u = {};
    for(const k of Object.keys(d.unlockedAch)){
      if(ACHIEVEMENTS.some(a => a.id === k)) u[k] = d.unlockedAch[k] || Date.now();
    }
    state.unlockedAch = u;
  }
  state.buffs = [];
  return true;
}

function exportSave(){
  try{
    const json = JSON.stringify(getSaveData(), null, 2);
    const blob = new Blob([json], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const d = new Date();
    const dt = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    a.download = '沙杨马RNG存档_' + dt + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('📤 存档文件已导出');
    beep(1100, .15, 'sine', .05);
  }catch(e){ toast('❌ 导出失败'); }
}
function importSaveFromFile(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        if(applySaveData(JSON.parse(ev.target.result))){
          saveGame(); renderAll();
          toast('📥 存档导入成功');
          beep(1100, .18, 'sine', .06);
          setTimeout(() => beep(1500, .25, 'sine', .05), 130);
          burst('#00ff88', 80);
        }else toast('❌ 存档格式错误');
      }catch(err){ toast('❌ 存档解析失败'); }
    };
    reader.onerror = () => toast('❌ 文件读取失败');
    reader.readAsText(file);
  };
  input.click();
}
function copySaveToClipboard(){
  let json;
  try{ json = JSON.stringify(getSaveData()); }catch(e){ toast('❌ 序列化失败'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(() => {
      toast('📋 存档已复制到剪贴板');
      beep(1000, .12, 'sine', .05);
    }).catch(() => legacyCopy(json));
  }else legacyCopy(json);
}
function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    toast(ok ? '📋 存档已复制到剪贴板' : '❌ 复制失败，请手动导出');
  }catch(e){ toast('❌ 复制失败'); }
}
function pasteSaveFromClipboard(){
  if(!navigator.clipboard || !navigator.clipboard.readText){
    toast('❌ 浏览器不支持剪贴板读取'); return;
  }
  navigator.clipboard.readText().then(text => {
    try{
      if(applySaveData(JSON.parse(text))){
        saveGame(); renderAll();
        toast('📄 已从剪贴板导入存档');
        beep(1100, .18, 'sine', .06);
        setTimeout(() => beep(1500, .25, 'sine', .05), 130);
        burst('#00ff88', 80);
      }else toast('❌ 剪贴板内容不是有效存档');
    }catch(e){ toast('❌ 剪贴板内容不是有效 JSON'); }
  }).catch(() => toast('❌ 无法读取剪贴板（请允许权限）'));
}

/* ═══════════ 树操作（普通 + 永久 通用） ═══════════ */
function treeLv(id){ return state.tree[id] || 0; }
function ptreeLv(id){ return state.ptree[id] || 0; }
function nodeLv(n){ return n.perma ? ptreeLv(n.id) : treeLv(n.id); }

function nodeCost(n){
  if(n.id === 'root' || n.id === 'PROOT') return 0;
  return Math.floor(n.base * Math.pow(n.growth, nodeLv(n)));
}
function treeCost(n){ return nodeCost(n); }

function nodeIsUnlocked(n){
  if(n.id === 'root' || n.id === 'PROOT') return true;
  return n.req.every(r => {
    if(r === 'root' || r === 'PROOT') return true;
    const ref = ALL_NODES.find(x => x.id === r);
    if(!ref) return false;
    return ref.perma ? ptreeLv(r) >= 1 : treeLv(r) >= 1;
  });
}
function isUnlocked(n){ return nodeIsUnlocked(n); }

function getPityMax(){
  const lv = treeLv('PY1') + treeLv('PY2') + treeLv('PY3') +
             treeLv('PY4') + treeLv('PY5') + treeLv('PY6');
  if(lv === 0) return null;
  return PITY_TABLE[Math.min(lv, 6)];
}

/* ═══════════ 新增效果计算 ═══════════ */
function getPetPermaMult(){
  let v = 1;
  v += treeLv('P1') * 0.05;
  v += treeLv('P2') * 0.10;
  v += treeLv('P3') * 0.25;
  v += ptreeLv('PP1') * 0.15;
  v += ptreeLv('PP2') * 0.30;
  v += ptreeLv('PP3') * 0.60;
  return v;
}
function getMultiRollChance(){
  let c = 0;
  c += treeLv('M1') * 0.005;
  c += treeLv('M2') * 0.008;
  c += treeLv('M3') * 0.012;
  c += treeLv('ME') * 0.030;
  c += ptreeLv('PM1') * 0.05;
  return Math.min(0.75, c);
}

function getTierCost(tier){
  const disc = 1 - Math.min(0.50, ptreeLv('PR5') * 0.02);
  if(tier.id === 'rebirth')   return Math.floor(tier.baseCost * Math.pow(tier.costGrowth, state.rebirths)   * disc);
  if(tier.id === 'ascend')    return Math.floor(tier.baseCost * Math.pow(tier.costGrowth, state.ascends)    * disc);
  if(tier.id === 'transcend') return Math.floor(tier.baseCost * Math.pow(tier.costGrowth, state.transcends) * disc);
  return Infinity;
}
function getLuckMult(){
  let v = 1;
  v += treeLv('L1')  * 0.03;
  v += treeLv('L2')  * 0.06;
  v += treeLv('L3')  * 0.12;
  v += treeLv('LC')  * 0.25;
  v += treeLv('LC2') * 0.50;
  v += treeLv('LE')  * 1.00;
  v += state.rebirths   * 0.15;
  v += state.ascends    * 2;
  v += state.transcends * 20;
  v += ptreeLv('PR3')   * 2;             /* 永久幸运 */
  for(const b of state.buffs) if(b.luck) v += b.luck;
  const ev = getEvent();
  if(ev.luck) v += ev.luck;
  v += getPetTraits().luck;
  return v;
}
function getCoinMult(){
  let v = 1;
  v += treeLv('V1')  * 0.10;
  v += treeLv('V2')  * 0.20;
  v += treeLv('V3')  * 0.35;
  v += treeLv('VG')  * 0.75;
  v += treeLv('VG2') * 1.50;
  v += treeLv('VE')  * 3.00;
  /* 重生乘算（含普通 / 永久强化） */
  v *= 1 + state.rebirths   * (0.75 + ptreeLv('PR1') * 0.20);
  v *= 1 + state.ascends    * (5    + ptreeLv('PR2') * 0.40);
  v *= 1 + state.transcends * (50   + ptreeLv('PR4') * 0.50);
  for(const uid of state.petEquipped){
    const p = state.petInv.find(x => x.uid === uid);
    if(p) v *= petMult(p);
  }
  v *= (1 + getPetTraits().coin);
  v *= getPetPermaMult();             /* 宠物倍率永久加成 */
  for(const b of state.buffs) if(b.coinMult) v *= b.coinMult;
  const ev = getEvent();
  if(ev.coinMult) v *= ev.coinMult;
  return v;
}
function getAutoInterval(){
  let r = 0;
  r += treeLv('S1')  * 5;
  r += treeLv('S2')  * 8;
  r += treeLv('S3')  * 12;
  r += treeLv('SA')  * 15;
  r += treeLv('SA2') * 20;
  r += treeLv('SE')  * 25;
  let base = Math.max(55, 900 - r);
  let m = 1;
  for(const b of state.buffs) if(b.speedMult) m *= b.speedMult;
  const ptSpeed = getPetTraits().speed;
  if(ptSpeed > 0) m *= Math.max(0.1, 1 - ptSpeed);
  return Math.max(30, base * m);
}
function getDiceInfo(){
  const ev = getEvent();
  const evMult = ev.diceMult || 1;
  const pMult = 1 + ptreeLv('PD1') * 0.10 + ptreeLv('PD2') * 0.20;   /* 永久骰子加成 */
  return {
    gold:    (2.5 + treeLv('D1') * 0.5 + treeLv('D2') * 1.0 + treeLv('D3') * 2.5) * evMult * pMult,
    diamond: (10  + treeLv('DD2') * 10 + treeLv('DD3') * 25) * evMult * pMult,
    emerald: (50  + treeLv('DE2') * 50) * evMult * pMult,
    rainbow: 250 * evMult * pMult
  };
}
function getDiceType(n){
  if(treeLv('DR') >= 1 && n % DICE_INTERVAL.rainbow === 0) return 'rainbow';
  if(treeLv('DE') >= 1 && n % DICE_INTERVAL.emerald === 0) return 'emerald';
  if(treeLv('DD') >= 1 && n % DICE_INTERVAL.diamond === 0) return 'diamond';
  if(n % DICE_INTERVAL.gold === 0) return 'gold';
  return null;
}
function nextDiceIn(){
  const c = state.rollCount || 0;
  const list = [{ n: DICE_INTERVAL.gold - (c % DICE_INTERVAL.gold), key:'gold' }];
  if(treeLv('DD') >= 1) list.push({ n: DICE_INTERVAL.diamond - (c % DICE_INTERVAL.diamond), key:'diamond' });
  if(treeLv('DE') >= 1) list.push({ n: DICE_INTERVAL.emerald - (c % DICE_INTERVAL.emerald), key:'emerald' });
  if(treeLv('DR') >= 1) list.push({ n: DICE_INTERVAL.rainbow - (c % DICE_INTERVAL.rainbow), key:'rainbow' });
  list.sort((a,b) => a.n - b.n);
  return list[0];
}
function buildPool(){
  const lm = Math.max(1, getLuckMult());
  /* K 越小越猛。K=8 时，几百幸运就能爆顶级 */
  const K = 8;
  return RARITIES.map((r, i) => ({
    ref: r,
    w: r.w * Math.pow(lm, i / K)
  }));
}
function getAffixBonus(){
  let v = 0;
  v += treeLv('A1') * 0.015;
  v += treeLv('A2') * 0.025;
  for(const b of state.buffs) if(b.affixBonus) v += b.affixBonus;
  const ev = getEvent();
  if(ev.affixBonus) v += ev.affixBonus;
  v += getPetTraits().affix;
  return v;
}
function getDoubleAffixBonus(){ return treeLv('A3') * 0.015; }

function rollAffixes(){
  const bonus = getAffixBonus();
  const r = Math.random();
  let count = 0;
  const p2 = 0.03 + getDoubleAffixBonus();
  const p1 = 0.20 + bonus * 1.5;
  if(r < p2) count = 2;
  else if(r < p1) count = 1;
  else return [];
  const picked = [];
  const pool = AFFIXES.slice();
  for(let i = 0; i < count; i++){
    if(!pool.length) break;
    const sel = pickFrom(pool.map(a => ({ ref:a, w:a.w }))).ref;
    picked.push(sel);
    pool.splice(pool.indexOf(sel), 1);
  }
  return picked;
}
function fullName(base, affixes){
  if(!affixes || !affixes.length) return base.name + '沙杨马';
  return affixes.map(a => a.name).join('·') + base.name + '沙杨马';
}
function fullNameHTML(base, affixes){
  if(!affixes || !affixes.length){
    return '<span style="color:' + base.color + '">' + base.name + '沙杨马</span>';
  }
  let s = '';
  affixes.forEach(a => {
    s += '<span style="color:' + a.color + ';text-shadow:0 0 14px ' + a.color + '">' + a.name + '</span>';
    s += '<span class="sep">·</span>';
  });
  s += '<span style="color:' + base.color + '">' + base.name + '沙杨马</span>';
  return s;
}
function affixMult(affixes){
  if(!affixes || !affixes.length) return 1;
  let m = 1;
  for(const a of affixes) m *= a.mult;
  /* ⚡ 词条价值线加成（普通树，重生会清） */
  m *= 1 + treeLv('AF1') * 0.05 + treeLv('AF2') * 0.10 + treeLv('AF3') * 0.20;
  return m;
}
function rollFull(){
  const pmax = getPityMax();
  let base;
  if(pmax !== null && state.pity >= pmax){
    base = pickFrom(RARITIES.slice(3).map(r => ({ ref:r, w:r.w }))).ref;
  }else{
    base = pickFrom(buildPool()).ref;
  }
  return { base, affixes: rollAffixes() };
}

let audioCtx = null;
function beep(freq, dur, type, vol){
  if(!state.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(vol || .05, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }catch(e){}
}

const canvas = $('#fx');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
const particles = [];
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();
function burst(color, count, cx, cy){
  let x = cx, y = cy;
  if(x === undefined){
    const el = $('#diceHint');
    const r = el ? el.getBoundingClientRect() : { left: W/2-100, top: H/2-100, width:200, height:200 };
    x = r.left + r.width / 2; y = r.top + r.height / 2 - 40;
  }
  for(let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 1.5 + Math.random() * 8;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, life: 1, decay: .008 + Math.random() * .022, size: 1.5 + Math.random() * 4.5, color });
  }
}
function fxLoop(){
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += .12;
    p.vx *= .992; p.vy *= .992;
    p.life -= p.decay;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(fxLoop);
}
fxLoop();

function buyPotion(uid){
  const idx = state.potionStock.findIndex(p => p.uid === uid);
  if(idx < 0) return;
  const item = state.potionStock[idx];

    toast('金币不足，需要 💰' + fmt(item.price));
    beep(200, .12, 'square', .04);
    return;
  }
  state.coins -= item.price;
  applyPotion(item.tpl);
  state.potionStock.splice(idx, 1);
  const used = state.potionStock.map(p => p.tpl.name);
  const remain = POTION_POOL.filter(p => !used.includes(p.name));
  const next = remain[Math.floor(Math.random() * remain.length)] || POTION_POOL[0];
  state.potionStock.push({ uid: 'pot_' + Date.now() + '_new', tpl: next, price: Math.max(100, Math.floor(next.base * (0.85 + Math.random() * 0.35))) });
  updateHUD(); renderShopPage();

    return '<span class="hchip" style="--c:' + c + '">' + r.base.id + star + '</span>';
  }).join('');
}

const BASE_GAP_X = 118, BASE_GAP_Y = 100, BASE_PAD = 40;
const TREE_MIN = 0.30, TREE_MAX = 2.0;

function showNodeTip(node, clientX, clientY){
  if(!tipEl) return;
  const id = node.dataset.node;
  const n = ALL_NODES.find(x => x.id === id);
  if(!n) return;
  const lv = nodeLv(n);
  const unlocked = nodeIsUnlocked(n);
  const maxed = lv >= n.max;
  const lvClass = maxed ? ' max' : '';
  const lvStr = (n.id === 'root' || n.id === 'PROOT') ? '起点'
              : (n.max === 1 ? (lv >= 1 ? '已解锁' : '未解锁') : (lv + ' / ' + n.max));
  let html = '<div class="nt-head">' +
    '<span class="nt-emoji">' + n.emoji + '</span>' +
    '<span class="nt-name">' + esc(n.name) + (n.perma ? ' <span style="color:#ffc93c;font-size:11px">永久</span>' : '') + '</span>' +
    '<span class="nt-lv' + lvClass + '">' + lvStr + '</span></div>';
  html += '<div class="nt-desc">' + esc(n.desc) + '</div>';
  if(lv > 0){
    const effs = getNodeEffects(n);
    if(effs.length){
      html += '<div class="nt-row"><span class="lb">当前加成</span></div>';
      for(const e of effs){
        html += '<div class="nt-row"><span class="vl green">' + esc(e) + '</span></div>';
      }
    }
  }
  if(n.id === 'root' || n.id === 'PROOT'){}
  else if(maxed){
    html += '<div class="nt-row"><span class="lb">状态</span><span class="vl">已满级</span></div>';
  } else if(!unlocked){
    const missing = n.req.filter(r => {
      if(r === 'root' || r === 'PROOT') return false;
      const ref = ALL_NODES.find(x => x.id === r);
      if(!ref) return false;
      return (ref.perma ? ptreeLv(r) : treeLv(r)) < 1;
    }).map(r => { const p = ALL_NODES.find(x => x.id === r); return p ? p.name : r; }).join('、');
    html += '<div class="nt-row"><span class="lb">🔒 需要先解锁</span><span class="vl red">' + esc(missing) + '</span></div>';
  } else {
    const cost = nodeCost(n);
    const can = state.coins >= cost;
    html += '<div class="nt-row"><span class="lb">下一级价格</span><span class="vl ' + (can ? '' : 'red') + '">💰 ' + fmt(cost) + '</span></div>';
  }
  html += '<div class="nt-hint">' + (n.perma ? '永久节点 · 重生不清空' : '点击节点即可升级') + '</div>';
  tipEl.innerHTML = html;
  tipEl.classList.add('on');
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = clientX + 16, y = clientY + 16;
  if(x + tw > window.innerWidth - 8) x = clientX - tw - 16;
  if(y + th > window.innerHeight - 8) y = clientY - th - 16;
  if(x < 8) x = 8;
  if(y < 8) y = 8;
  tipEl.style.left = x + 'px';
  tipEl.style.top  = y + 'px';
}
function hideNodeTip(){ if(tipEl) tipEl.classList.remove('on'); }

function applyTreeTranslate(){
  if(!treeCanvas) return;
  treeCanvas.style.transform = 'translate3d(' + treeView.x + 'px,' + treeView.y + 'px,0)';
}
function renderTreeContent(){
  if(!treeCanvas) return;
  hideNodeTip();
  const s = treeView.scale;
  const nodeW = Math.round(BASE_NODE_W * s);
  const nodeH = Math.round(BASE_NODE_H * s);
  const gapX  = Math.round(BASE_GAP_X * s);
  const gapY  = Math.round(BASE_GAP_Y * s);
  const pad   = Math.round(BASE_PAD * s);
  const maxCol = Math.max(...ALL_NODES.map(n => n.col));
  const maxRow = Math.max(...ALL_NODES.map(n => n.row));
  const TW = maxCol * gapX + nodeW + pad * 2;
  const TH = maxRow * gapY + nodeH + pad * 2;
  treeCanvas.style.width  = TW + 'px';
  treeCanvas.style.height = TH + 'px';
  const fsEmoji = Math.max(11, 17 * s);
  const fsName  = Math.max(7.5, 10 * s);
  const fsFoot  = Math.max(6.5, 8.5 * s);
  const padItem = Math.max(2, 4 * s);
  let svg = '<svg class="tree-svg" width="' + TW + '" height="' + TH + '">';
  let html = '';
  for(const n of ALL_NODES){
    const lv = nodeLv(n);
    const unlocked = nodeIsUnlocked(n);
    const nx = n.col * gapX + pad + nodeW / 2;
    const ny = n.row * gapY + pad + nodeH / 2;
    for(const rid of n.req){
      const p = ALL_NODES.find(x => x.id === rid);
      if(!p) continue;
      const px = p.col * gapX + pad + nodeW / 2;
      const py = p.row * gapY + pad + nodeH / 2;
      const active = unlocked || lv > 0;
      const stroke = active ? 'rgba(90,180,255,.65)' : 'rgba(255,255,255,.10)';
      svg += '<line x1="' + px + '" y1="' + py + '" x2="' + nx + '" y2="' + ny +
             '" stroke="' + stroke + '" stroke-width="' + Math.max(1.5, 3 * s) +
             '" stroke-linecap="round"/>';
    }
  }
  for(const n of ALL_NODES){
    const lv = nodeLv(n);
    const unlocked = nodeIsUnlocked(n);
    const nx = n.col * gapX + pad;
    const ny = n.row * gapY + pad;
    let cls = 'tnode';
    if(n.id === 'root' || n.id === 'PROOT') cls += ' maxed';
    else if(lv >= n.max) cls += ' maxed';
    else if(!unlocked) cls += ' locked';
    else if(lv > 0) cls += ' owned';
    else cls += ' avail';
    if(n.id.indexOf('PY') === 0) cls += ' pity-node';
    if(n.perma) cls += ' perma-node';
    let foot;
    if(n.id === 'root') foot = '起点';
    else if(n.id === 'PROOT') foot = '永久';
    else if(lv >= n.max) foot = 'MAX';
    else foot = '💰' + fmt(nodeCost(n));
    const lvTxt = (n.id === 'root' || n.id === 'PROOT' || n.max === 1) ? '' : ('Lv.' + lv + '/' + n.max + ' · ');
    html += '<div class="' + cls + '" data-node="' + n.id + '"' +
              ' style="left:' + nx + 'px;top:' + ny + 'px;' +
                     'width:' + nodeW + 'px;height:' + nodeH + 'px;' +
                     'padding:' + padItem + 'px;' +
                     'border-radius:' + Math.max(8, 14 * s) + 'px;' +
                     'border-width:' + Math.max(1, 1.5 * s) + 'px">' +
              '<div class="tn-emoji" style="font-size:' + fsEmoji + 'px">' + n.emoji + '</div>' +
              '<div class="tn-name" style="font-size:' + fsName + 'px">' + esc(n.name) + '</div>' +
              '<div class="tn-foot" style="font-size:' + fsFoot + 'px">' + lvTxt + foot + '</div>' +
            '</div>';
  }
  svg += '</svg>';
  treeCanvas.innerHTML = svg + html;
  applyTreeTranslate();
  if(treeZoomLvlEl) treeZoomLvlEl.textContent = Math.round(s * 100) + '%';
}
function computeFitScale(){
  const vw = treeViewport.clientWidth;
  const vh = treeViewport.clientHeight;
  const maxCol = Math.max(...ALL_NODES.map(n => n.col));
  const maxRow = Math.max(...ALL_NODES.map(n => n.row));
  const BW = maxCol * BASE_GAP_X + BASE_NODE_W + BASE_PAD * 2;
  const BH = maxRow * BASE_GAP_Y + BASE_NODE_H + BASE_PAD * 2;
  let s = Math.min(vw / BW, vh / BH) * 0.94;
  return Math.max(TREE_MIN, Math.min(TREE_MAX, s));
}
function resetTreeView(noRender){
  if(!treeViewport || !treeCanvas) return;
  const vw = treeViewport.clientWidth;
  const vh = treeViewport.clientHeight;
  treeView.scale = computeFitScale();
  const s = treeView.scale;
  const maxCol = Math.max(...ALL_NODES.map(n => n.col));
  const maxRow = Math.max(...ALL_NODES.map(n => n.row));
  const TW = maxCol * BASE_GAP_X * s + BASE_NODE_W * s + BASE_PAD * s * 2;
  const TH = maxRow * BASE_GAP_Y * s + BASE_NODE_H * s + BASE_PAD * s * 2;
  treeView.x = (vw - TW) / 2;
  treeView.y = (vh - TH) / 2;
  if(!noRender) renderTreeContent();
}
function treeSetScale(newScale, anchorX, anchorY){
  if(!treeViewport) return;
  newScale = Math.max(TREE_MIN, Math.min(TREE_MAX, newScale));
  if(Math.abs(newScale - treeView.scale) < 0.001) return;
  if(anchorX === undefined){ anchorX = treeViewport.clientWidth / 2; anchorY = treeViewport.clientHeight / 2; }
  const k = newScale / treeView.scale;
  treeView.x = anchorX - (anchorX - treeView.x) * k;
  treeView.y = anchorY - (anchorY - treeView.y) * k;
  treeView.scale = newScale;
  renderTreeContent();
}
function treeZoom(factor, anchorX, anchorY){ treeSetScale(treeView.scale * factor, anchorX, anchorY); }

let draggedSinceDown = false;
function bindTreeControls(){
  if(!treeViewport) return;
  treeViewport.addEventListener('mousemove', e => {
    if(draggedSinceDown) return;
    const node = e.target.closest('.tnode');
    if(!node){ hideNodeTip(); return; }
    showNodeTip(node, e.clientX, e.clientY);
  });
  treeViewport.addEventListener('mouseleave', hideNodeTip);

  let dragging = false, lastX = 0, lastY = 0;
  treeViewport.addEventListener('mousedown', e => {
    if(e.button !== 0) return;
    if(e.target.closest('.tree-ctrl')) return;
    dragging = true; draggedSinceDown = false;
    lastX = e.clientX; lastY = e.clientY;
    treeViewport.classList.add('grabbing');
    hideNodeTip();
  });
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if(Math.abs(dx) + Math.abs(dy) > 3) draggedSinceDown = true;
    treeView.x += dx; treeView.y += dy;
    lastX = e.clientX; lastY = e.clientY;
    applyTreeTranslate();
    hideNodeTip();
  });
  window.addEventListener('mouseup', () => {
    if(dragging) setTimeout(() => { draggedSinceDown = false; }, 0);
    dragging = false;
    treeViewport.classList.remove('grabbing');
  });
  treeViewport.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = treeViewport.getBoundingClientRect();
    treeZoom(e.deltaY < 0 ? 1.08 : 1/1.08, e.clientX - rect.left, e.clientY - rect.top);
    hideNodeTip();
  }, { passive: false });

  let touchMode = null, touchStart = null, pinchStart = null;
  treeViewport.addEventListener('touchstart', e => {
    if(e.target.closest('.tree-ctrl')) return;
    hideNodeTip();
    if(e.touches.length === 1){
      touchMode = 'drag'; draggedSinceDown = false;
      touchStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, vx:treeView.x, vy:treeView.y };
    } else if(e.touches.length === 2){
      touchMode = 'pinch';
      const rect = treeViewport.getBoundingClientRect();
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      pinchStart = { cx, cy, dist, scale:treeView.scale, vx:treeView.x, vy:treeView.y };
    }
  }, { passive: true });
  treeViewport.addEventListener('touchmove', e => {
    if(touchMode === 'drag' && e.touches.length === 1){
      const dx = e.touches[0].clientX - touchStart.x;
      const dy = e.touches[0].clientY - touchStart.y;
      if(Math.abs(dx) + Math.abs(dy) > 4) draggedSinceDown = true;
      treeView.x = touchStart.vx + dx;
      treeView.y = touchStart.vy + dy;
      applyTreeTranslate();
      e.preventDefault();
    } else if(touchMode === 'pinch' && e.touches.length === 2){
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      let newScale = pinchStart.scale * (dist / pinchStart.dist);
      newScale = Math.max(TREE_MIN, Math.min(TREE_MAX, newScale));
      const k = newScale / pinchStart.scale;
      treeView.x = pinchStart.cx - (pinchStart.cx - pinchStart.vx) * k;
      treeView.y = pinchStart.cy - (pinchStart.cy - pinchStart.vy) * k;
      if(Math.abs(newScale - treeView.scale) > 0.002){
        treeView.scale = newScale;
        renderTreeContent();
      }
      e.preventDefault();
    }
  }, { passive: false });
  treeViewport.addEventListener('touchend', e => {
    if(e.touches.length === 0){
      setTimeout(() => { draggedSinceDown = false; }, 100);
      touchMode = null;
    } else if(e.touches.length === 1 && touchMode === 'pinch'){
      touchMode = 'drag';
      touchStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, vx:treeView.x, vy:treeView.y };
    }
  });

  $('#treeZoomIn').addEventListener('click', e => { e.stopPropagation(); treeZoom(1.18); beep(760, .05, 'sine', .025); });
  $('#treeZoomOut').addEventListener('click', e => { e.stopPropagation(); treeZoom(1/1.18); beep(500, .05, 'sine', .025); });
  $('#treeReset').addEventListener('click', e => { e.stopPropagation(); resetTreeView(); beep(600, .08, 'sine', .03); });
  window.addEventListener('resize', () => { if(state.page === 'tree') resetTreeView(); });
}

  }
  if(st === 'potions'){
    if(!state.potionStock.length) state.potionStock = genPotionStock();
    h += '<div class="merchant"><div class="m-emoji">🧙</div>' +
      '<div>神秘的药水商人 · 每次购买后货架会补货，货品随机生成</div></div>';
    h += '<div class="shop-grid">';
    for(const it of state.potionStock){
      const t = it.tpl;
      const can = state.coins >= it.price;
      const desc = t.gems ? ('立即获得 💎' + t.gems)
        : (t.luck ? ('幸运 +' + t.luck + '（' + t.dur + '秒）')
        : (t.coinMult ? ('金币倍率 x' + t.coinMult + '（' + t.dur + '秒）')
        : (t.affixBonus ? ('词条出现率 +' + Math.round(t.affixBonus * 100) + '%（' + t.dur + '秒）')
        : ('自动间隔 x' + t.speedMult + '（' + t.dur + '秒）'))));
      h += '<div class="shop-item"><div class="si-emoji">' + t.emoji + '</div>' +
        '<div class="si-name">' + esc(t.name) + '</div>' +
        '<div class="si-desc">' + esc(desc) + '</div>' +
        '<button class="si-price ' + (can ? 'can-gold' : '') + '" data-potion="' + it.uid + '"' +
          (can ? '' : ' disabled') + '>💰 ' + fmt(it.price) + '</button></div>';
    }
    h += '</div>';
  }
  $('#pageShop').innerHTML = h;
}

function renderPetPage(){
  const sub = state.petTab || 'draw';

  let totalMult = 1;
  for(const p of equipped) totalMult *= petMult(p);

  h += '<div class="card"><div class="card-head">🐾 装备槽 ' + equipped.length + ' / ' + MAX_PETS +
       ' · 基础倍率 x' + fmt(totalMult) + '</div>';
  h += '<div class="card-body" style="padding:10px">';
  h += '<div class="equip-row">';
  for(let i = 0; i < MAX_PETS; i++){

    if(p){
      const q = getQuality(p.quality);
      const sp = getSpecies(p.species);
      h += '<div class="equip-slot filled" data-unequip="' + p.uid + '" style="--qc:' + q.color + '">' +
        '<div class="es-emoji">' + sp.emoji + '</div>' +
        '<div class="es-info">' + q.id + ' · ' + (p.shiny ? '✨' : '') + esc(sp.name) + '</div>' +
        '<div class="es-mult">x' + fmt(petMult(p)) + '</div>' +
      '</div>';
    }else{
      h += '<div class="equip-slot empty">空槽</div>';
    }
  }
  h += '</div>';

  const tr = getPetTraits();
  const trLines = [];
  for(const k of ['coin','gem','luck','affix','speed']){
    if(tr[k]){
      const label = PET_TRAIT_NAMES[k];
      const val = k === 'luck' ? ('+' + tr[k].toFixed(1)) : ('+' + (tr[k] * 100).toFixed(1) + '%');
      trLines.push(label + val);
    }
  }
  if(trLines.length){
    h += '<div style="margin-top:9px;padding:8px 10px;border-radius:10px;background:rgba(0,255,200,.06);border:1px solid rgba(0,255,200,.2);font-size:11.5px;font-weight:800;color:#8ff0c4;line-height:1.6">' +
      '✦ 装备特质：' + trLines.join(' · ') + '</div>';

  h += '</div></div>';

  if(sub === 'draw') h += renderPetDraw();
  else if(sub === 'bag') h += renderPetBag();
  else if(sub === 'levelup') h += renderPetLevelup();
  else h += renderPetInfo();

  $('#pagePet').innerHTML = h;
}

function renderPetDraw(){

  h += '</div></div>';

  h += '<div class="card"><div class="card-head">📊 抽取概率</div><div class="card-body">';
  const totalW = Object.values(PET_QUALITY_WEIGHTS).reduce((a,b) => a+b, 0);

}

function renderPetBag(){
  let h = '<div class="card"><div class="card-head">🎒 我的宠物（' + state.petInv.length + ' 只）</div>';
  h += '<div class="card-body">';

  if(!state.petInv.length){
    h += '<div class="empty">还没有宠物<br>去抽取页抽一只吧</div>';
    h += '</div></div>';
    return h;
  }

  const sorted = state.petInv.slice().sort((a, b) => {
    if(b.star !== a.star) return b.star - a.star;
    if(!!b.shiny !== !!a.shiny) return b.shiny ? 1 : -1;
    return PET_QUALITIES.indexOf(getQuality(b.quality)) - PET_QUALITIES.indexOf(getQuality(a.quality));
  });

  h += '<div class="pet-bag-grid">';
  for(const p of sorted){
    const q = getQuality(p.quality);
    const sp = getSpecies(p.species);
    const eq = state.petEquipped.includes(p.uid);
    const sel = state.petSelection.includes(p.uid);
    const selIdx = state.petSelection.indexOf(p.uid);
    const slotFull = state.petEquipped.length >= MAX_PETS;
    const eqBtnTxt = eq ? '卸下' : (slotFull ? '槽位满' : '装备');
    const eqBtnAttr = (!eq && slotFull) ? 'disabled' : '';

    h += '<div class="pet-card-v2 ' + (eq ? 'equipped' : '') + ' ' + (sel ? 'selected' : '') +
      (p.shiny ? ' shiny' : '') + '" ' +
      'data-pet-card="' + p.uid + '" data-pet-idx="' + selIdx + '" style="--qc:' + q.color + '">' +
      '<div class="pcv-sel">' + (sel ? (selIdx + 1) : '') + '</div>' +
      (eq ? '<div class="pcv-badge">装备中</div>' : '') +
      (p.shiny ? '<div class="pcv-badge" style="background:linear-gradient(180deg,#ffd86b,#c98a00);color:#241700;border-color:rgba(255,255,255,.5)">✨</div>' : '') +
      '<div class="pcv-emoji">' + sp.emoji + '</div>' +
      '<div class="pcv-name">' + (p.shiny ? '✨' : '') + esc(sp.name) + '</div>' +
      '<div class="pcv-quality">' + q.name + '</div>' +
      '<div class="pcv-star">' + getStarInfo(p.star).label + '</div>' +
      '<div class="pcv-mult">x' + fmt(petMult(p)) + '</div>' +
      '<button class="pcv-equip' + (eq ? ' on' : '') + '" data-equip="' + p.uid + '"' + eqBtnAttr + '>' + eqBtnTxt + '</button>' +
    '</div>';
  }
  h += '</div>';

  const sel = state.petSelection.map(uid => state.petInv.find(p => p.uid === uid)).filter(Boolean);
  const canMerge = sel.length === 3 &&
                   sel.every(p => p) &&
                   sel.every(p => !p.shiny) &&
                   sel[0].species === sel[1].species && sel[1].species === sel[2].species &&
                   sel[0].quality === sel[1].quality && sel[1].quality === sel[2].quality &&
                   sel[0].star === sel[1].star && sel[1].star === sel[2].star;
  const selInfo = sel.length
    ? (getSpecies(sel[0].species).name + ' · ' + getQuality(sel[0].quality).name + ' ' + sel[0].star + '星 × ' + sel.length)
    : '未选择';

  h += '<div class="bag-toolbar">' +
    '<div class="bt-info">已选 <b>' + sel.length + '/3</b> · ' + esc(selInfo) + '</div>' +
    '<button class="bt-btn" data-pet-merge="1"' + (canMerge ? '' : ' disabled') + '>闪耀合成</button>' +
    '<button class="bt-btn" data-pet-clear="1" style="background:rgba(255,255,255,.1);color:#c2cde4"' +
      (sel.length ? '' : ' disabled') + '>清空</button>' +
  '</div>';

  h += '<div class="set-info" style="margin-top:10px;font-size:11.5px">' +
    '<b>💡 操作说明：</b><br>' +
    '· 点击宠物卡片：选中 / 取消选择（用于闪耀合成）<br>' +
    '· 点击卡片下方按钮：装备 / 卸下<br>' +
    '· 选择 3 只 <b>相同种类、相同品质、相同星级</b> 且 <b>非闪耀</b> 的宠物，可合成 1 只 <b>✨ 闪耀</b> 宠物<br>' +
    '· 闪耀宠物基础倍率 ×3，特质 ×2，且不能再参与合成' +
  '</div>';

  h += '</div></div>';
  return h;
}

function renderPetLevelup(){
  let h = '<div class="card"><div class="card-head">⬆️ 品质升阶</div>';

  if(!state.petInv.length){
    h += '<div class="empty">还没有宠物<br>去抽取页抽一只吧</div>';

    return h;
  }

  const target = state.petLevelupTarget ? state.petInv.find(p => p.uid === state.petLevelupTarget) : null;
  if(target){
    const q = getQuality(target.quality);
    const sp = getSpecies(target.species);
    const need = petExpNeed(target.quality);
    const pct = need === Infinity ? 100 : Math.min(100, (target.exp || 0) / need * 100);
    const qIdx = PET_QUALITIES.findIndex(x => x.id === target.quality);
    const nextQ = (qIdx >= 0 && qIdx < PET_QUALITIES.length - 1) ? PET_QUALITIES[qIdx + 1] : null;
    h += '<div style="border-radius:13px;padding:11px;margin-bottom:12px;background:linear-gradient(165deg,rgba(120,170,255,.15),rgba(120,170,255,.03));border:1.5px solid rgba(120,170,255,.5)">' +
      '<div style="display:flex;align-items:center;gap:9px">' +
        '<div style="font-size:26px">' + sp.emoji + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:13px;font-weight:900;color:#fff">' +
            (target.shiny ? '✨' : '') + esc(sp.name) + ' · ' + q.name +
          '</div>' +
          '<div style="font-size:11px;color:#8b98ad;margin-top:2px">' +
            (nextQ
              ? ('升阶至 ' + nextQ.name + '：经验 ' + (target.exp || 0) + ' / ' + need)
              : '已达最高品质') +
            ' · ' + target.star + '★' +
          '</div>' +
          '<div style="height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden">' +
            '<i style="display:block;height:100%;width:' + pct + '%;background:linear-gradient(90deg,#7dc4ff,#4b8bff);border-radius:99px;transition:width .3s"></i>' +
          '</div>' +
        '</div>' +
        '<button data-pet-cancel-target="1" style="background:rgba(255,255,255,.1);color:#c2cde4;padding:6px 10px;font-size:11px;border-radius:8px;border:none;font-family:inherit;font-weight:900;cursor:pointer">取消</button>' +
      '</div>' +
    '</div>';
  }else{
    h += '<div class="merchant" style="margin-bottom:12px">' +
      '<div class="m-emoji">⬆️</div>' +
      '<div>点击任意宠物作为 <b>主宠物</b>，然后选 <b>同星 · 品质 ≤ 主宠物 · 闪耀状态相同</b> 的宠物作为材料吸收。<br>材料品质越低提供的经验越少，升到越高品质需要的经验越多。</div>' +
    '</div>';
  }

  const sorted = state.petInv.slice().sort((a, b) => {
    if(b.star !== a.star) return b.star - a.star;
    if(!!b.shiny !== !!a.shiny) return b.shiny ? 1 : -1;
    return PET_QUALITIES.indexOf(getQuality(b.quality)) - PET_QUALITIES.indexOf(getQuality(a.quality));
  });

  h += '<div class="pet-bag-grid">';
  for(const p of sorted){
    const q = getQuality(p.quality);
    const sp = getSpecies(p.species);
    const eq = state.petEquipped.includes(p.uid);

    let sel = false, selIdx = -1, dim = false;
    if(state.petLevelupTarget === p.uid){
      sel = true; selIdx = 0;
    }else if(state.petLevelupMaterials.includes(p.uid)){
      sel = true; selIdx = state.petLevelupMaterials.indexOf(p.uid) + 1;
    }
    if(state.petLevelupTarget && state.petLevelupTarget !== p.uid){
      const tgt = state.petInv.find(x => x.uid === state.petLevelupTarget);
      if(tgt){
        if(p.star !== tgt.star) dim = true;
        const ti = PET_QUALITIES.findIndex(x => x.id === tgt.quality);
        const pi = PET_QUALITIES.findIndex(x => x.id === p.quality);
        if(pi > ti) dim = true;
        if(!!p.shiny !== !!tgt.shiny) dim = true;
      }
    }

    const slotFull = state.petEquipped.length >= MAX_PETS;
    const eqBtnTxt = eq ? '卸下' : (slotFull ? '槽位满' : '装备');
    const eqBtnAttr = (!eq && slotFull) ? 'disabled' : '';

    h += '<div class="pet-card-v2 ' + (eq ? 'equipped' : '') + ' ' + (sel ? 'selected' : '') +
      (p.shiny ? ' shiny' : '') + (dim ? ' dim' : '') + '" ' +
      'data-pet-card="' + p.uid + '" data-pet-idx="' + selIdx + '" style="--qc:' + q.color + '">' +
      '<div class="pcv-sel">' + (sel ? (selIdx + 1) : '') + '</div>' +
      (eq ? '<div class="pcv-badge">装备中</div>' : '') +
      (p.shiny ? '<div class="pcv-badge" style="background:linear-gradient(180deg,#ffd86b,#c98a00);color:#241700;border-color:rgba(255,255,255,.5)">✨</div>' : '') +

      '<div class="pcv-name">' + (p.shiny ? '✨' : '') + esc(sp.name) + '</div>' +
      '<div class="pcv-quality">' + q.name + '</div>' +
      '<div class="pcv-star">' + getStarInfo(p.star).label + '</div>' +
      '<div class="pcv-mult">x' + fmt(petMult(p)) + '</div>' +
      '<button class="pcv-equip' + (eq ? ' on' : '') + '" data-equip="' + p.uid + '"' + eqBtnAttr + '>' + eqBtnTxt + '</button>' +
    '</div>';
  }
  h += '</div>';

  h += '<div class="set-info" style="margin-top:10px;font-size:11.5px">' +
    '<b>💡 操作说明：</b><br>' +
    '· 点击任意宠物卡片：设为 <b>主宠物</b>（再点一次取消）<br>' +
    '· 选好主宠物后，底部出现 <b>⚡ 一键选材料</b> 按钮，自动选中所有符合条件的材料<br>' +
    '· 也可以手动点其他卡片加入 / 移出材料<br>' +
    '· 材料要求：<b>同星 · 品质 ≤ 主宠物 · 闪耀状态相同</b><br>' +
    '· 材料品质越低经验越少，升到越高品质需要越多经验' +
  '</div>';

  h += '</div></div>';
  return h;
}

let lastRollTime = 0;

function showCard(base, affixes, sub){

  $('#dBadge').textContent = base.id;
  $('#dName').innerHTML = fullNameHTML(base, affixes);
  $('#dSub').textContent = sub || '';
}
function hideDiceTag(){
  const el = $('#diceTag');
  if(el) el.classList.remove('show');
}
function showDiceTag(key, mult){
  const el = $('#diceTag');
  if(!el) return;
  const d = DICE_DEFS[key];
  el.style.setProperty('--dc', d.color);
  el.textContent = d.emoji + ' ' + d.name + ' x' + fmt(mult);
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}
function doRoll(){
  if(state.rolling) return;
  if(state.page !== 'roll') return;
  state.rolling = true;
  const btn = $('#rollBtn');
  if(btn) btn.disabled = true;
  hideDiceTag();
  const el = $('#display');
  if(el){ el.classList.remove('pop'); el.classList.add('rolling'); }
  const flick = setInterval(() => {
    const r = RARITIES[Math.floor(Math.random() * RARITIES.length)];
    showCard(r, [], '');
    beep(500 + Math.random() * 560, .022, 'square', .011);
  }, 45);
  setTimeout(() => {
    clearInterval(flick);
    const el2 = $('#display');
    if(el2) el2.classList.remove('rolling');
    resolveRoll(rollFull());

    /* 🎰 多重抽奖：按概率追抽，最多追 5 次 */
    const chance = getMultiRollChance();
    let extra = 0;
    while(extra < 5 && Math.random() < chance) extra++;
    if(extra > 0){
      for(let i = 0; i < extra; i++) resolveRoll(rollFull());
      toast('🎰 多重抽奖触发！额外 +' + extra + ' 抽');
      burst('#ff6bff', 60);
      shake(3 + extra);
    }

    state.rolling = false;
    const btn2 = $('#rollBtn');
    if(btn2) btn2.disabled = false;
  }, ROLL_ANIM);
}
function resolveRoll(result){
  const base = result.base;
  const affixes = result.affixes || [];
  const idx = RARITIES.indexOf(base);

  state.rolls++;
  state.rollCount++;
  state.inv[base.id] = (state.inv[base.id] || 0) + 1;
  state.pity = idx >= 3 ? 0 : state.pity + 1;

  if(affixes.length >= 1) state.stats.totalAffix++;
  if(affixes.length >= 2) state.stats.totalDouble++;
  if(base.id === 'N' && affixes.length >= 1) state.stats.shinyCommon++;
  if(base.id === 'N' && affixes.length >= 2) state.stats.shinyCommonDouble++;
  if(base.id === 'N'){
    for(const a of affixes){
      if(AFFIXES.indexOf(a) >= CHAOTIC_INDEX){ state.stats.chaoticCommon++; break; }
    }
  }

  const diceKey = getDiceType(state.rollCount);
  const di = getDiceInfo();
  let diceMult = 1;
  if(diceKey === 'gold')    { diceMult = di.gold;    state.stats.goldDice++; }
  if(diceKey === 'diamond') { diceMult = di.diamond; state.stats.diamondDice++; }
  if(diceKey === 'emerald') { diceMult = di.emerald; state.stats.emeraldDice++; }
  if(diceKey === 'rainbow') { diceMult = di.rainbow; state.stats.rainbowDice++; }

  const aMult = affixMult(affixes);
  const totalMult = getCoinMult() * diceMult * aMult;
  const pt = getPetTraits();
  const gainCoins = base.coins * totalMult;
  const gainGems  = base.gems * diceMult * aMult * (1 + pt.gem);
  state.coins += gainCoins;
  state.gems  += gainGems;

  trackDaily('rolls', 1);
  trackDaily('coins', gainCoins);
  if(idx >= 3) trackDaily('ssr', 1);
  if(idx >= 4) trackDaily('ur', 1);
  if(idx >= 5) trackDaily('sync', 1);
  if(affixes.length) trackDaily('affix', affixes.length);
  if(diceKey) trackDaily('dice', 1);

  let sub = '💰 +' + fmt(gainCoins) + (gainGems ? '  💎 +' + fmt(gainGems) : '');
  if(affixes.length) sub = '✦ x' + fmt(aMult) + ' · ' + sub;
  showCard(base, affixes, sub);

  const el = $('#display');
  if(el){ void el.offsetWidth; el.classList.add('pop'); }
  if(diceKey){
    showDiceTag(diceKey, diceMult);
    setTimeout(hideDiceTag, 2200);
  }

  const totalLevel = idx + affixes.length * 3;
  if(totalLevel >= 2) burst(base.color, 16 + totalLevel * 12);
  if(totalLevel >= 3) shake(totalLevel);
  if(affixes.length) setTimeout(() => burst(affixes[0].color, 30), 100);
  if(idx >= 5){
    setTimeout(() => burst('#ffffff', 55), 160);
    setTimeout(() => burst(base.color, 85), 280);
  }
  if(idx >= 8) setTimeout(() => burst('#ffffff', 90), 400);

function buyNode(id){
  const n = ALL_NODES.find(x => x.id === id);
  if(!n || n.id === 'root' || n.id === 'PROOT') return;
  const lv = nodeLv(n);
  if(lv >= n.max) return;
  if(!nodeIsUnlocked(n)){ toast('前置节点未解锁'); beep(200, .12, 'square', .04); return; }
  const cost = nodeCost(n);
  if(state.coins < cost){ toast('金币不足，需要 💰' + fmt(cost)); beep(200, .12, 'square', .04); return; }

  state.coins -= cost;
  if(n.perma) state.ptree[n.id] = lv + 1;
  else        state.tree[n.id]  = lv + 1;

  beep(880, .1, 'square', .05);
  if(nodeLv(n) >= n.max) setTimeout(() => beep(1320, .2, 'sine', .05), 90);
  updateHUD();
  renderTreeContent();
  const hovered = treeCanvas.querySelector('.tnode:hover');
  if(hovered){
    const rect = hovered.getBoundingClientRect();
    showNodeTip(hovered, rect.left + rect.width / 2, rect.top + rect.height / 2);
  }
}

function drawPets(count){
  const cost = count === 10 ? PET_DRAW_COST_10 : PET_DRAW_COST_1;
  if(state.gems < cost){
    toast('钻石不足，需要 💎' + fmt(cost));
    beep(200, .12, 'square', .04);
    return;
  }
  state.gems -= cost;
  const results = [];
  for(let i = 0; i < count; i++){
    const q = rollPetQuality();
    results.push(genPet(q, rollSpecies()));
  }
  for(const pet of results){
    state.petInv.push(pet);
  }
  const gotWorm = results.some(p => p.species === 'worm');
  if(gotWorm){
    setTimeout(() => {
      toast('🐛 诅咒降临！你抽到了 蚕大蛇……');
      beep(180, .5, 'sawtooth', .05);
      setTimeout(() => beep(120, .6, 'sawtooth', .05), 220);
      burst('#7c8f3a', 60);
      shake(7);
    }, 400);
  }
  beep(900, .15, 'sine', .06);
  setTimeout(() => beep(1200, .2, 'sine', .05), 100);
  if(count === 10) setTimeout(() => beep(1500, .3, 'sine', .05), 200);
  const bestQ = results.reduce((best, p) => {
    const q = getQuality(p.quality);
    return q.mult > getQuality(best.quality).mult ? p : best;
  }, results[0]);
  const bestColor = getQuality(bestQ.quality).color;
  burst(bestColor, 60);
  if(count === 10) setTimeout(() => burst('#ff4fb5', 80), 200);

  const best = results.reduce((b, p) => {
    const q = getQuality(p.quality);
    return q.mult > getQuality(b.quality).mult ? p : b;
  }, results[0]);
  const bestName = getQuality(best.quality).name + ' · ' + getSpecies(best.species).name + ' ' + best.star + '★';
  toast('🎉 抽到 ' + count + ' 只宠物！最佳：' + bestName);

  updateHUD();
  renderPetPage();
  checkAchievements();
}

function tryMergePets(){

  if(sel.some(p => p.shiny)){

  if(!sel.every(p => p.species === first.species && p.quality === first.quality && p.star === first.star)){
    toast('需要相同种类、品质和星级的宠物');
    return;
  }
  const sp = getSpecies(first.species);
  openConfirm('✨', '闪耀合成', '将消耗 3 只 ' + getQuality(first.quality).name + ' ' +
    first.star + '星 ' + sp.name + '，合成 1 只 ✨ 闪耀' + sp.name +
    '（基础倍率 ×3，特质 ×2）。', () => {

    checkAchievements();
  });

function autoMergeAll(){
  let totalMerged = 0;
  let changed = true;
  while(changed){
    changed = false;
    const groups = {};
    for(const p of state.petInv){
      if(p.shiny) continue;
      const key = p.species + '|' + p.quality + '|' + p.star;
      if(!groups[key]) groups[key] = [];
      groups[key].push(p);
    }
    for(const key of Object.keys(groups)){
      const list = groups[key];
      while(list.length >= 3){
        const three = list.splice(0, 3);
        const first = three[0];
        const uids = three.map(p => p.uid);
        state.petInv = state.petInv.filter(p => !uids.includes(p.uid));
        const newPet = genPet(first.quality, first.species);
        newPet.shiny = true;
        state.petInv.push(newPet);
        totalMerged++;
        changed = true;
      }
    }
  }
  return totalMerged;
}

function countMergeable(){
  const groups = {};
  for(const p of state.petInv){
    if(p.shiny) continue;
    const key = p.species + '|' + p.quality + '|' + p.star;
    if(!groups[key]) groups[key] = 0;
    groups[key]++;
  }
  let total = 0;
  for(const k in groups) total += Math.floor(groups[k] / 3);
  return total;
}

function updatePetFab(){
  const fab = document.getElementById('petFab');
  if(!fab) return;
  if(state.page !== 'pet'){ fab.classList.remove('show'); fab.innerHTML = ''; return; }
  const subTab = state.petTab || 'draw';

  if(subTab === 'bag'){
    const possible = countMergeable();
    const hasSel = state.petSelection.length > 0;
    let html = '<div class="pf-info">可合成 <b>' + possible + '</b> 只闪耀</div>';
    html += '<button class="pf-btn primary" data-pet-auto-merge="1"' + (possible ? '' : ' disabled') + '>一键合成</button>';
    if(hasSel) html += '<button class="pf-btn secondary" data-pet-clear="1">清空</button>';
    fab.innerHTML = html;
    fab.classList.add('show');
    return;
  }

  if(subTab === 'levelup'){
    const target = state.petLevelupTarget ? state.petInv.find(p => p.uid === state.petLevelupTarget) : null;
    if(!target){ fab.classList.remove('show'); fab.innerHTML = ''; return; }

    let totalExp = 0;
    for(const uid of state.petLevelupMaterials){
      const m = state.petInv.find(x => x.uid === uid);
      if(m) totalExp += petAbsorbExp(target, m);
    }
    const canAbsorb = state.petLevelupMaterials.length > 0;
    let html = '<div class="pf-info">已选 <b>' + state.petLevelupMaterials.length + '</b> 只 · +<b>' + totalExp + '</b> 经验</div>';
    html += '<button class="pf-btn secondary" data-pet-auto-select="1">⚡ 一键选材料</button>';
    if(canAbsorb) html += '<button class="pf-btn primary" data-pet-absorb="1">确认吸收</button>';
    fab.innerHTML = html;
    fab.classList.add('show');
    return;
  }

  fab.classList.remove('show');
  fab.innerHTML = '';
}

function doRebirth(tierId){
  const tier = REBIRTH_TIERS.find(t => t.id === tierId);
  if(!tier) return;
  const req = tier.req();
  if(!req.ok){ toast('❌ ' + req.txt); return; }
  const cost = getTierCost(tier);
  if(state.coins < cost){ toast('金币不足，需要 💰' + fmt(cost)); beep(200, .12, 'square', .04); return; }
  openConfirm(tier.emoji, '确认' + tier.name,
    '将清空金币与普通技能树等级（永久树保留），获得永久加成。此操作不可撤销。', () => {
    state.coins = 0;
    state.tree = { root:1 };   /* 只清普通树，state.ptree 不动 */
    if(tier.id === 'rebirth') state.rebirths++;
    else if(tier.id === 'ascend') state.ascends++;
    else if(tier.id === 'transcend') state.transcends++;

    const sounds = { rebirth: [300, 520, 880], ascend: [400, 700, 1200, 1600], transcend: [250, 500, 900, 1400, 2000, 2600] };
    const freqs = sounds[tier.id];
    freqs.forEach((f, i) => setTimeout(() => beep(f, .3, 'sine', .06), i * 120));
    const colors = { rebirth:'#ffc93c', ascend:'#ff6bff', transcend:'#00ffc8' };
    burst(colors[tier.id], 130);
    burst('#ffffff', 80);
    shake(9);
    toast('🌟 ' + tier.name + '成功！' + (tier.id === 'rebirth' ? '第 ' + state.rebirths + ' 次'
      : tier.id === 'ascend' ? '第 ' + state.ascends + ' 次进阶'
      : '第 ' + state.transcends + ' 次超级') + '（永久树保留）');
    updateHUD(); renderRebPage();
    markDirty(); saveGame();
  });
}

  const sub = e.target.closest('.subtab');
  if(sub){

      state.petLevelupMaterials = [];

      updatePetFab();
      beep(600, .05, 'sine', .025);
    }

  }

    state.petLevelupTarget = null;
    state.petLevelupMaterials = [];
    renderPetPage();
    updatePetFab();
    return;
  }

    state.petLevelupMaterials = [];
    renderPetPage();
    updatePetFab();
    return;
  }

  if(e.target.closest('[data-pet-absorb]')){

    return;
  }

    const n = autoSelectLevelup();
    if(n > 0){
      toast('⚡ 已自动选择 ' + n + ' 只材料');

    }else{
      toast('没有符合条件的材料');
      beep(220, .12, 'square', .04);
    }
    renderPetPage();
    updatePetFab();
    return;
  }

  if(equipBtn){
    e.stopPropagation();
    toggleEquipPet(equipBtn.dataset.equip);
    return;
  }

  const el = e.target.closest('button');
  if(el){
    if(el.dataset.shopCoins){
      const it = SHOP_COINS.find(x => x.id === el.dataset.shopCoins);
      if(!it || state.coins < it.price) return;
      state.coins -= it.price; it.apply();
      updateHUD(); renderShopPage(); return;
    }
    if(el.dataset.shopGems){
      const it = SHOP_GEMS.find(x => x.id === el.dataset.shopGems);
      if(!it || state.gems < it.price) return;
      state.gems -= it.price; it.apply();
      updateHUD(); renderShopPage(); return;
    }
    if(el.dataset.pack){
      if(!state.rechargeUnlocked){ openOverlay('recharge'); return; }
      const pk = SHOP_PACKS.find(x => x.id === el.dataset.pack);
      if(!pk) return;
      state.coins += pk.coins; state.gems += pk.gems;
      beep(1200, .2, 'sine', .06);
      setTimeout(() => beep(1600, .3, 'sine', .05), 130);
      burst('#ff4fb5', 80);
      toast('🎉 ' + pk.name + ' 到账！💎+' + fmt(pk.gems) + ' 💰+' + fmt(pk.coins));
      updateHUD(); renderShopPage(); return;
    }
    if(el.dataset.potion){ buyPotion(el.dataset.potion); return; }
    if(el.dataset.petDraw){ drawPets(parseInt(el.dataset.petDraw, 10)); return; }
    if(el.dataset.petMerge){ tryMergePets(); return; }
    if(el.dataset.petClear){ state.petSelection = []; renderPetPage(); updatePetFab(); return; }
    if(el.dataset.petAutoMerge){
      const n = countMergeable();
      if(!n){ toast('没有可合成的宠物'); return; }
      openConfirm('✨', '一键合成', '将自动合成所有可以合成的组合，共可获得 ' + n +
        ' 只闪耀宠物（闪耀宠物不能再参与合成）。确定吗？', () => {
        const merged = autoMergeAll();
        state.petSelection = [];
        beep(800, .15, 'sine', .06);
        setTimeout(() => beep(1200, .2, 'sine', .06), 100);
        setTimeout(() => beep(1600, .3, 'sine', .055), 220);

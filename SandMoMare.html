<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沙墨马大冒险 · 横版跑酷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23C4502F'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23FFF6E0' font-family='serif' font-weight='900'%3E马%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  --sky-top:#6FBEE0; --sky-mid:#A9DCF0; --sky-low:#FFE9C4;
  --sand-deep:#D99A4E; --sand-mid:#EDBE6E; --sand-light:#F8DCA0;
  --cliff:#C97B4E; --cliff-dark:#A95F3E;
  --cactus:#5C9E5A; --cactus-dark:#48804A;
  --ink:#3A2E28; --ink-soft:#6B5646;
  --gold:#FFC93C; --gold-deep:#E8A020;
  --accent:#E25B4A; --accent-dark:#C4483A;
  --cream:#F7E7CE; --brown:#8B5E34; --brown-dark:#6B4526;
  --panel:#FFF9EC; --shadow:rgba(84,54,20,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'ZCOOL KuaiLe','YouYuan','幼圆','Yuanti SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(180deg,#8CCDE8 0%,#F2D9A4 70%,#E5B96F 100%);
  overflow:hidden; color:var(--ink);
  user-select:none; -webkit-user-select:none;
}
/* ===== 舞台 ===== */
.stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.stage::before{ /* 左右留白处的沙丘装饰 */
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(120px 46px at 8% 86%, rgba(255,240,200,.55), transparent 70%),
    radial-gradient(160px 60px at 92% 82%, rgba(255,240,200,.5), transparent 70%),
    radial-gradient(90px 40px at 20% 20%, rgba(255,255,255,.25), transparent 70%),
    radial-gradient(70px 36px at 82% 28%, rgba(255,255,255,.22), transparent 70%);
  pointer-events:none;
}
canvas.game{
  position:relative; z-index:2;
  width:min(100vw, calc(100vh * 960 / 540));
  height:min(100vh, calc(100vw * 540 / 960));
  background:#7EC8E3;
  border-radius:14px;
  box-shadow:0 18px 60px var(--shadow), 0 4px 14px rgba(84,54,20,.15);
  touch-action:none;
}
/* ===== HUD ===== */
.hud{
  position:absolute; top:0; left:0; right:0; z-index:5;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:14px 18px; pointer-events:none;
  font-family:'ZCOOL KuaiLe','YouYuan','Microsoft YaHei',sans-serif;
}
.hud .scorebox{
  display:flex; gap:8px; align-items:center;
  background:rgba(255,249,236,.82); border:3px solid #FFF;
  border-radius:999px; padding:6px 16px 6px 10px;
  box-shadow:0 4px 14px rgba(84,54,20,.18);
}
.hud .chip{display:flex; align-items:center; gap:6px;}
.hud .chip svg{width:22px;height:22px;flex:none;}
.hud .chip b{font-size:20px; color:var(--ink); line-height:1;}
.hud .chip .unit{font-size:13px; color:var(--ink-soft);}
.hud .right{display:flex; gap:8px; pointer-events:auto;}
.icon-btn{
  width:46px; height:46px; border-radius:50%;
  border:3px solid #FFF; background:rgba(255,249,236,.9);
  box-shadow:0 4px 14px rgba(84,54,20,.18);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink);
  transition:transform .12s ease, background .12s ease;
}
.icon-btn:hover{transform:translateY(-2px) scale(1.05); background:#FFF;}
.icon-btn:active{transform:scale(.94);}
.icon-btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
.icon-btn svg{width:24px;height:24px;}
/* ===== 覆盖层 ===== */
.overlay{
  position:absolute; inset:0; z-index:6;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; text-align:center;
  background:linear-gradient(180deg, rgba(110,60,20,.28) 0%, rgba(255,230,180,.42) 55%, rgba(110,60,20,.30) 100%);
  backdrop-filter:none;
}
.overlay .card{
  background:var(--panel); border:4px solid #FFF; border-radius:24px;
  padding:26px 34px; max-width:86%; width:520px;
  box-shadow:0 20px 60px rgba(84,54,20,.30), inset 0 -6px 0 rgba(200,150,70,.12);
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.logo-badge{
  width:86px;height:86px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #E8724F, #B93B26 72%);
  border:5px solid #FFE9C4; box-shadow:0 6px 18px rgba(120,40,10,.35), inset 0 4px 0 rgba(255,255,255,.35);
  display:flex; align-items:center; justify-content:center; flex:none;
}
.logo-badge span{font-size:44px; color:#FFF6E0; text-shadow:0 2px 0 rgba(120,40,10,.45); line-height:1;}
.title{
  font-size:clamp(30px, 6vw, 46px); color:var(--ink);
  letter-spacing:2px; line-height:1.15; text-shadow:0 2px 0 #FFF;
}
.title .sand{color:var(--accent-dark);}
.sub{font-size:15px; color:var(--ink-soft); letter-spacing:4px; margin-top:-8px;}
.howto{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:2px;}
.howto .tip{
  display:flex; align-items:center; gap:7px;
  background:#FFF3DC; border:2px solid #F0D8AC; border-radius:999px;
  padding:7px 14px; font-size:14px; color:var(--ink);
}
.howto .tip .key{
  background:var(--ink); color:#FFF; border-radius:7px; padding:2px 9px; font-size:13px; box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.best-line{font-size:15px; color:var(--ink-soft);}
.best-line b{color:var(--accent-dark); font-size:18px;}
.btn{
  font-family:inherit; font-size:22px; letter-spacing:3px;
  color:#FFF; background:linear-gradient(180deg,#EF7A56,#C4483A);
  border:4px solid #FFF; border-radius:999px;
  padding:13px 44px; cursor:pointer;
  box-shadow:0 8px 22px rgba(160,55,25,.38), inset 0 3px 0 rgba(255,255,255,.38);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-3px) scale(1.04); box-shadow:0 12px 28px rgba(160,55,25,.45), inset 0 3px 0 rgba(255,255,255,.38);}
.btn:active{transform:translateY(0) scale(.97);}
.btn:focus-visible{outline:3px solid var(--gold); outline-offset:3px;}
.btn.ghost{
  background:linear-gradient(180deg,#F8DCA0,#E3B36B); color:var(--ink);
  box-shadow:0 8px 22px rgba(140,90,30,.30), inset 0 3px 0 rgba(255,255,255,.5);
}
.hidden{display:none !important;}
/* ===== 结算 ===== */
.result-row{display:flex; gap:12px; width:100%; justify-content:center;}
.result-cell{
  flex:1; max-width:150px; background:#FFF3DC; border:2px solid #F0D8AC; border-radius:16px;
  padding:10px 6px; display:flex; flex-direction:column; gap:2px; align-items:center;
}
.result-cell .v{font-size:26px; color:var(--ink); line-height:1;}
.result-cell .k{font-size:13px; color:var(--ink-soft); letter-spacing:2px;}
.new-record{
  font-size:16px; color:var(--gold-deep); letter-spacing:2px;
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
/* ===== 旋转提示 & 暂停 ===== */
.rotate-hint{
  position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:20;
  background:rgba(58,46,40,.85); color:#FFF6E0; font-size:13px; letter-spacing:2px;
  padding:7px 16px; border-radius:999px; white-space:nowrap;
}
.pause-tip{
  position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:6;
  background:rgba(255,249,236,.92); border:3px solid #FFF; border-radius:999px;
  padding:8px 20px; font-size:16px; letter-spacing:2px; color:var(--ink);
  box-shadow:0 6px 18px rgba(84,54,20,.2); pointer-events:none;
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
}
</style>
</head>
<body>

<div class="stage">
  <canvas class="game" id="game" width="960" height="540"></canvas>

  <!-- HUD -->
  <div class="hud" id="hud" style="position:absolute; left:50%; transform:translateX(-50%); width:min(100vw, calc(100vh * 960 / 540));">
    <div class="scorebox" style="pointer-events:none;">
      <div class="chip" id="meterChip">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C4483A" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h3l2-6 4 12 2-6h5"/></svg>
        <b id="meterVal">0</b><span class="unit">米</span>
      </div>
      <div class="chip" id="coinChip" style="border-left:2px solid #F0D8AC; padding-left:10px;">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3 1.3-6.5L2.5 9l6.6-.8z" fill="#FFC93C" stroke="#E8A020" stroke-width="1.2"/></svg>
        <b id="coinVal">0</b>
      </div>
    </div>
    <div class="right">
      <button class="icon-btn" id="pauseBtn" title="暂停 / 继续 (P)" aria-label="暂停">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
      </button>
      <button class="icon-btn" id="muteBtn" role="switch" aria-checked="false" title="音效开关 (M)" aria-label="音效开关">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h3.5L13 19V5l-5.5 4H4z" fill="currentColor" stroke="none"/>
          <path class="wav" d="M16.5 8.5a5 5 0 0 1 0 7"/>
          <path class="wav2" d="M19 6a8.5 8.5 0 0 1 0 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 暂停提示 -->
  <div class="pause-tip hidden" id="pauseTip">已暂停 · 按 P 或空格继续</div>

  <!-- 标题 -->
  <div class="overlay" id="titleOverlay">
    <div class="card">
      <div class="logo-badge"><span>马</span></div>
      <h1 class="title">沙墨马<span class="sand">大冒险</span></h1>
      <p class="sub">— 沙漠横版跑酷 · 冲呀墨墨 —</p>
      <div class="howto">
        <div class="tip"><span class="key">空格</span> 跳跃</div>
        <div class="tip"><span class="key">↑</span> 二段跳</div>
        <div class="tip"><span class="key">点击</span> 也能跳</div>
        <div class="tip"><span class="key">P</span> 暂停</div>
      </div>
      <div class="best-line">最佳成绩 <b id="bestShow">0</b> 米</div>
      <button class="btn" id="startBtn">开始冒险</button>
    </div>
  </div>

  <!-- 结算 -->
  <div class="overlay hidden" id="overOverlay">
    <div class="card">
      <h1 class="title" style="font-size:34px;">沙墨马累趴啦</h1>
      <div class="new-record hidden" id="newRecord">新纪录！</div>
      <div class="result-row">
        <div class="result-cell"><div class="v" id="rMeter">0</div><div class="k">奔跑距离</div></div>
        <div class="result-cell"><div class="v" id="rCoin">0</div><div class="k">星星金币</div></div>
        <div class="result-cell"><div class="v" id="rBest">0</div><div class="k">历史最佳</div></div>
      </div>
      <p style="font-size:14px; color:var(--ink-soft); letter-spacing:1px;">前面就是绿洲啦，再跑一次？</p>
      <button class="btn" id="restartBtn">再跑一次</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   沙墨马大冒险 · 横版卡通跑酷
   原生 Canvas 2D + Web Audio，单文件自包含
============================================================ */

// ================= 常量 =================
const VIEW_W = 960, VIEW_H = 540;
const GROUND_Y = 452;          // 地面线（逻辑坐标）
const PLAYER_X = 150;           // 角色固定屏幕 x
const GRAVITY = 1300;
const JUMP_V = -680, DOUBLE_V = -600;
const COYOTE = 0.09;            // 地面缓冲时间
const BASE_SPEED = 300, MAX_SPEED = 660;
const SPEED_RAMP = 5.5;         // 每秒加速度
const METER_PER_PX = 40;        // 多少像素 = 1 米
const COIN_SCORE = 10;          // 每个金币折算分数
const OBSTACLE_MIN_GAP = 0.95;  // 障碍间距系数（相对速度）

// ================= 全局状态 =================
const G = {
  canvas: null, ctx: null, dpr: 1,
  mode: 'title',               // title | playing | paused | over
  scrollX: 0, speed: BASE_SPEED,
  t: 0,                        // 总时间（演示/游戏均推进）
  runT: 0,                     // 本局游戏时间
  player: {
    y: GROUND_Y, vy: 0, onGround: true,
    jumps: 0, maxJumps: 2, phase: 0, blink: 0,
    dead: false, deadT: 0, bodyRot: 0, dustT: 0
  },
  coins: 0, meters: 0, score: 0,
  best: 0,
  obstacles: [], pickups: [], particles: [], floats: [],
  shake: 0, shakeT: 0, flashT: 0,
  nextSpawn: 0, speedUpT: 0,
  clouds: [], mesas: [], duneA: [], duneB: [], decor: [],
  demoCoins: [],               // 标题页装饰金币
  hintShown: false,
};
(function(){ try{ G.best = Number(localStorage.getItem('shamo_best')||0); }catch(e){ G.best = 0; } })();

// ================= Canvas 初始化 =================
function initCanvas(){
  G.canvas = document.getElementById('game');
  G.ctx = G.canvas.getContext('2d');
  G.dpr = Math.min(window.devicePixelRatio||1, 2);
  G.canvas.width = VIEW_W * G.dpr;
  G.canvas.height = VIEW_H * G.dpr;
  G.ctx.setTransform(G.dpr,0,0,G.dpr,0,0);
}
// 页面横竖屏判断提示
(function(){
  const hint = document.createElement('div');
  hint.className = 'rotate-hint'; hint.textContent = '建议横屏游玩更舒服';
  const check = () => {
    if(window.innerWidth < window.innerHeight && G.mode !== 'over'){
      if(!document.body.contains(hint)) document.body.appendChild(hint);
    } else if(document.body.contains(hint)) hint.remove();
  };
  window.addEventListener('resize', check);
  check();
})();

// ================= Web Audio 音效 =================
const Sfx = {
  ctx: null, muted: false,
  ensure(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      this.ctx = new AC();
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  tone(type, f0, f1, dur, vol, delay){
    if(this.muted) return;
    if(!this.ensure()) return;
    const t0 = this.ctx.currentTime + (delay||0);
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(Math.max(f0,1), t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0+dur);
    g.gain.setValueAtTime(vol||0.18, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g).connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  },
  jump(){ this.tone('sine', 320, 620, 0.14, 0.16); },
  double(){ this.tone('sine', 480, 880, 0.14, 0.15); },
  land(){ this.tone('triangle', 180, 90, 0.10, 0.10); },
  coin(){ this.tone('triangle', 880, 1320, 0.09, 0.14); this.tone('triangle', 1320, 1760, 0.12, 0.10, 0.07); },
  hit(){ this.tone('sawtooth', 220, 60, 0.34, 0.22); },
  ui(){ this.tone('sine', 520, 700, 0.08, 0.10); },
};
(function(){
  try{ Sfx.muted = localStorage.getItem('shamo_muted') === '1'; }catch(e){}
  const btn = document.getElementById('muteBtn');
  const wavs = btn.querySelectorAll('.wav,.wav2');
  function paint(){
    btn.setAttribute('aria-checked', String(!Sfx.muted));
    wavs.forEach(w=>{ w.style.display = Sfx.muted ? 'none' : 'block'; });
  }
  btn.addEventListener('click', ()=>{
    Sfx.muted = !Sfx.muted;
    try{ localStorage.setItem('shamo_muted', Sfx.muted ? '1':'0'); }catch(e){}
    if(!Sfx.muted) Sfx.ui();
    paint();
  });
  paint();
})();

// ================= 输入 =================
const Keys = {};
function jumpAction(){
  if(G.mode === 'title'){ startGame(); return; }
  if(G.mode === 'over'){ startGame(); return; }
  if(G.mode !== 'playing') return;
  const p = G.player;
  if(p.dead) return;
  const canAir = p.onGround || p.jumps < p.maxJumps || (p.vy > 0 && p.jumps < p.maxJumps);
  if(canAir){
    if(p.onGround){ p.vy = JUMP_V; p.onGround = false; p.jumps = 1; Sfx.jump(); spawnDust(6, 0.5); }
    else { p.vy = DOUBLE_V; p.jumps = 2; Sfx.double(); spawnDust(8, 0.6); ringWave(); }
    p.blink = 0;
  }
}
window.addEventListener('keydown', (e)=>{
  if(e.repeat) return;
  const k = e.code;
  if(k === 'Space' || k === 'ArrowUp' || k === 'KeyW'){ e.preventDefault(); jumpAction(); return; }
  if(k === 'KeyP' || k === 'Escape'){ togglePause(); return; }
  if(k === 'KeyM'){ document.getElementById('muteBtn').click(); return; }
  Keys[k] = true;
});
window.addEventListener('keyup', (e)=>{
  Keys[e.code] = false;
  const p = G.player;
  if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') && !p.onGround && p.vy < -260){
    p.vy = -260;                 // 可变跳跃高度：松手即短跳
  }
});
// 触屏 / 鼠标
function onPointer(e){
  if(e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  jumpAction();
}
window.addEventListener('pointerdown', onPointer, {passive:false});

function togglePause(){
  if(G.mode === 'playing'){ G.mode = 'paused'; showPause(true); Sfx.ui(); }
  else if(G.mode === 'paused'){ G.mode = 'playing'; showPause(false); Sfx.ui(); }
}
function showPause(on){
  document.getElementById('pauseTip').classList.toggle('hidden', !on);
}

// ================= 工具函数 =================
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a + Math.random()*(b-a); }
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function starPath(ctx,cx,cy,R,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rad = i%2===0 ? R : r;
    const a = rot + i*Math.PI/5;
    const px = cx + Math.cos(a)*rad, py = cy + Math.sin(a)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function heartPath(ctx,cx,cy,s){
  ctx.beginPath();
  ctx.moveTo(cx, cy + s*0.35);
  ctx.bezierCurveTo(cx - s*0.9, cy - s*0.15, cx - s*0.45, cy - s*0.85, cx, cy - s*0.25);
  ctx.bezierCurveTo(cx + s*0.45, cy - s*0.85, cx + s*0.9, cy - s*0.15, cx, cy + s*0.35);
  ctx.closePath();
}

// ================= 背景生成 =================
function makeClouds(){
  G.clouds = [];
  for(let i=0;i<5;i++){
    G.clouds.push({ x: rand(0,VIEW_W*2), y: rand(40,170), s: rand(0.7,1.5), v: rand(6,14) });
  }
}
function makeMesas(){
  G.mesas = [];
  for(let i=0;i<4;i++){
    G.mesas.push({ x: i*520 + rand(-80,80), w: rand(240,400), h: rand(70,150), seg: rand(2,4) });
  }
}
function makeDunes(){
  G.duneA = []; G.duneB = [];
  for(let i=0;i<6;i++){
    G.duneA.push({ x: i*300, w: rand(260,360), h: rand(60,110), ph: rand(0,6.28) });
    G.duneB.push({ x: i*380 + 120, w: rand(300,420), h: rand(40,80), ph: rand(0,6.28) });
  }
}
function makeDecor(){
  G.decor = [];
  let x = 0;
  while(x < VIEW_W*1.6){
    G.decor.push({ x, type: Math.random()<0.5?'cactus':'rock', s: rand(0.6,1.15) });
    x += rand(220, 420);
  }
}

// ================= 背景绘制 =================
function drawSky(ctx){
  const g = ctx.createLinearGradient(0,0,0,VIEW_H);
  g.addColorStop(0,'#6FBEE0'); g.addColorStop(0.55,'#A9DCF0');
  g.addColorStop(0.82,'#FFE9C4'); g.addColorStop(1,'#F7CD8C');
  ctx.fillStyle = g; ctx.fillRect(0,0,VIEW_W,VIEW_H);
}
function drawSun(ctx){
  ctx.save();

  rg.addColorStop(0,'rgba(255,244,180,.9)'); rg.addColorStop(0.5,'rgba(255,214,110,.28)'); rg.addColorStop(1,'rgba(255,214,110,0)');

function drawClouds(ctx){
  for(const c of G.clouds){
    const x = c.x, y = c.y + Math.sin(G.t*0.3 + c.x)*3;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.arc(x, y, 22*c.s, 0, 7);
    ctx.arc(x+24*c.s, y-8*c.s, 18*c.s, 0, 7);
    ctx.arc(x+46*c.s, y, 20*c.s, 0, 7);
    ctx.arc(x+22*c.s, y+9*c.s, 20*c.s, 0, 7);

  }

function drawMesas(ctx, scroll){
  const f = 0.16, period = 4*520;
  ctx.fillStyle = '#C97B4E';
  for(const m of G.mesas){
    let x = m.x - ((scroll*f) % period);
    // 循环铺开
    for(let k=-1;k<=2;k++){
      const bx = x + k*period;
      const w = m.w, h = m.h;
      ctx.beginPath();
      ctx.moveTo(bx, GROUND_Y+14);
      ctx.lineTo(bx, GROUND_Y-h);
      ctx.lineTo(bx+w*0.22, GROUND_Y-h+18);
      ctx.lineTo(bx+w*0.42, GROUND_Y-h);
      ctx.lineTo(bx+w*0.66, GROUND_Y-h+22);
      ctx.lineTo(bx+w, GROUND_Y-h+4);
      ctx.lineTo(bx+w, GROUND_Y+14);
      ctx.closePath(); ctx.fill();
      // 台地顶部亮面
      ctx.fillStyle = 'rgba(255,230,190,.35)';
      ctx.beginPath();
      ctx.moveTo(bx+2, GROUND_Y-h+2);
      ctx.lineTo(bx+w*0.22, GROUND_Y-h+20);
      ctx.lineTo(bx+w*0.22-10, GROUND_Y-h+22);
      ctx.lineTo(bx+2-6, GROUND_Y-h+4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#C97B4E';
    }
  }
}
function drawDunes(ctx, scroll, list, f, color, baseY){
  const P = list.length*300;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  // 收集所有沙丘屏幕位置并排序，保证曲线连续
  const items = [];
  for(const d of list){
    let sx = d.x - ((scroll*f) % P);
    for(let k=-1;k<=1;k++) items.push({ sx: sx + k*P, d });
  }
  items.sort((a,b)=>a.sx-b.sx);
  for(const it of items){
    const bx = it.sx, d = it.d;
    if(bx + d.w < 0 || bx > VIEW_W) continue;
    ctx.quadraticCurveTo(bx + d.w*0.5, baseY - d.h - Math.sin(G.t*0.5 + d.ph)*6, bx + d.w, baseY);
  }
  ctx.lineTo(VIEW_W, baseY); ctx.lineTo(VIEW_W, VIEW_H); ctx.lineTo(0, VIEW_H);
  ctx.closePath(); ctx.fill();
}
function drawGround(ctx, scroll){
  // 地面沙层
  const g = ctx.createLinearGradient(0,GROUND_Y,0,VIEW_H);
  g.addColorStop(0,'#EBC27E'); g.addColorStop(0.35,'#E3B468'); g.addColorStop(1,'#D99A4E');
  ctx.fillStyle = g; ctx.fillRect(0,GROUND_Y,VIEW_W,VIEW_H-GROUND_Y);
  // 地面顶缘高光线
  ctx.fillStyle = '#F8E3AE';
  ctx.fillRect(0, GROUND_Y-4, VIEW_W, 6);
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath();
  for(let x=0;x<VIEW_W;x+=26){
    const ox = ((x - (scroll % 26)) + 26) % 26;
    ctx.arc(x+ox, GROUND_Y+8+((x*7)%5), 2, 0, 7);
  }
  ctx.fill();
  // 地面斑驳小石子
  ctx.fillStyle = 'rgba(160,110,60,.35)';
  for(let i=0;i<14;i++){
    const seed = i*137.5;
    const x = ((seed - (scroll*0.92)) % (VIEW_W+40) + VIEW_W+40) % (VIEW_W+40) - 20;
    const y = GROUND_Y + 16 + (seed*13 % 60);
    const s = 2.5 + (seed*7 % 3);
    ctx.beginPath(); ctx.arc(x,y,s,0,7); ctx.fill();
  }
  // 前方跑道分界线（远景装饰线）
  ctx.strokeStyle = 'rgba(255,240,200,.5)'; ctx.lineWidth = 3; ctx.setLineDash([30, 46]);
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y+92); ctx.lineTo(VIEW_W, GROUND_Y+92); ctx.stroke();
  ctx.setLineDash([]);
}
function drawDecor(ctx, scroll){
  for(const d of G.decor){
    let x = d.x - ((scroll*0.95) % (VIEW_W*1.6));
    for(let k=-1;k<=1;k++){
      const bx = x + k*(VIEW_W*1.6);
      if(bx < -50 || bx > VIEW_W+50) continue;
      if(d.type==='cactus'){
        const s = d.s;
        ctx.fillStyle = 'rgba(76,128,74,.55)';
        rr(ctx, bx-8*s, GROUND_Y-58*s, 16*s, 58*s, 7*s); ctx.fill();
        rr(ctx, bx-26*s, GROUND_Y-40*s, 13*s, 22*s, 6*s); ctx.fill();
        rr(ctx, bx+13*s, GROUND_Y-46*s, 13*s, 26*s, 6*s); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(170,110,70,.5)';
        ctx.beginPath();
        ctx.moveTo(bx-26*d.s, GROUND_Y); ctx.lineTo(bx-12*d.s, GROUND_Y-30*d.s);
        ctx.lineTo(bx+14*d.s, GROUND_Y-24*d.s); ctx.lineTo(bx+26*d.s, GROUND_Y);
        ctx.closePath(); ctx.fill();
      }
    }
  }
}

// ================= 角色绘制：沙墨马 =================
function drawHorse(ctx, opts){
  const p = opts;
  const x = p.x, y = p.y;               // 脚底中心（整体平移基准）
  const phase = p.phase;
  const air = !p.onGround;
  const bob = p.onGround ? Math.sin(phase*2)*3 : 0;
  const tilt = p.onGround ? Math.sin(phase)*0.02 : (p.vy>0?0.06:-0.05);
  ctx.save();
  ctx.translate(x, y+bob);

  if(p.dead){
    // 摔倒：身体侧躺旋转
    const rot = Math.min(p.deadT*2.2, 1.25);
    ctx.rotate(rot);
  } else {
    ctx.rotate(tilt);
  }

  // 以下全部使用相对脚底中心的本地坐标
  const BODY_CY = -50, BODY_RX = 54, BODY_RY = 30;

  // 尾巴
  const tailWave = Math.sin(phase*1.6)*6 + (air?4:0);
  ctx.strokeStyle = '#8B5E34'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-BODY_RX+4, BODY_CY-6);
  ctx.quadraticCurveTo(-BODY_RX-22, BODY_CY-20+tailWave*0.6, -BODY_RX-34, BODY_CY-2+tailWave);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(107,69,38,.35)'; ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(-BODY_RX+4, BODY_CY-2);
  ctx.quadraticCurveTo(-BODY_RX-18, BODY_CY-16+tailWave*0.6, -BODY_RX-28, BODY_CY+2+tailWave);
  ctx.stroke();

  // 腿（后腿 & 前腿）
  const legAng = air ? (p.vy>0 ? -0.9 : 0.7) : 0;
  function leg(hx, hy, angBase, isFront){
    const sw = isFront ? Math.sin(phase+Math.PI) : Math.sin(phase);
    let ang = angBase + sw*0.85;
    if(air) ang = ang*0.35 + legAng*(isFront?-1:1)*0.8;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);
    const L = 46;
    ctx.fillStyle = '#F7E7CE';
    ctx.strokeStyle = 'rgba(107,69,38,.6)'; ctx.lineWidth = 2;
    rr(ctx, -6, -4, 13, L, 6); ctx.fill(); ctx.stroke();
    // 蹄子
    ctx.fillStyle = '#6B4526';
    rr(ctx, -7, L-16, 15, 16, 5); ctx.fill();
    ctx.restore();
  }
  // 绘制顺序：后腿→身体→前腿
  leg(-30, BODY_CY+8, 0.15, false);      // 后腿A
  leg(-8, BODY_CY+6, -0.1, false);       // 后腿B
  leg(26, BODY_CY+8, -0.12, true);       // 前腿A
  leg(46, BODY_CY+6, 0.18, true);        // 前腿B

  // 身体
  ctx.fillStyle = '#F7E7CE';
  ctx.strokeStyle = 'rgba(107,69,38,.55)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(0, BODY_CY, BODY_RX, BODY_RY, 0, 0, 7); ctx.fill(); ctx.stroke();
  // 腹部阴影
  ctx.fillStyle = 'rgba(139,94,52,.14)';
  ctx.beginPath();
  ctx.ellipse(4, BODY_CY+10, BODY_RX-14, BODY_RY-10, 0, 0, 7); ctx.fill();
  // 身体上马鞍小装饰（棕色小毯）
  ctx.fillStyle = '#E8A020';
  rr(ctx, -34, BODY_CY-16, 46, 20, 9); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  rr(ctx, -30, BODY_CY-13, 14, 7, 3); ctx.fill();
  rr(ctx, -8, BODY_CY-13, 16, 7, 3); ctx.fill();

  // 脖子 & 头
  const headX = 50, headY = BODY_CY-52;
  ctx.fillStyle = '#F7E7CE';
  ctx.strokeStyle = 'rgba(107,69,38,.55)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(26, BODY_CY-26);
  ctx.quadraticCurveTo(headX-6, BODY_CY-34, headX+2, headY-14);
  ctx.quadraticCurveTo(headX-14, headY+6, headX-24, headY+18);
  ctx.quadraticCurveTo(6, BODY_CY+2, 26, BODY_CY-26);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 头圆
  ctx.beginPath();
  ctx.ellipse(headX+4, headY, 25, 21, -0.15, 0, 7); ctx.fill(); ctx.stroke();
  // 口鼻部
  ctx.fillStyle = '#F0D9B2';
  ctx.beginPath();
  ctx.ellipse(headX+24, headY+10, 14, 11, 0, 0, 7); ctx.fill(); ctx.stroke();
  // 鼻孔
  ctx.fillStyle = '#8B5E34';
  ctx.beginPath(); ctx.arc(headX+30, headY+10, 2.2, 0, 7); ctx.fill();
  // 嘴巴微笑线
  ctx.strokeStyle = 'rgba(107,69,38,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(headX+19, headY+16, 7, 0.25*Math.PI, 0.8*Math.PI); ctx.stroke();

  // 鬃毛（随风飘）
  const maneWave = Math.sin(phase*1.8)*4 + (air?6:0);
  ctx.strokeStyle = '#8B5E34'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(headX-8, headY-16);
  ctx.quadraticCurveTo(headX-22, headY-20+maneWave*0.4, headX-30, headY-8+maneWave);
  ctx.stroke();
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(headX-14, headY-8);
  ctx.quadraticCurveTo(headX-26, headY-10+maneWave*0.4, headX-32, headY+2+maneWave);
  ctx.stroke();

  // 耳朵
  ctx.fillStyle = '#F7E7CE'; ctx.strokeStyle = 'rgba(107,69,38,.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(headX-10, headY-22, 7, 12, -0.35, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(headX+8, headY-24, 7, 12, 0.25, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#E8A0A0';
  ctx.beginPath(); ctx.ellipse(headX-9, headY-20, 3.5, 6, -0.35, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(headX+9, headY-22, 3.5, 6, 0.25, 0, 7); ctx.fill();

  // 眼睛
  const eyeX = headX+8, eyeY = headY-4;
  if(p.dead){
    ctx.strokeStyle = '#3A2E28'; ctx.lineWidth = 3.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(eyeX-5, eyeY-5); ctx.lineTo(eyeX+5, eyeY+5);
    ctx.moveTo(eyeX+5, eyeY-5); ctx.lineTo(eyeX-5, eyeY+5); ctx.stroke();
  } else {
    // 眨眼
    const blink = (G.t % 3.2) < 0.12;
    ctx.fillStyle = '#2E241F';
    if(!blink){
      ctx.beginPath(); ctx.ellipse(eyeX, eyeY, 8.5, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(eyeX-2.5, eyeY-3, 2.8, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.arc(eyeX+2.5, eyeY+2.5, 1.6, 0, 7); ctx.fill();
      // 睫毛
      ctx.strokeStyle = '#2E241F'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(eyeX-7, eyeY-7); ctx.lineTo(eyeX-11, eyeY-12);
      ctx.moveTo(eyeX-2, eyeY-9); ctx.lineTo(eyeX-3, eyeY-14);
      ctx.stroke();
    } else {
      ctx.lineWidth = 3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(eyeX-6, eyeY); ctx.lineTo(eyeX+6, eyeY); ctx.stroke();
    }
  }
  // 左眼（小）
  if(!p.dead && (G.t % 3.2) >= 0.12){
    ctx.fillStyle = '#2E241F';
    ctx.beginPath(); ctx.arc(headX-6, eyeY+1, 3.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath(); ctx.arc(headX-7, eyeY, 1.3, 0, 7); ctx.fill();
  }

  // 红围巾
  const scWave = Math.sin(phase*1.5)*5 + (air?8:0);
  ctx.fillStyle = '#E25B4A';
  ctx.strokeStyle = '#C4483A'; ctx.lineWidth = 2;
  rr(ctx, headX-16, BODY_CY-16, 22, 12, 5); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(headX-12, BODY_CY-9);
  ctx.quadraticCurveTo(headX-26, BODY_CY-4+scWave*0.5, headX-38, BODY_CY+4+scWave);
  ctx.lineTo(headX-30, BODY_CY+9+scWave*0.8);
  ctx.quadraticCurveTo(headX-18, BODY_CY+2, headX-14, BODY_CY-4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(headX-8, BODY_CY-8);
  ctx.quadraticCurveTo(headX-16, BODY_CY+6, headX-22, BODY_CY+10+scWave*0.8);
  ctx.lineTo(headX-15, BODY_CY+13+scWave*0.9);
  ctx.quadraticCurveTo(headX-8, BODY_CY+4, headX-8, BODY_CY-4);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 速度线
  if(!p.dead && !air){
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2.5; ctx.lineCap='round';
    for(let i=0;i<3;i++){
      const sx = -70 - ((G.t*30 + i*26) % 60);
      const sy = -58 + i*8;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx-14, sy);
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawCoinPickup(ctx, c){
  ctx.save();
  ctx.translate(c.x, c.y + Math.sin(G.t*3 + c.ph)*5);
  ctx.rotate(c.rot);
  const s = c.r;
  // 光晕
  const rg = ctx.createRadialGradient(0,0,s*0.3,0,0,s*1.6);
  rg.addColorStop(0,'rgba(255,201,60,.35)'); rg.addColorStop(1,'rgba(255,201,60,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0,0,s*1.6,0,7); ctx.fill();
  starPath(ctx, 0, 0, s, s*0.48, 0);
  ctx.fillStyle = '#FFC93C'; ctx.fill();
  ctx.strokeStyle = '#E8A020'; ctx.lineWidth = 2; ctx.stroke();
  starPath(ctx, 0, 0, s*0.55, s*0.26, Math.PI/5);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
  ctx.restore();
}
function drawCactus(ctx, x, w, h){
  ctx.fillStyle = '#5C9E5A';
  ctx.strokeStyle = '#48804A'; ctx.lineWidth = 2.5;
  rr(ctx, x-w/2, GROUND_Y-h, w, h, 8); ctx.fill(); ctx.stroke();
  // 分枝
  const bw = w*0.42;
  rr(ctx, x-w*0.62, GROUND_Y-h*0.62, bw, h*0.4, 6); ctx.fill(); ctx.stroke();
  rr(ctx, x+w*0.28, GROUND_Y-h*0.72, bw, h*0.46, 6); ctx.fill(); ctx.stroke();
  // 高光与刺
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x-w*0.18, GROUND_Y-h+12); ctx.lineTo(x-w*0.02, GROUND_Y-h+6); ctx.stroke();
  ctx.strokeStyle = 'rgba(46,80,44,.5)'; ctx.lineWidth = 1.4;
  for(let i=0;i<6;i++){
    const sy = GROUND_Y-h+10+i*((h-24)/6);
    ctx.beginPath(); ctx.moveTo(x+w/2+2, sy); ctx.lineTo(x+w/2+7, sy-3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-w/2-2, sy); ctx.lineTo(x-w/2-7, sy-3); ctx.stroke();
  }
  ctx.fillStyle = '#E8809A';
  ctx.beginPath(); ctx.arc(x, GROUND_Y-h-2, 7, 0, 7); ctx.fill();
  ctx.strokeStyle = '#C45A78'; ctx.lineWidth = 2; ctx.stroke();
}
function drawRock(ctx, x, w, h){
  ctx.fillStyle = '#A8794B';
  ctx.strokeStyle = '#8A6138'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x-w/2, GROUND_Y);
  ctx.lineTo(x-w*0.32, GROUND_Y-h);
  ctx.lineTo(x+w*0.1, GROUND_Y-h*0.8);
  ctx.lineTo(x+w*0.42, GROUND_Y-h);
  ctx.lineTo(x+w/2, GROUND_Y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,240,200,.4)';
  ctx.beginPath();
  ctx.moveTo(x-w*0.32, GROUND_Y-h);
  ctx.lineTo(x+w*0.1, GROUND_Y-h*0.8);
  ctx.lineTo(x+w*0.16, GROUND_Y-h*0.7);
  ctx.lineTo(x-w*0.22, GROUND_Y-h*0.82);
  ctx.closePath(); ctx.fill();
}
function drawTumble(ctx, x, r, roll){
  ctx.save();
  ctx.translate(x, GROUND_Y - r);
  ctx.rotate(roll);
  ctx.strokeStyle = '#C89A56'; ctx.lineWidth = 4; ctx.lineCap='round';
  for(let i=0;i<9;i++){
    const a = i*2*Math.PI/9;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.lineTo(Math.cos(a+0.45)*r*0.62, Math.sin(a+0.45)*r*0.62);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,r*0.55,0,7);
  ctx.strokeStyle = 'rgba(160,120,70,.7)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
  // 滚动尘土
  ctx.fillStyle = 'rgba(200,150,80,.4)';
  for(let i=0;i<3;i++){
    const a = roll*3 + i*2.1;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a)*r*1.5, GROUND_Y - r*0.4 + Math.sin(a*1.3)*r*0.5, 3, 0, 7);
    ctx.fill();
  }
}
function drawObstacle(ctx, o, scroll){
  const x = o.x - scroll;
  if(x < -120 || x > VIEW_W+120) return;
  switch(o.type){
    case 'cactus': drawCactus(ctx, x, o.w, o.h); break;
    case 'rock': drawRock(ctx, x, o.w, o.h); break;
    case 'tumble': drawTumble(ctx, x, o.r, o.roll); break;
  }
}

// ================= 粒子系统 =================
function spawnDust(n, pow){
  for(let i=0;i<n;i++){
    G.particles.push({
      type:'dust', x: PLAYER_X + rand(-14,14), y: G.player.y + rand(-4,2),
      vx: -G.speed*rand(0.25,0.5)*pow - rand(10,50), vy: -rand(20,90)*pow,
      g: 300, life: rand(0.35,0.7), max: 0.7, size: rand(4,9),
      color: 'rgba(232,196,140,'
    });
  }
}
function ringWave(){
  G.particles.push({ type:'ring', x: PLAYER_X, y: G.player.y-50, r: 10, vr: 260, life: 0.42, max: 0.42 });
}
function coinSpark(x,y){
  for(let i=0;i<10;i++){
    const a = rand(0,6.28), s = rand(60,220);
    G.particles.push({
      type:'spark', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 60,
      g: 500, life: rand(0.3,0.55), max: 0.55, size: rand(2.5,4.5),
      color: 'rgba(255,201,60,'
    });

function updateParticles(dt){
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.life -= dt;
    if(p.life<=0){ G.particles.splice(i,1); continue; }
    if(p.type==='ring'){ p.r += p.vr*dt; continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.g) p.vy += p.g*dt;
    if(p.type==='dust' && p.y > G.player.y+6){ p.y = G.player.y+6; p.vy = 0; p.vx *= 0.9; }
  }
}
function drawParticles(ctx){
  for(const p of G.particles){
    const a = clamp(p.life/p.max, 0, 1);
    if(p.type==='ring'){
      ctx.strokeStyle = `rgba(255,255,255,${a*0.8})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
      continue;
    }
    ctx.fillStyle = p.color + (a*0.7) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(0.5+a*0.5), 0, 7); ctx.fill();
  }
}
// 浮动文字
function addFloat(text, x, y, size, color, center){
  G.floats.push({ text, x, y, vy: center ? -26 : -70, life: 1.0, max: 1.0, size, color, center });
}
function updateFloats(dt){
  for(let i=G.floats.length-1;i>=0;i--){
    const f = G.floats[i];
    f.life -= dt; f.y += f.vy*dt;
    if(f.life<=0) G.floats.splice(i,1);
  }
}
function drawFloats(ctx){
  for(const f of G.floats){
    const a = clamp(f.life/f.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `24px 'ZCOOL KuaiLe','YouYuan','Microsoft YaHei',sans-serif`;
    ctx.textAlign = f.center ? 'center' : 'left';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(255,249,236,.9)';
    if(f.center){ ctx.font = `32px 'ZCOOL KuaiLe','YouYuan','Microsoft YaHei',sans-serif`; }
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

// ================= 生成器 =================
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function gapPx(){
  const t = clamp(G.runT/75, 0, 1);
  return G.speed * lerp(1.35, 0.82, t) * rand(0.9, 1.15);
}
function pickType(){
  const t = clamp(G.runT/80, 0, 1);
  const r = Math.random();
  if(r < 0.26 + 0.16*t) return 'cactus';
  if(r < 0.66) return 'rock';
  return 'tumble';
}
function spawnObstacle(x){
  const type = pickType();
  let o;
  if(type==='cactus') o = { type, x, w: rand(40,52), h: rand(96,132) };
  else if(type==='rock') o = { type, x, w: rand(56,74), h: rand(40,56) };
  else o = { type, x, r: rand(24,30), roll: 0 };
  G.obstacles.push(o);
}
function spawnCoinArc(x, n, h){
  const baseY = GROUND_Y - 60;
  for(let i=0;i<n;i++){
    const t = n>1 ? i/(n-1) : 0.5;
    G.pickups.push({
      x: x + i*46, y: baseY - Math.sin(t*Math.PI)*h,
      r: 15, rot: rand(0,3), ph: rand(0,6)
    });
  }
}
function spawnGroup(){
  const x = G.nextSpawn;            // 绝对世界坐标：本组生成位置
  const r = Math.random();
  if(r < 0.60){
    spawnObstacle(x);
    if(Math.random()<0.5) spawnCoinArc(x + 130 + rand(0,90), randInt(2,4), rand(60,110));
  } else if(r < 0.88){
    const n = randInt(4,6), h = rand(80,120);
    spawnCoinArc(x, n, h);
    if(Math.random()<0.35) spawnObstacle(x + n*46 + 250);
  } else {
    spawnObstacle(x);
    spawnObstacle(x + 330);
  }
  G.nextSpawn = x + gapPx();
}

// ================= 碰撞 =================
function playerBox(){
  const y = G.player.y;
  return { l: PLAYER_X-22, r: PLAYER_X+24, t: y-86, b: y };
}
function boxHit(a,b){ return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t; }
function circleHit(box, cx, cy, r){
  const nx = clamp(cx, box.l, box.r), ny = clamp(cy, box.t, box.b);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < r*r;
}
function checkCollisions(){
  const box = playerBox();
  for(const o of G.obstacles){
    const x = o.x - G.scrollX;
    if(x < -140 || x > VIEW_W+140) continue;
    if(o.type==='tumble'){
      if(circleHit(box, x, GROUND_Y - o.r + 6, o.r*0.78)) return die();
    } else {
      const ob = {
        l: x - o.w/2 + (o.type==='cactus'?6:8),
        r: x + o.w/2 - (o.type==='cactus'?6:8),
        t: GROUND_Y - o.h + (o.type==='cactus'?4:6),
        b: GROUND_Y
      };
      if(boxHit(box, ob)) return die();
    }
  }
}
function checkPickups(){
  for(let i=G.pickups.length-1;i>=0;i--){
    const c = G.pickups[i];
    const x = c.x - G.scrollX;
    if(x < -60 || x > VIEW_W+60){ G.pickups.splice(i,1); continue; }
    const dx = x - PLAYER_X, dy = c.y - G.player.y;
    if(dx*dx + dy*dy < 42*42){
      G.pickups.splice(i,1);
      G.coins++;
      Sfx.coin();
      coinSpark(x, c.y);
      addFloat('+1', x+14, c.y-16, 20, '#E8A020', false);
    }
  }
}
function die(){
  const p = G.player;
  if(p.dead) return;
  p.dead = true; p.deadT = 0; p.vy = -420;
  G.shake = 16; G.flashT = 0.28;
  Sfx.hit();
  spawnDust(12, 1.4);
}

// ================= 更新逻辑 =================
function update(dt){
  const p = G.player;
  G.runT += dt;
  // 速度提升
  G.speed = Math.min(MAX_SPEED, BASE_SPEED + G.runT*SPEED_RAMP);
  G.scrollX += G.speed * dt;
  G.meters = G.scrollX / METER_PER_PX;
  // 加速提示
  if(G.meters - G.lastHintM >= 200){
    G.lastHintM += 200;
    addFloat('沙墨马加速啦！', VIEW_W/2, 190, 32, '#C4483A', true);
    Sfx.tone('sine', 660, 990, 0.22, 0.14);
  }
  // 玩家物理
  const wasAir = !p.onGround;
  p.vy += GRAVITY*dt;
  p.y += p.vy*dt;
  if(p.y >= GROUND_Y){
    if(wasAir && p.vy > 260){
      spawnDust(7, 0.8); Sfx.land();
    }
    p.y = GROUND_Y; p.vy = 0; p.onGround = true; p.jumps = 0;
  }
  p.phase += dt * (0.32 + G.speed*0.0012);
  // 死亡处理
  if(p.dead){
    p.deadT += dt;
    G.speed = Math.max(0, G.speed - G.speed*4*dt);
    G.scrollX += G.speed*dt;
    if(p.deadT > 1.05) gameOver();
    return;
  }
  // 实体生成与清理
  if(G.scrollX + VIEW_W + 200 > G.nextSpawn) spawnGroup();
  for(let i=G.obstacles.length-1;i>=0;i--){
    if(G.obstacles[i].x - G.scrollX < -150) G.obstacles.splice(i,1);
  }
  for(const o of G.obstacles) if(o.type==='tumble') o.roll += dt*9;
  checkPickups();
  checkCollisions();
  // 云
  for(const c of G.clouds){ c.x -= c.v*dt; if(c.x < -120) c.x += VIEW_W*2.2; }
}
function updateDemo(dt){
  G.scrollX += 165*dt;
  G.speed = BASE_SPEED;
  G.player.phase += dt*0.36;
  G.player.y = GROUND_Y + Math.sin(G.t*1.4)*2;
  for(const c of G.clouds){ c.x -= c.v*dt; if(c.x < -120) c.x += VIEW_W*2.2; }
  for(const c of G.demoCoins) c.rot += dt*2.2;
}
function updateOver(dt){
  G.scrollX += 55*dt;
  for(const c of G.clouds){ c.x -= c.v*dt; if(c.x < -120) c.x += VIEW_W*2.2; }
}
// 通用帧更新（粒子/浮字/震屏在所有模式都推进）
function updateFx(dt){
  updateParticles(dt);
  updateFloats(dt);
  if(G.shakeT > 0){ G.shakeT -= dt; G.shake = Math.max(0, G.shake*0.92); }
  if(G.flashT > 0) G.flashT -= dt;
}

// ================= 渲染 =================
function render(){
  const ctx = G.ctx;
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  const shake = G.shakeT>0 ? G.shake : 0;
  ctx.save();
  if(shake>0.3) ctx.translate(rand(-shake,shake)*0.5, rand(-shake,shake)*0.5);

  drawSky(ctx);
  drawSun(ctx);
  drawClouds(ctx);
  drawMesas(ctx, G.scrollX);
  drawDunes(ctx, G.scrollX, G.duneB, 0.28, '#E8B46A', GROUND_Y+6);
  drawDunes(ctx, G.scrollX, G.duneA, 0.45, '#F0C67E', GROUND_Y+4);
  drawGround(ctx, G.scrollX);
  drawDecor(ctx, G.scrollX);

  // 金币
  for(const c of G.pickups) drawCoinPickup(ctx, { x: c.x - G.scrollX, y: c.y, r: c.r, rot: c.rot, ph: c.ph });
  // 障碍
  for(const o of G.obstacles) drawObstacle(ctx, o, G.scrollX);

  // 玩家
  const p = G.player;
  drawHorse(ctx, {
    x: PLAYER_X, y: p.y, phase: p.phase, onGround: p.onGround, vy: p.vy,
    dead: p.dead, deadT: p.deadT
  });

  // 标题页装饰金币
  if(G.mode==='title'){
    for(const c of G.demoCoins){
      drawCoinPickup(ctx, { x: c.x, y: c.y, r: c.r, rot: c.rot, ph: c.ph });
    }
  }

  drawParticles(ctx);
  drawFloats(ctx);
  ctx.restore();

  // 碰撞闪白
  if(G.flashT > 0){
    ctx.fillStyle = `rgba(255,255,255,${clamp(G.flashT/0.28,0,1)*0.55})`;
    ctx.fillRect(0,0,VIEW_W,VIEW_H);
  }
  // 顶部浅遮罩让 HUD 更清晰
  const hg = ctx.createLinearGradient(0,0,0,90);
  hg.addColorStop(0,'rgba(255,249,236,.22)'); hg.addColorStop(1,'rgba(255,249,236,0)');
  ctx.fillStyle = hg; ctx.fillRect(0,0,VIEW_W,90);
}

// ================= UI 控制 =================
function resetRun(){
  G.scrollX = 0; G.speed = BASE_SPEED; G.runT = 0;
  G.coins = 0; G.meters = 0; G.lastHintM = 0;
  G.obstacles.length = 0; G.pickups.length = 0;
  G.particles.length = 0; G.floats.length = 0;
  const p = G.player;
  p.y = GROUND_Y; p.vy = 0; p.onGround = true; p.jumps = 0;
  p.dead = false; p.deadT = 0; p.phase = 0;
  G.nextSpawn = G.scrollX + 780;
  G.shake = 0; G.shakeT = 0; G.flashT = 0;
  updateHUD(true);
}
function startGame(){
  resetRun();
  G.mode = 'playing';
  document.getElementById('titleOverlay').classList.add('hidden');
  document.getElementById('overOverlay').classList.add('hidden');
  showPause(false);
  document.getElementById('pauseBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>';
  Sfx.ui();
}
function gameOver(){
  G.mode = 'over';
  G.shake = 0; G.shakeT = 0;
  const m = Math.floor(G.meters);
  const isRecord = m > G.best;
  if(isRecord){
    G.best = m;
    try{ localStorage.setItem('shamo_best', String(m)); }catch(e){}
  }
  document.getElementById('rMeter').textContent = m;
  document.getElementById('rCoin').textContent = G.coins;
  document.getElementById('rBest').textContent = G.best;
  document.getElementById('newRecord').classList.toggle('hidden', !isRecord);
  document.getElementById('overOverlay').classList.remove('hidden');
  G.hintShown = false;
}
function updateHUD(force){
  const m = Math.floor(G.meters);
  const elM = document.getElementById('meterVal');
  const elC = document.getElementById('coinVal');
  if(force || elM._v !== m){ elM._v = m; elM.textContent = m; }
  if(force || elC._v !== G.coins){ elC._v = G.coins; elC.textContent = G.coins; }
}

// ================= 主循环 =================
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.033);
  last = now;
  G.t += dt;
  if(G.mode === 'playing'){ update(dt); updateHUD(false); }
  else if(G.mode === 'title'){ updateDemo(dt); }
  else if(G.mode === 'over'){ updateOver(dt); }
  updateFx(dt);
  render();
  requestAnimationFrame(loop);
}

// ================= 初始化 =================
function init(){
  initCanvas();
  makeClouds(); makeMesas(); makeDunes(); makeDecor();
  G.demoCoins = [
    { x: 120, y: 120, r: 18, rot: 0, ph: 0 },
    { x: 840, y: 100, r: 20, rot: 0, ph: 2 },
    { x: 480, y: 70, r: 16, rot: 0, ph: 4 },
  ];
  document.getElementById('bestShow').textContent = G.best || 0;
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  // 暂停按钮图标切换
  const pBtn = document.getElementById('pauseBtn');
  const origPause = pBtn.innerHTML;
  window.addEventListener('keydown', (e)=>{
    if(e.code==='KeyP' || e.code==='Escape'){
      pBtn.innerHTML = (G.mode==='paused')
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'
        : origPause;
    }
  });
  updateHUD(true);
  requestAnimationFrame(loop);
}
init();
</script>
